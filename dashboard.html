<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - kura kura hijau</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./theme.css" />
  <script src="./config.js"></script>
</head>

<body>
  <div class="stage">
    <header class="topbar">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-emerald-600 text-white grid place-items-center font-extrabold">KK</div>
          <div class="leading-tight">
            <div class="font-semibold">kura kura hijau</div>
            <div class="text-xs text-emerald-700">Dashboard</div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <a href="./kelas.html" class="px-4 py-2 rounded-xl border border-emerald-200 bg-white/70 font-semibold">
            Kembali
          </a>
          <button id="logoutBtn" class="px-4 py-2 rounded-xl border border-rose-200 bg-white/70 font-semibold text-rose-700">
            Log keluar
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">
      <div class="text-center mt-6 mb-10">
        <h1 class="text-6xl font-extrabold tracking-tight text-emerald-900">Dashboard</h1>
        <p class="mt-3 text-slate-700">Ringkasan akaun & status login.</p>
        <div id="status" class="mt-4 text-sm font-semibold text-rose-600"></div>
        <div id="debug" class="mt-2 text-xs text-slate-400"></div>
      </div>

      <div class="grid md:grid-cols-2 gap-6">
        <div class="card">
          <div class="text-xl font-bold">Profil</div>
          <div class="text-sm text-slate-600 mt-1">Data diambil dari API (action=me).</div>

          <div id="userBox" class="mt-5 hidden">
            <div class="p-4 rounded-2xl border border-white/60 bg-white/60">
              <div class="text-sm"><span class="font-semibold">Nama:</span> <span id="uName">-</span></div>
              <div class="text-sm mt-1"><span class="font-semibold">Email:</span> <span id="uEmail">-</span></div>
              <div class="text-sm mt-1"><span class="font-semibold">Role:</span> <span id="uRole">-</span></div>
            </div>
          </div>

          <div id="loading" class="mt-5 text-sm text-slate-600">Loading…</div>
        </div>

        <div class="card">
          <div class="text-xl font-bold">Aksi</div>
          <div class="text-sm text-slate-600 mt-1">Utility untuk bersihkan token kalau rosak.</div>

          <div class="mt-5 space-y-3">
            <button id="hardResetBtn" class="btn-primary w-full">
              Hard reset token
            </button>
            <p class="text-xs text-slate-500">
              * Hard reset akan buang token semasa + legacy token (kkh_token/kkh_user) kalau masih wujud.
            </p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ---------- CONFIG ----------
    const CFG = window.APP_CONFIG || {};
    const BASE = (CFG.BASE_URL || "").trim();
    const KEY  = (CFG.API_KEY || "").trim();
    const TOKEN_KEY = (CFG.TOKEN_KEY || "kk_token").trim();

    const $ = (id) => document.getElementById(id);

    function setStatus(msg="") { $("status").textContent = msg; }
    function setDebug(msg="")  { $("debug").textContent = msg; }

    // ---------- TOKEN ----------
    function cleanToken(t) {
      if (!t) return "";
      t = String(t).trim();
      if (t.toLowerCase().startsWith("bearer ")) t = t.slice(7).trim();
      t = t.replace(/^"+|"+$/g, "");
      return t.trim();
    }

    function getToken() {
      return cleanToken(localStorage.getItem(TOKEN_KEY));
    }

    function clearAllTokens() {
      localStorage.removeItem(TOKEN_KEY);

      // legacy keys (buang terus supaya tak kacau lagi)
      localStorage.removeItem("kkh_token");
      localStorage.removeItem("kkh_user");
      localStorage.removeItem("kk_token"); // just in case
      localStorage.removeItem("kkh_token_v1");
    }

    // ---------- API ----------
    function buildUrl(action, params={}) {
      if (!BASE) throw new Error("BASE_URL kosong. Semak config.js.");
      const url = new URL(BASE);
      url.searchParams.set("action", action);
      if (KEY) url.searchParams.set("key", KEY);
      Object.entries(params).forEach(([k,v]) => {
        if (v !== undefined && v !== null && String(v).length) url.searchParams.set(k, v);
      });
      return url.toString();
    }

    async function apiGet(action, params={}) {
      const res = await fetch(buildUrl(action, params), { method: "GET" });
      return await res.json();
    }

    // ---------- AUTH GUARD ----------
    async function loadMe() {
      $("loading").classList.remove("hidden");
      $("userBox").classList.add("hidden");

      if (!BASE || !KEY) {
        setStatus("config.js belum betul (BASE_URL / API_KEY).");
        $("loading").textContent = "config missing.";
        return;
      }

      const token = getToken();
      if (!token) {
        setStatus("Tiada token. Sila login semula.");
        window.location.href = "./index.html";
        return;
      }

      try {
        const j = await apiGet("me", { token });
        if (!j || !j.ok || !j.user) throw new Error(j.error || j.message || "Token invalid");

        const u = j.user;
        $("uName").textContent = u.name || "-";
        $("uEmail").textContent = u.email || "-";
        $("uRole").textContent = (u.isAdmin || String(u.role).toLowerCase() === "admin") ? "Admin" : "Pelajar";

        $("loading").classList.add("hidden");
        $("userBox").classList.remove("hidden");
        setStatus("Token ok ✅");
      } catch (e) {
        clearAllTokens();
        setStatus("Token rosak / invalid. Aku dah reset. Sila login semula.");
        $("loading").textContent = "Token invalid.";
        setTimeout(() => window.location.href = "./index.html", 900);
      }
    }

    function logout() {
      clearAllTokens();
      window.location.href = "./index.html";
    }

    // ---------- EVENTS ----------
    $("logoutBtn").addEventListener("click", logout);

    $("hardResetBtn").addEventListener("click", () => {
      clearAllTokens();
      setStatus("Hard reset siap ✅ Sila login semula.");
      setTimeout(() => window.location.href = "./index.html", 600);
    });

    (async function init(){
      setDebug(`BASE=${BASE ? "ok" : "missing"} | TOKEN_KEY=${TOKEN_KEY}`);
      await loadMe();
    })();
  </script>
</body>
</html>
