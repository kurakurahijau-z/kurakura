<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelas — kura kura hijau</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./theme.css" />
  <script src="./config.js"></script>
</head>

<body>
  <div class="stage">
    <!-- Topbar -->
    <header class="topbar">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-emerald-600 text-white grid place-items-center font-extrabold">KK</div>
          <div class="leading-tight">
            <div class="font-semibold">kura kura hijau</div>
            <div class="text-xs text-emerald-700">Kelas</div>
          </div>
        </div>

        <button id="btnLogout" class="px-4 py-2 rounded-2xl border border-emerald-200 bg-white/70 hover:bg-white font-semibold">
          Log keluar
        </button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-12">
      <div class="text-center">
        <h1 class="text-5xl font-extrabold text-emerald-900">Senarai Kelas</h1>
        <p class="mt-3 text-slate-600">Kelas yang tersedia untuk akaun anda.</p>
        <div id="status" class="mt-4 text-sm"></div>
      </div>

      <div class="mt-10 grid gap-6 md:grid-cols-2">
        <!-- Left: Kelas -->
        <section class="card">
          <div class="flex items-center justify-between">
            <div class="font-bold text-lg">Kelas Aktif</div>
            <button id="btnRefresh" class="text-emerald-700 font-semibold hover:underline">Refresh</button>
          </div>
          <div id="kelasList" class="mt-4 text-sm text-slate-600">Loading kelas...</div>
        </section>

        <!-- Right: Join / Create (role-aware bila me() ada isAdmin) -->
        <section class="card">
          <div class="font-bold text-lg">Aksi</div>
          <div class="text-sm text-slate-500 mt-1" id="who"></div>

          <div class="mt-5 space-y-4">
            <div>
              <div class="text-sm font-semibold">Join kelas (student)</div>
              <div class="text-xs text-slate-500">Masukkan class code.</div>
              <div class="mt-2 flex gap-2">
                <input id="classCode" class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white/70"
                  placeholder="cth: PMS-ABC123" />
                <button id="btnJoin" class="btn-primary">Join</button>
              </div>
              <div id="joinMsg" class="text-sm mt-2"></div>
            </div>

            <div id="adminBox" class="hidden">
              <div class="text-sm font-semibold">Create kelas (admin)</div>
              <div class="text-xs text-slate-500">Nama kelas untuk dijana.</div>
              <div class="mt-2 space-y-2">
                <input id="className" class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white/70"
                  placeholder="cth: DUP4A Accounting" />
                <button id="btnCreate" class="btn-primary w-full">Create</button>
                <div id="createMsg" class="text-sm mt-1"></div>
              </div>
            </div>

            <div class="pt-2 text-xs text-slate-400" id="debug"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    // ---------- CONFIG ----------
    const CFG = window.APP_CONFIG || {};
    const BASE = (CFG.BASE_URL || "").trim();
    const KEY  = (CFG.API_KEY || "").trim();
    const TOKEN_KEY = (CFG.TOKEN_KEY || "kk_token").trim();

    const $ = (id) => document.getElementById(id);

    function setStatus(text, ok=true){
      const el = $("status");
      el.textContent = text || "";
      el.className = ok ? "mt-4 text-sm text-emerald-700" : "mt-4 text-sm text-rose-700";
    }

    function setSmallMsg(id, text, ok=true){
      const el = $(id);
      el.textContent = text || "";
      el.className = ok ? "text-sm text-emerald-700" : "text-sm text-rose-700";
    }

    function getToken(){
      return localStorage.getItem(TOKEN_KEY) || "";
    }

    function buildUrl(action, params={}){
      if (!BASE) throw new Error("BASE_URL kosong. Semak config.js.");
      const url = new URL(BASE);
      url.searchParams.set("action", action);
      if (KEY) url.searchParams.set("key", KEY);
      Object.entries(params).forEach(([k,v]) => {
        if (v !== undefined && v !== null && String(v).length) url.searchParams.set(k, v);
      });
      return url.toString();
    }

    async function apiGet(action, params={}){
      const res = await fetch(buildUrl(action, params), { method: "GET" });
      return await res.json();
    }

    async function apiPost(action, body={}, params={}){
      const res = await fetch(buildUrl(action, params), {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body || {})
      });
      return await res.json();
    }

    // ---------- LOAD ME + CLASSES ----------
    let ME = null;

    async function loadMe(){
      const token = getToken();
      if (!token){
        setStatus("Token tak jumpa. Pergi index.html untuk login.", false);
        $("kelasList").textContent = "Tiada token.";
        return null;
      }

      try{
        const data = await apiGet("me", { token });
        if (!data || !data.ok){
          setStatus(data?.error || data?.message || "Token tak sah. Sila login semula.", false);
          return null;
        }
        ME = data.user || data.me || data;
        return ME;
      }catch(e){
        setStatus("Failed to fetch (network/CORS/BASE_URL).", false);
        return null;
      }
    }

    // IMPORTANT: action ni ikut backend kau.
    // Kalau backend kau guna nama lain (contoh: listClasses / myClasses), bagitahu aku — aku adjust.
    async function loadClasses(){
      const token = getToken();
      $("kelasList").textContent = "Loading kelas...";
      try{
        // Cuba beberapa nama action yang biasa orang guna (fallback)
        const tries = ["listClasses", "myClasses", "classes"];
        let data = null;

        for (const act of tries){
          data = await apiGet(act, { token });
          if (data && data.ok) { data.__act = act; break; }
        }

        if (!data || !data.ok){
          $("kelasList").textContent = "";
          setStatus(data?.error || data?.message || "Tak dapat load kelas (action tak match backend).", false);
          return;
        }

        const classes = data.classes || data.items || [];
        $("debug").textContent = `loadClasses action: ${data.__act || "unknown"} | count: ${classes.length}`;

        if (!classes.length){
          $("kelasList").innerHTML = "<div class='text-slate-600'>Belum ada kelas untuk akaun ini.</div>";
          setStatus("Ok. Tiada kelas lagi.", true);
          return;
        }

        $("kelasList").innerHTML = classes.map(c => {
          const name = c.name || c.className || "Untitled";
          const code = c.code || c.classCode || "";
          const id = c.id || c.classId || "";
          return `
            <div class="p-4 rounded-2xl bg-white/60 border border-white/60 mb-3">
              <div class="font-semibold">${escapeHtml(name)}</div>
              <div class="text-xs text-slate-500 mt-1">Code: <span class="font-mono">${escapeHtml(code)}</span></div>
              <div class="text-xs text-slate-400 mt-1">ID: <span class="font-mono">${escapeHtml(id)}</span></div>
              <div class="mt-3">
                <a class="text-emerald-700 font-semibold hover:underline" href="./dashboard.html?classId=${encodeURIComponent(id)}">Buka dashboard →</a>
              </div>
            </div>
          `;
        }).join("");

        setStatus("Kelas loaded ✅", true);
      }catch(e){
        $("kelasList").textContent = "Gagal load kelas.";
        setStatus("Failed to fetch (network/CORS/BASE_URL).", false);
      }
    }

    function escapeHtml(s){
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
    }

    // ---------- ACTIONS: JOIN/CREATE/LOGOUT ----------
    async function joinClass(){
      const token = getToken();
      const code = ($("classCode").value || "").trim();
      if (!code) return setSmallMsg("joinMsg","Class code diperlukan.", false);

      setSmallMsg("joinMsg","Joining...", true);

      try{
        // cuba joinClass dulu; kalau backend pakai enrollClass pun kita fallback
        const tries = ["joinClass", "enrollClass", "join"];
        let data = null;

        for (const act of tries){
          data = await apiPost(act, { classCode: code }, { token });
          if (data && data.ok) { data.__act = act; break; }
        }

        if (!data || !data.ok) return setSmallMsg("joinMsg", data?.error || data?.message || "Join gagal.", false);

        setSmallMsg("joinMsg", `Join berjaya ✅ (${data.__act})`, true);
        await loadClasses();
      }catch(e){
        setSmallMsg("joinMsg","Failed to fetch (network/CORS).", false);
      }
    }

    async function createClass(){
      const token = getToken();
      const name = ($("className").value || "").trim();
      if (!name) return setSmallMsg("createMsg","Nama kelas diperlukan.", false);

      setSmallMsg("createMsg","Creating...", true);

      try{
        const tries = ["createClass", "newClass"];
        let data = null;

        for (const act of tries){
          data = await apiPost(act, { name }, { token });
          if (data && data.ok) { data.__act = act; break; }
        }

        if (!data || !data.ok) return setSmallMsg("createMsg", data?.error || data?.message || "Create gagal.", false);

        setSmallMsg("createMsg", `Create berjaya ✅ (${data.__act})`, true);
        $("className").value = "";
        await loadClasses();
      }catch(e){
        setSmallMsg("createMsg","Failed to fetch (network/CORS).", false);
      }
    }

    function logout(){
      localStorage.removeItem(TOKEN_KEY);
      window.location.href = "./index.html";
    }

    // ---------- INIT ----------
    $("btnLogout").addEventListener("click", logout);
    $("btnRefresh").addEventListener("click", loadClasses);
    $("btnJoin").addEventListener("click", joinClass);
    $("btnCreate").addEventListener("click", createClass);

    (async function init(){
      if (!BASE) {
        setStatus("BASE_URL kosong. Semak config.js.", false);
        return;
      }

      const me = await loadMe();
      if (!me) return;

      const name = me.name || me.email || "User";
      const isAdmin = !!(me.isAdmin || me.admin);

      $("who").textContent = `Login sebagai: ${name}${isAdmin ? " (admin)" : " (student)"}`;
      $("adminBox").classList.toggle("hidden", !isAdmin);

      setStatus("Token ok ✅", true);
      $("debug").textContent = `BASE ok | TOKEN_KEY=${TOKEN_KEY}`;
      await loadClasses();
    })();
  </script>
</body>
</html>
