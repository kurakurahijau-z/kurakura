<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelas - kura kura hijau</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./theme.css" />
  <script src="./config.js"></script>
</head>

<body>
  <div class="stage">
    <header class="topbar">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-emerald-600 text-white grid place-items-center font-extrabold">KK</div>
          <div class="leading-tight">
            <div class="font-semibold">kura kura hijau</div>
            <div class="text-xs text-emerald-700">Kelas</div>
          </div>
        </div>

        <button id="logoutBtn" class="px-4 py-2 rounded-xl border border-emerald-200 bg-white/70 font-semibold">
          Log keluar
        </button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">
      <div class="text-center mt-6 mb-10">
        <h1 class="text-6xl font-extrabold tracking-tight text-emerald-900">Senarai Kelas</h1>
        <p class="mt-3 text-slate-700">Kelas yang tersedia untuk akaun anda.</p>
        <div id="status" class="mt-4 text-sm font-semibold text-red-600"></div>
      </div>

      <div class="grid md:grid-cols-2 gap-6">
        <div class="card">
          <div class="flex items-center justify-between">
            <div class="text-xl font-bold">Kelas Aktif</div>
            <button id="refreshBtn" class="text-emerald-700 font-semibold hover:underline">Refresh</button>
          </div>
          <div id="kelasList" class="mt-4 text-slate-700 text-sm">Loading kelas...</div>
        </div>

        <div class="card">
          <div class="text-xl font-bold">Aksi</div>

          <div id="aksiStudent" class="mt-4">
            <div class="font-semibold">Join kelas (student)</div>
            <div class="text-sm text-slate-600">Masukkan class code.</div>
            <div class="mt-3 flex gap-2">
              <input id="classCode" placeholder="cth: PMS-ABC123"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-200 bg-white/80" />
              <button id="joinBtn" class="btn-primary">Join</button>
            </div>
          </div>

          <div id="aksiAdmin" class="mt-4 hidden">
            <div class="font-semibold">Admin mode</div>
            <div class="text-sm text-slate-600">Admin akan nampak semua kelas (listClasses).</div>
          </div>

          <div id="aksiMsg" class="mt-4 text-sm"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const CFG = window.APP_CONFIG || {};
    const BASE_URL = CFG.BASE_URL || "";
    const API_KEY = CFG.API_KEY || "";
    const TOKEN_KEY = CFG.TOKEN_KEY || "kk_token";

    function qs(obj) {
      const p = new URLSearchParams();
      Object.entries(obj || {}).forEach(([k,v]) => {
        if (v !== undefined && v !== null && String(v).length) p.set(k, v);
      });
      return p.toString();
    }

    function apiUrl(action, extraParams) {
      const q = qs({ action, key: API_KEY, ...(extraParams||{}) });
      return `${BASE_URL}?${q}`;
    }

    function cleanToken(t) {
      if (!t) return "";
      t = String(t).trim();
      if (t.toLowerCase().startsWith("bearer ")) t = t.slice(7).trim();
      t = t.replace(/^"+|"+$/g, "");
      return t.trim();
    }

    function getToken() {
      return cleanToken(localStorage.getItem(TOKEN_KEY));
    }
    function clearToken() {
      localStorage.removeItem(TOKEN_KEY);
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg || "";
    }
    function setAksiMsg(msg, type="info") {
      const el = document.getElementById("aksiMsg");
      el.textContent = msg || "";
      el.className = "mt-4 text-sm " + (type==="err" ? "text-red-600" : type==="ok" ? "text-emerald-700" : "text-slate-700");
    }

    async function apiGet(action, params) {
      const token = getToken();
      const url = apiUrl(action, { token, ...(params||{}) });
      const r = await fetch(url);
      return await r.json();
    }

    async function apiPost(action, body) {
      const token = getToken();
      const url = apiUrl(action, { token });
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      return await r.json();
    }

    // --------- main flow ----------
    let ME = null;

    async function validateMe() {
      if (!BASE_URL || !API_KEY) {
        setStatus("config.js belum betul (BASE_URL / API_KEY).");
        return false;
      }

      const token = getToken();
      if (!token) {
        window.location.href = "./index.html";
        return false;
      }

      try {
        const j = await apiGet("me");
        if (!j.ok) throw new Error(j.error || j.message || "Token invalid");
        ME = j.user;
        return true;
      } catch (e) {
        // ini part paling penting untuk error "Invalid token format"
        clearToken();
        setStatus("Token rosak / invalid. Aku clear token. Sila login semula.");
        setTimeout(() => window.location.href = "./index.html", 900);
        return false;
      }
    }

    function renderList(items, modeLabel) {
      const wrap = document.getElementById("kelasList");
      if (!items || !items.length) {
        wrap.innerHTML = `<div class="text-slate-600">Tiada kelas (${modeLabel}).</div>`;
        return;
      }

      wrap.innerHTML = items.map(x => `
        <div class="p-4 rounded-2xl border border-white/60 bg-white/60 mb-3">
          <div class="font-bold text-slate-900">${escapeHtml(x.className || "(no name)")}</div>
          <div class="text-slate-600 text-sm">
            ${escapeHtml(x.year || "")} ${x.semester ? "• " + escapeHtml(x.semester) : ""}
          </div>
          ${x.classCode ? `<div class="mt-2 text-xs text-slate-500">Code: <span class="font-mono">${escapeHtml(x.classCode)}</span></div>` : ""}
        </div>
      `).join("");
    }

    function escapeHtml(s) {
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    async function loadKelas() {
      setStatus("");
      document.getElementById("kelasList").textContent = "Loading kelas...";
      setAksiMsg("");

      if (!ME) return;

      // toggle UI by role
      const isAdmin = ME.isAdmin === true || String(ME.role||"").toLowerCase()==="admin";
      document.getElementById("aksiStudent").classList.toggle("hidden", isAdmin);
      document.getElementById("aksiAdmin").classList.toggle("hidden", !isAdmin);

      try {
        if (isAdmin) {
          const j = await apiGet("listClasses");
          if (!j.ok) throw new Error(j.error || j.message || "listClasses failed");
          renderList(j.classes || [], "admin:listClasses");
        } else {
          const j = await apiGet("myEnrollments");
          if (!j.ok) throw new Error(j.error || j.message || "myEnrollments failed");
          // myEnrollments dah siap ada className/year/semester
          renderList(j.enrollments || [], "student:myEnrollments");
        }
      } catch (e) {
        setStatus(String(e.message || e));
        document.getElementById("kelasList").textContent = "Gagal load kelas.";
      }
    }

    async function joinKelas() {
      setAksiMsg("");
      const code = document.getElementById("classCode").value.trim();
      if (!code) return setAksiMsg("Masukkan class code dulu.", "err");

      try {
        const j = await apiPost("enroll", { classCode: code });
        if (!j.ok) throw new Error(j.error || j.message || "Enroll failed");
        setAksiMsg("Join berjaya. Aku refresh senarai.", "ok");
        await loadKelas();
      } catch (e) {
        setAksiMsg(String(e.message || e), "err");
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadKelas);
    document.getElementById("joinBtn").addEventListener("click", joinKelas);
    document.getElementById("logoutBtn").addEventListener("click", () => {
      clearToken();
      window.location.href = "./index.html";
    });

    (async () => {
      const ok = await validateMe();
      if (ok) await loadKelas();
    })();
  </script>
</body>
</html>
