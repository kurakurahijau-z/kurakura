<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelas - kura kura hijau</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./theme.css" />
  <script src="./config.js"></script>
</head>

<body>
  <div class="stage">
    <header class="topbar">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-emerald-600 text-white grid place-items-center font-extrabold">KK</div>
          <div class="leading-tight">
            <div class="font-semibold">kura kura hijau</div>
            <div class="text-xs text-emerald-700">Kelas</div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <a href="./dashboard.html" class="px-4 py-2 rounded-xl border border-emerald-200 bg-white/70 font-semibold">
            Dashboard
          </a>
          <button id="logoutBtn" class="px-4 py-2 rounded-xl border border-emerald-200 bg-white/70 font-semibold">
            Log keluar
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">
      <div class="text-center mt-6 mb-10">
        <h1 class="text-6xl font-extrabold tracking-tight text-emerald-900">Senarai Kelas</h1>
        <p class="mt-3 text-slate-700">Kelas yang tersedia untuk akaun anda.</p>
        <div id="status" class="mt-4 text-sm font-semibold text-rose-600"></div>
        <div id="debug" class="mt-2 text-xs text-slate-400"></div>
      </div>

      <div class="grid md:grid-cols-2 gap-6">
        <div class="card">
          <div class="flex items-center justify-between">
            <div class="text-xl font-bold">Kelas</div>
            <button id="refreshBtn" class="text-emerald-700 font-semibold hover:underline">Refresh</button>
          </div>
          <div id="kelasList" class="mt-4 text-slate-700 text-sm">Loading kelas…</div>
        </div>

        <div class="card">
          <div class="text-xl font-bold">Aksi</div>

          <div id="aksiStudent" class="mt-4">
            <div class="font-semibold">Join kelas (pelajar)</div>
            <div class="text-sm text-slate-600">Masukkan <b>class code</b> yang diberi oleh admin.</div>
            <div class="mt-3 flex gap-2">
              <input id="classCode" placeholder="cth: PMS-FAIZAL-2026-SEM1-ABC"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-200 bg-white/80" />
              <button id="joinBtn" class="btn-primary">Join</button>
            </div>
          </div>

          <div id="aksiAdmin" class="mt-4 hidden">
            <div class="font-semibold">Admin mode</div>
            <div class="text-sm text-slate-600">Admin akan nampak semua kelas aktif & class code.</div>
          </div>

          <div id="aksiMsg" class="mt-4 text-sm"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ---------- CONFIG ----------
    const CFG = window.APP_CONFIG || {};
    const BASE = (CFG.BASE_URL || "").trim();
    const KEY  = (CFG.API_KEY || "").trim();
    const TOKEN_KEY = (CFG.TOKEN_KEY || "kk_token").trim();

    const $ = (id) => document.getElementById(id);

    function setStatus(msg="") { $("status").textContent = msg; }
    function setDebug(msg="")  { $("debug").textContent = msg; }

    function setAksiMsg(msg="", type="info") {
      const el = $("aksiMsg");
      el.textContent = msg || "";
      el.className = "mt-4 text-sm " + (type==="err" ? "text-rose-600" : type==="ok" ? "text-emerald-700" : "text-slate-700");
    }

    // ---------- TOKEN ----------
    function cleanToken(t) {
      if (!t) return "";
      t = String(t).trim();
      if (t.toLowerCase().startsWith("bearer ")) t = t.slice(7).trim();
      t = t.replace(/^"+|"+$/g, "");
      return t.trim();
    }

    function getToken() {
      return cleanToken(localStorage.getItem(TOKEN_KEY));
    }

    function clearAllTokens() {
      localStorage.removeItem(TOKEN_KEY);
      // legacy buang sekali
      localStorage.removeItem("kkh_token");
      localStorage.removeItem("kkh_user");
      localStorage.removeItem("kk_token");
    }

    // ---------- API HELPERS ----------
    function buildUrl(action, params={}) {
      if (!BASE) throw new Error("BASE_URL kosong. Semak config.js.");
      const url = new URL(BASE);
      url.searchParams.set("action", action);
      if (KEY) url.searchParams.set("key", KEY);
      Object.entries(params).forEach(([k,v]) => {
        if (v !== undefined && v !== null && String(v).length) url.searchParams.set(k, v);
      });
      return url.toString();
    }

    async function apiGet(action, params={}) {
      const res = await fetch(buildUrl(action, params), { method: "GET" });
      return await res.json();
    }

    // POST guna text/plain untuk elak preflight drama Apps Script
    async function apiPost(action, body={}, params={}) {
      const res = await fetch(buildUrl(action, params), {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body || {})
      });
      return await res.json();
    }

    // ---------- MAIN ----------
    let ME = null;

    async function loadMe() {
      if (!BASE || !KEY) {
        setStatus("config.js belum betul (BASE_URL / API_KEY).");
        return null;
      }

      const token = getToken();
      if (!token) {
        window.location.href = "./index.html";
        return null;
      }

      try {
        const j = await apiGet("me", { token });
        if (!j || !j.ok) throw new Error(j.error || j.message || "Token invalid");
        return j.user;
      } catch (e) {
        clearAllTokens();
        setStatus("Token rosak / invalid. Aku clear token. Sila login semula.");
        setTimeout(() => window.location.href = "./index.html", 900);
        return null;
      }
    }

    function escapeHtml(s) {
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function renderList(items, modeLabel) {
      const wrap = $("kelasList");
      if (!items || !items.length) {
        wrap.innerHTML = `<div class="text-slate-600">Tiada kelas (${modeLabel}).</div>`;
        return;
      }

      wrap.innerHTML = items.map(x => `
        <div class="p-4 rounded-2xl border border-white/60 bg-white/60 mb-3">
          <div class="font-bold text-slate-900">${escapeHtml(x.className || "(no name)")}</div>
          <div class="text-slate-600 text-sm">
            ${escapeHtml(x.year || "")} ${x.semester ? "• " + escapeHtml(x.semester) : ""}
          </div>
          ${x.classCode ? `<div class="mt-2 text-xs text-slate-500">Code: <span class="font-mono">${escapeHtml(x.classCode)}</span></div>` : ""}
        </div>
      `).join("");
    }

    async function loadKelas() {
      setStatus("");
      setAksiMsg("");
      $("kelasList").textContent = "Loading kelas…";

      if (!ME) return;

      const isAdmin = (ME.isAdmin === true) || String(ME.role || "").toLowerCase() === "admin";
      $("aksiStudent").classList.toggle("hidden", isAdmin);
      $("aksiAdmin").classList.toggle("hidden", !isAdmin);

      try {
        const token = getToken();
        if (isAdmin) {
          const j = await apiGet("listClasses", { token });
          if (!j.ok) throw new Error(j.error || j.message || "listClasses failed");
          renderList(j.classes || [], "admin:listClasses");
        } else {
          const j = await apiGet("myEnrollments", { token });
          if (!j.ok) throw new Error(j.error || j.message || "myEnrollments failed");
          renderList(j.enrollments || [], "student:myEnrollments");
        }
      } catch (e) {
        setStatus(String(e.message || e));
        $("kelasList").textContent = "Gagal load kelas.";
      }
    }

    async function joinKelas() {
      setAksiMsg("");
      const code = $("classCode").value.trim();
      if (!code) return setAksiMsg("Masukkan class code dulu.", "err");

      try {
        const token = getToken();

        // ✅ betul ikut backend: action=enroll
        const j = await apiPost("enroll", { classCode: code }, { token });

        if (!j || !j.ok) return setAksiMsg(j.error || j.message || "Join gagal.", "err");

        setAksiMsg("Join berjaya ✅", "ok");
        $("classCode").value = "";
        await loadKelas();
      } catch (e) {
        setAksiMsg("Failed to fetch (network/CORS).", "err");
      }
    }

    function logout() {
      clearAllTokens();
      window.location.href = "./index.html";
    }

    // ---------- INIT ----------
    $("logoutBtn").addEventListener("click", logout);
    $("refreshBtn").addEventListener("click", loadKelas);
    $("joinBtn").addEventListener("click", joinKelas);

    (async function init(){
      setDebug(`BASE=${BASE ? "ok" : "missing"} | TOKEN_KEY=${TOKEN_KEY}`);
      ME = await loadMe();
      if (!ME) return;

      setStatus("Token ok ✅");
      await loadKelas();
    })();
  </script>
</body>
</html>
