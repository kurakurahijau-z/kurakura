<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kura Kura Hijau – Kelas</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Global Config -->
  <script src="./config.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-emerald-50 text-slate-900">

<!-- ================= TOPBAR (SAMA DENGAN INDEX) ================= -->
<header class="sticky top-0 z-10 bg-white/80 backdrop-blur border-b border-emerald-100">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-emerald-600 text-white grid place-items-center font-bold">
        KK
      </div>
      <div class="leading-tight">
        <div class="font-semibold">kura kura hijau</div>
        <div class="text-xs text-emerald-700">Kelas</div>
      </div>
    </div>

    <button id="btnLogout"
      class="px-4 py-2 rounded-xl bg-white border border-emerald-200 text-emerald-700 font-semibold hover:bg-emerald-50">
      Log keluar
    </button>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="max-w-5xl mx-auto px-4 py-14">

  <!-- Title -->
  <div class="text-center">
    <h1 class="text-4xl md:text-5xl font-extrabold text-emerald-900">
      Senarai Kelas
    </h1>
    <p class="mt-3 text-slate-600">
      Kelas yang tersedia untuk akaun anda.
    </p>
  </div>

  <!-- Message -->
  <div id="msg"
       class="mt-6 max-w-md mx-auto text-center text-sm"></div>

  <!-- Card -->
  <div class="mt-10 bg-white rounded-2xl border border-emerald-100 shadow-sm p-6">
    <div class="flex items-center justify-between mb-4">
      <div class="font-semibold text-lg">Kelas Aktif</div>
      <button id="btnReload"
        class="text-sm font-semibold text-emerald-700 hover:underline">
        Refresh
      </button>
    </div>

    <div id="kelasList" class="space-y-3">
      <div class="text-sm text-slate-500">Loading kelas…</div>
    </div>
  </div>

</main>

<!-- ================= SCRIPT ================= -->
<script>
  const CFG = window.APP_CONFIG || {};
  const BASE = CFG.BASE_URL || "";
  const KEY = CFG.API_KEY || "";
  const TOKEN_KEY = CFG.TOKEN_KEY || "kk_token";

  const $ = (id) => document.getElementById(id);

  function setMsg(text, ok = true) {
    $("msg").textContent = text || "";
    $("msg").className = ok
      ? "mt-6 max-w-md mx-auto text-center text-sm text-emerald-700"
      : "mt-6 max-w-md mx-auto text-center text-sm text-rose-700";
  }

  function getToken() {
    return localStorage.getItem(TOKEN_KEY);
  }

  function logout() {
    localStorage.removeItem(TOKEN_KEY);
    window.location.href = "./index.html";
  }

  async function apiGet(action, params = {}) {
    const url = new URL(BASE);
    url.searchParams.set("action", action);
    url.searchParams.set("key", KEY);
    Object.entries(params).forEach(([k, v]) =>
      url.searchParams.set(k, v)
    );

    const res = await fetch(url.toString(), {
      headers: {
        "Authorization": "Bearer " + getToken()
      }
    });
    return res.json();
  }

  async function loadKelas() {
    const token = getToken();
    if (!token) {
      return setMsg("Token tak jumpa. Sila login semula.", false);
    }

    $("kelasList").innerHTML =
      `<div class="text-sm text-slate-500">Loading kelas…</div>`;

    try {
      const data = await apiGet("listClasses");

      if (!data || !data.ok) {
        return setMsg(data.error || "Gagal load kelas.", false);
      }

      if (!data.classes || data.classes.length === 0) {
        $("kelasList").innerHTML =
          `<div class="text-sm text-slate-500">Tiada kelas lagi.</div>`;
        return;
      }

      $("kelasList").innerHTML = data.classes.map(k => `
        <div class="p-4 rounded-xl border border-emerald-100 bg-emerald-50/50">
          <div class="font-semibold text-emerald-900">${k.name}</div>
          <div class="text-sm text-slate-600 mt-1">${k.description || ""}</div>
        </div>
      `).join("");

    } catch (e) {
      setMsg(String(e.message || e), false);
    }
  }

  // Events
  $("btnLogout").addEventListener("click", logout);
  $("btnReload").addEventListener("click", loadKelas);

  // Init
  loadKelas();
</script>

</body>
</html>
