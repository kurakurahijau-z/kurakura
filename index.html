<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kura kura hijau</title>

  <link rel="stylesheet" href="styles.css" />

  <style>
    .kk-wrap{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:22px;
      padding: 26px 16px;
    }

    .kk-title{
      margin:0;
      font-size: clamp(3.6rem, 8.2vw, 5.2rem);
      font-weight: 950;
      letter-spacing: -0.02em;
      line-height: 1.02;
      color: #07131f;
      text-shadow:
        0 1px 0 rgba(255,255,255,.55),
        0 18px 46px rgba(2,6,23,.16);
    }

    /* kura kura */
    .kk-title .accent{
      background: linear-gradient(90deg,
        #064e3b 0%,
        #059669 35%,
        #0ea5e9 70%,
        #065f46 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
    }

    /* hijau → pink luxury gradient */
    .kk-title .pink{
      background: linear-gradient(90deg,
        #ec4899 0%,
        #f472b6 40%,
        #f9a8d4 70%,
        #db2777 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
    }

    .kk-glint{
      width: min(520px, 78vw);
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(5,150,105,.55) 22%,
        rgba(14,165,233,.40) 55%,
        rgba(250,204,21,.22) 78%,
        transparent 100%
      );
      opacity: .9;
      margin-top: 6px;
    }

    .kk-grid{
      width: 100%;
      max-width: 820px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    @media (min-width: 900px){
      .kk-grid{
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
    }

    .kk-link{
      text-decoration:none;
      color: inherit;
      display:block;
    }

    .kk-card{
      border-radius: 22px;
      padding: 18px;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow:
        0 22px 60px rgba(2,6,23,.12),
        0 1px 0 rgba(255,255,255,.65) inset;
      backdrop-filter: blur(14px);
      transition: transform .14s ease, box-shadow .18s ease;
      position: relative;
      overflow: hidden;
    }

    .kk-card:hover{
      transform: translateY(-4px);
      box-shadow:
        0 30px 80px rgba(2,6,23,.16),
        0 1px 0 rgba(255,255,255,.70) inset;
    }

    .kk-card-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 18px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.35);
      border: 1px solid rgba(255,255,255,.40);
    }

    .kk-label{
      font-size: 1.2rem;
      font-weight: 900;
      color: #07131f;
    }

    .kk-pill{
      font-size: .78rem;
      font-weight: 900;
      padding: 9px 11px;
      border-radius: 999px;
      border: 1px solid rgba(5,150,105,.25);
      background: rgba(5,150,105,.10);
      color: #065f46;
    }

    .kk-pill.blue{
      border: 1px solid rgba(14,165,233,.25);
      background: rgba(14,165,233,.10);
      color: #075985;
    }

    /* COPYRIGHT */
    .kk-footer{
      position: fixed;
      bottom: 18px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      opacity: .6;
      letter-spacing: .02em;
    }

  </style>
</head>

<body class="stage">
  <main class="kk-wrap">
    <div>
      <h1 class="kk-title">
        <span class="accent">kura kura</span> <span class="pink">hijau</span>
      </h1>
      <div class="kk-glint"></div>
    </div>

    <section class="kk-grid">
      <a class="kk-link" href="pelajar/">
        <div class="kk-card">
          <div class="kk-card-inner">
            <div class="kk-label">Pelajar</div>
            <div class="kk-pill">Portal</div>
          </div>
        </div>
      </a>

      <a class="kk-link" href="bukan-pelajar/">
        <div class="kk-card">
          <div class="kk-card-inner">
            <div class="kk-label">Bukan Pelajar</div>
            <div class="kk-pill blue">Ruang</div>
          </div>
        </div>
      </a>
    </section>
  </main>

  <div class="kk-footer">
    © 2026 kurakurahijau.com
  </div>

</body>
</html>
