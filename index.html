<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kura Kura Hijau</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./config.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  </style>
</head>

<body class="min-h-screen bg-emerald-50 text-slate-900">
  <!-- Topbar -->
  <header class="sticky top-0 z-10 bg-white/80 backdrop-blur border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 text-white grid place-items-center font-bold">KK</div>
        <div class="leading-tight">
          <div class="font-semibold">kura kura hijau</div>
          <div class="text-xs text-slate-500">Portal</div>
        </div>
      </div>

      <button id="btnStart" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-700">
        Mula Sekarang
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-5xl mx-auto px-4 py-16">
    <div class="text-center">
      <h1 class="text-5xl md:text-6xl font-extrabold text-emerald-900">kura kura hijau</h1>
      <p class="mt-4 text-slate-600">Login untuk akses kelas & kuiz.</p>

      <div id="apiStatus" class="mt-6 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-slate-200 text-sm">
        <span class="w-2 h-2 rounded-full bg-slate-300"></span>
        <span>API belum test</span>
      </div>
    </div>

    <!-- Card -->
    <div class="mt-10 max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="font-bold text-lg">Login</div>
      <div class="text-sm text-slate-500 mt-1">Token akan disimpan automatik lepas login.</div>

      <div class="mt-4 space-y-3">
        <div>
          <label class="text-sm font-semibold">Email</label>
          <input id="email" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-200"
                 placeholder="nama@pms.edu.my" />
        </div>

        <div>
          <label class="text-sm font-semibold">Password</label>
          <input id="password" type="password" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-200"
                 placeholder="••••••••" />
        </div>

        <button id="btnLogin" class="w-full px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-700">
          Login
        </button>

        <div class="flex items-center justify-between text-sm mt-2">
          <button id="btnTest" class="text-emerald-700 font-semibold hover:underline">Test API</button>
          <button id="btnReset" class="text-slate-600 hover:underline">Buang token (reset)</button>
        </div>

        <div id="msg" class="mt-3 text-sm"></div>
      </div>
    </div>
  </main>

  <script>
    const CFG = window.APP_CONFIG || {};
    const BASE = CFG.BASE_URL || "";
    const KEY  = CFG.API_KEY || "";
    const TOKEN_KEY = CFG.TOKEN_KEY || "kk_token";

    const $ = (id) => document.getElementById(id);

    function setMsg(text, ok=true) {
      $("msg").textContent = text || "";
      $("msg").className = ok
        ? "mt-3 text-sm text-emerald-700"
        : "mt-3 text-sm text-rose-700";
    }

    function setApiStatus(ok, text) {
      const el = $("apiStatus");
      const dot = el.querySelector("span");
      const label = el.querySelectorAll("span")[1];
      dot.className = "w-2 h-2 rounded-full " + (ok ? "bg-emerald-500" : "bg-rose-500");
      label.textContent = text;
    }

    async function apiGet(action, params={}) {
      const url = new URL(BASE);
      url.searchParams.set("action", action);
      url.searchParams.set("key", KEY);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString(), { method: "GET" });
      return res.json();
    }

    async function apiPost(action, body={}, params={}) {
      const url = new URL(BASE);
      url.searchParams.set("action", action);
      url.searchParams.set("key", KEY);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));

      const res = await fetch(url.toString(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      return res.json();
    }

    async function testApi() {
      try {
        const data = await apiGet("health");
        if (data && data.ok) {
          setApiStatus(true, `API ok ✅ (${data.time || "no time"})`);
          setMsg("API boleh access.", true);
        } else {
          setApiStatus(false, "API error ❌");
          setMsg(data.error || "API error", false);
        }
      } catch (e) {
        setApiStatus(false, "API error ❌");
        setMsg(String(e.message || e), false);
      }
    }

    function resetToken() {
      localStorage.removeItem(TOKEN_KEY);
      setMsg("Token dah dibuang. Sila login semula.", true);
    }

    async function doLogin() {
      const email = ($("email").value || "").trim();
      const password = ($("password").value || "");

      if (!BASE || !KEY) return setMsg("config.js belum betul (BASE_URL / API_KEY kosong).", false);
      if (!email || email.indexOf("@") < 1) return setMsg("Email tak sah.", false);
      if (!password) return setMsg("Password diperlukan.", false);

      setMsg("Logging in...", true);

      try {
        const data = await apiPost("login", { email, password });
        if (!data || !data.ok || !data.token) {
          return setMsg(data.error || data.message || "Login gagal.", false);
        }

        // SIMPAN TOKEN (ini yang selalu orang tertinggal)
        localStorage.setItem(TOKEN_KEY, data.token);

        // redirect terus ke kelas.html
        window.location.href = "./kelas.html";
      } catch (e) {
        setMsg(String(e.message || e), false);
      }
    }

    // Button wiring
    $("btnTest").addEventListener("click", testApi);
    $("btnReset").addEventListener("click", resetToken);
    $("btnLogin").addEventListener("click", doLogin);
    $("btnStart").addEventListener("click", () => {
      document.querySelector("#email").focus();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    });

    // Auto test API on load (optional)
    testApi();
  </script>
</body>
</html>
