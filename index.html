<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kura kura hijau</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Global theme + config -->
  <link rel="stylesheet" href="./theme.css" />
  <script src="./config.js"></script>
</head>

<body>
  <div class="stage">
    <!-- Topbar -->
    <header class="topbar">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-emerald-600 text-white grid place-items-center font-extrabold">KK</div>
          <div class="leading-tight">
            <div class="font-semibold">kura kura hijau</div>
            <div class="text-xs text-slate-500">Portal</div>
          </div>
        </div>

        <button id="btnStart" class="btn-primary">Mula Sekarang</button>
      </div>
    </header>

    <!-- Main -->
    <main class="max-w-5xl mx-auto px-4 py-14">
      <div class="text-center">
        <h1 class="text-5xl md:text-6xl font-extrabold text-emerald-900">kura kura hijau</h1>
        <p class="mt-4 text-slate-600">Login untuk akses kelas & kuiz.</p>

        <div id="apiStatus" class="mt-6 inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/70 border border-white/60 shadow-sm text-sm">
          <span id="apiDot" class="w-2 h-2 rounded-full bg-slate-300"></span>
          <span id="apiText">API belum test</span>
        </div>
      </div>

      <!-- Card -->
      <div class="mt-10 max-w-lg mx-auto card">
        <div class="font-bold text-lg">Login</div>
        <div class="text-sm text-slate-500 mt-1">Token akan disimpan automatik lepas login.</div>

        <div class="mt-5 space-y-4">
          <div>
            <label class="text-sm font-semibold">Email</label>
            <input id="email" autocomplete="username"
              class="mt-1 w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white/70 focus:outline-none focus:ring-2 focus:ring-emerald-200"
              placeholder="nama@pms.edu.my" />
          </div>

          <div>
            <label class="text-sm font-semibold">Password</label>
            <div class="mt-1 flex gap-2">
              <input id="password" type="password" autocomplete="current-password"
                class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white/70 focus:outline-none focus:ring-2 focus:ring-emerald-200"
                placeholder="••••••••" />
              <button id="btnShow" class="px-4 py-3 rounded-2xl border border-slate-200 bg-white/70 hover:bg-white text-sm font-semibold">
                Show
              </button>
            </div>
          </div>

          <button id="btnLogin" class="btn-primary w-full">Login</button>

          <div class="flex items-center justify-between text-sm pt-1">
            <button id="btnTest" class="text-emerald-700 font-semibold hover:underline">Test API</button>
            <button id="btnReset" class="text-slate-600 hover:underline">Buang token (reset)</button>
          </div>

          <div id="msg" class="text-sm"></div>

          <!-- Debug kecil (tak kacau UI) -->
          <div class="text-xs text-slate-400 pt-2">
            <span id="cfgInfo"></span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ---------- CONFIG ----------
    const CFG = window.APP_CONFIG || {};
    const BASE = (CFG.BASE_URL || "").trim();
    const KEY  = (CFG.API_KEY || "").trim();
    const TOKEN_KEY = (CFG.TOKEN_KEY || "kk_token").trim();

    const $ = (id) => document.getElementById(id);

    function setMsg(text, ok=true) {
      const el = $("msg");
      el.textContent = text || "";
      el.className = ok ? "text-sm text-emerald-700" : "text-sm text-rose-700";
    }

    function setApiStatus(ok, text) {
      $("apiDot").className = "w-2 h-2 rounded-full " + (ok ? "bg-emerald-500" : "bg-rose-500");
      $("apiText").textContent = text;
    }

    // ---------- API HELPERS ----------
    function buildUrl(action, params={}) {
      if (!BASE) throw new Error("BASE_URL kosong. Semak config.js.");
      const url = new URL(BASE);
      url.searchParams.set("action", action);
      if (KEY) url.searchParams.set("key", KEY);
      Object.entries(params).forEach(([k,v]) => {
        if (v !== undefined && v !== null && String(v).length) url.searchParams.set(k, v);
      });
      return url.toString();
    }

    async function apiGet(action, params={}) {
      const res = await fetch(buildUrl(action, params), { method: "GET" });
      return await res.json();
    }

    // POST guna text/plain (kurang drama preflight untuk Apps Script)
    async function apiPost(action, body={}, params={}) {
      const res = await fetch(buildUrl(action, params), {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body || {})
      });
      return await res.json();
    }

    // ---------- ACTIONS ----------
    async function testApi() {
      try {
        const data = await apiGet("health");
        if (data && data.ok) {
          setApiStatus(true, `API ok ✅ (${data.time || "no time"})`);
          setMsg("API boleh access.", true);
        } else {
          setApiStatus(false, "API error ❌");
          setMsg(data?.error || data?.message || "API error", false);
        }
      } catch (e) {
        setApiStatus(false, "API error ❌");
        setMsg(String(e.message || e), false);
      }
    }

    function resetToken() {
      localStorage.removeItem(TOKEN_KEY);
      setMsg("Token dah dibuang. Sila login semula.", true);
    }

    async function doLogin() {
      const email = ($("email").value || "").trim();
      const password = ($("password").value || "");

      if (!BASE) return setMsg("config.js belum betul (BASE_URL kosong).", false);
      if (!email || email.indexOf("@") < 1) return setMsg("Email tak sah.", false);
      if (!password) return setMsg("Password diperlukan.", false);

      setMsg("Logging in...", true);

      try {
        const data = await apiPost("login", { email, password });

        if (!data || !data.ok || !data.token) {
          return setMsg(data?.error || data?.message || "Login gagal.", false);
        }

        localStorage.setItem(TOKEN_KEY, data.token);
        window.location.href = "./kelas.html";
      } catch (e) {
        setMsg(String(e.message || e), false);
      }
    }

    // ---------- UI WIRING ----------
    $("btnTest").addEventListener("click", testApi);
    $("btnReset").addEventListener("click", resetToken);
    $("btnLogin").addEventListener("click", doLogin);

    $("btnStart").addEventListener("click", () => {
      $("email").focus();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    });

    $("btnShow").addEventListener("click", () => {
      const p = $("password");
      const isPw = p.type === "password";
      p.type = isPw ? "text" : "password";
      $("btnShow").textContent = isPw ? "Hide" : "Show";
    });

    // Debug info kecil
    $("cfgInfo").textContent = `cfg: BASE_URL=${BASE ? "ok" : "kosong"} | API_KEY=${KEY ? "ok" : "kosong"} | TOKEN_KEY=${TOKEN_KEY}`;

    // Auto test
    testApi();
  </script>
</body>
</html>
