<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kura Kura Hijau</title>

  <!-- Tailwind (ok kekal) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Theme (WAJIB untuk semua page) -->
  <link rel="stylesheet" href="./theme.css" />

  <!-- Global config -->
  <script src="./config.js"></script>
</head>

<body class="kk-body">
  <!-- Background layer (theme.css yang control) -->
  <div class="kk-bg"></div>

  <!-- Topbar -->
  <header class="kk-topbar">
    <div class="kk-container kk-topbar-inner">
      <div class="kk-brand">
        <div class="kk-logo">KK</div>
        <div class="kk-brand-text">
          <div class="kk-brand-title">kura kura hijau</div>
          <div class="kk-brand-sub">Portal</div>
        </div>
      </div>

      <button id="btnStart" class="kk-btn kk-btn-primary">
        Mula Sekarang
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="kk-container kk-main">
    <section class="kk-hero">
      <h1 class="kk-hero-title">kura kura hijau</h1>
      <p class="kk-hero-subtitle">Login untuk akses kelas & kuiz.</p>

      <div id="apiStatus" class="kk-chip">
        <span class="kk-dot kk-dot-idle"></span>
        <span>API belum test</span>
      </div>
    </section>

    <!-- Card -->
    <section class="kk-card kk-card-center">
      <div class="kk-card-title">Login</div>
      <div class="kk-card-desc">Token akan disimpan automatik lepas login.</div>

      <div class="mt-5 space-y-4">
        <div>
          <label class="kk-label">Email</label>
          <input id="email" class="kk-input" placeholder="nama@pms.edu.my" />
        </div>

        <div>
          <label class="kk-label">Password</label>
          <input id="password" type="password" class="kk-input" placeholder="••••••••" />
        </div>

        <button id="btnLogin" class="kk-btn kk-btn-primary w-full">
          Login
        </button>

        <div class="flex items-center justify-between text-sm mt-1">
          <button id="btnTest" class="kk-link">Test API</button>
          <button id="btnReset" class="kk-link-muted">Buang token (reset)</button>
        </div>

        <div id="msg" class="kk-msg"></div>
      </div>
    </section>
  </main>

  <script>
    const CFG = window.APP_CONFIG || {};
    const BASE = CFG.BASE_URL || "";
    const KEY  = CFG.API_KEY || "";
    const TOKEN_KEY = CFG.TOKEN_KEY || "kk_token";

    const $ = (id) => document.getElementById(id);

    function setMsg(text, ok=true) {
      const el = $("msg");
      el.textContent = text || "";
      el.className = ok ? "kk-msg kk-msg-ok" : "kk-msg kk-msg-bad";
    }

    function setApiStatus(ok, text) {
      const el = $("apiStatus");
      const dot = el.querySelector("span");
      const label = el.querySelectorAll("span")[1];
      dot.className = "kk-dot " + (ok ? "kk-dot-ok" : "kk-dot-bad");
      label.textContent = text;
    }

    async function apiGet(action, params={}) {
      const url = new URL(BASE);
      url.searchParams.set("action", action);
      url.searchParams.set("key", KEY);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString(), { method: "GET" });
      return res.json();
    }

    async function apiPost(action, body={}, params={}) {
      const url = new URL(BASE);
      url.searchParams.set("action", action);
      url.searchParams.set("key", KEY);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));

      const res = await fetch(url.toString(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      return res.json();
    }

    async function testApi() {
      try {
        if (!BASE || !KEY) throw new Error("config.js belum betul (BASE_URL / API_KEY kosong).");
        const data = await apiGet("health");
        if (data && data.ok) {
          setApiStatus(true, `API ok ✅ (${data.time || "no time"})`);
          setMsg("API boleh access.", true);
        } else {
          setApiStatus(false, "API error ❌");
          setMsg(data.error || "API error", false);
        }
      } catch (e) {
        setApiStatus(false, "API error ❌");
        setMsg(String(e.message || e), false);
      }
    }

    function resetToken() {
      localStorage.removeItem(TOKEN_KEY);
      setMsg("Token dah dibuang. Sila login semula.", true);
    }

    async function doLogin() {
      const email = ($("email").value || "").trim();
      const password = ($("password").value || "");

      if (!BASE || !KEY) return setMsg("config.js belum betul (BASE_URL / API_KEY kosong).", false);
      if (!email || email.indexOf("@") < 1) return setMsg("Email tak sah.", false);
      if (!password) return setMsg("Password diperlukan.", false);

      setMsg("Logging in...", true);

      try {
        const data = await apiPost("login", { email, password });
        if (!data || !data.ok || !data.token) {
          return setMsg(data.error || data.message || "Login gagal.", false);
        }

        localStorage.setItem(TOKEN_KEY, data.token);
        window.location.href = "./kelas.html";
      } catch (e) {
        setMsg(String(e.message || e), false);
      }
    }

    $("btnTest").addEventListener("click", testApi);
    $("btnReset").addEventListener("click", resetToken);
    $("btnLogin").addEventListener("click", doLogin);
    $("btnStart").addEventListener("click", () => {
      $("email").focus();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    });

    testApi();
  </script>
</body>
</html>
