<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kura kura hijau - Portal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./theme.css" />
  <script src="./config.js"></script>
</head>

<body>
  <div class="stage">
    <!-- Topbar -->
    <header class="topbar">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-emerald-600 text-white grid place-items-center font-extrabold">KK</div>
          <div class="leading-tight">
            <div class="font-semibold">kura kura hijau</div>
            <div class="text-xs text-emerald-700">Portal</div>
          </div>
        </div>
        <button id="startBtn" class="btn-primary">Mula Sekarang</button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">
      <div class="text-center mt-8 mb-8">
        <h1 class="text-6xl font-extrabold tracking-tight text-emerald-900">kura kura hijau</h1>
        <p class="mt-3 text-slate-700">Login untuk akses kelas & kuiz.</p>

        <div class="mt-5 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white/70 border border-white/60 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span id="healthText" class="text-sm text-slate-800">API belum test</span>
        </div>
      </div>

      <div class="max-w-xl mx-auto card">
        <div class="text-lg font-bold">Login</div>
        <div class="text-sm text-slate-600 mt-1">Token akan disimpan automatik lepas login.</div>

        <div class="mt-6 space-y-4">
          <div>
            <label class="text-sm font-semibold">Email</label>
            <input id="email" type="email" placeholder="nama@pms.edu.my"
              class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-200 bg-white/80" />
          </div>

          <div>
            <label class="text-sm font-semibold">Password</label>
            <div class="mt-2 flex gap-2">
              <input id="password" type="password" placeholder="••••••••"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-200 bg-white/80" />
              <button id="togglePw"
                class="px-4 py-3 rounded-xl border border-slate-200 bg-white/80 text-sm font-semibold">Show</button>
            </div>
          </div>

          <button id="loginBtn" class="btn-primary w-full justify-center py-3 text-base">Login</button>

          <div class="flex items-center justify-between text-sm mt-2">
            <button id="testBtn" class="text-emerald-700 font-semibold hover:underline">Test API</button>

            <!-- Reset kecil, bukan fokus utama -->
            <button id="resetBtn" class="text-slate-600 hover:underline">Buang token (reset)</button>
          </div>

          <div id="msg" class="text-sm mt-2"></div>

          <div class="text-xs text-slate-400 mt-4">
            cfg: BASE_URL=<span id="cfgBase">?</span> | API_KEY=<span id="cfgKey">?</span> | TOKEN_KEY=<span id="cfgTok">?</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ---------- helpers ----------
    const CFG = window.APP_CONFIG || {};
    const BASE_URL = CFG.BASE_URL || "";
    const API_KEY = CFG.API_KEY || "";
    const TOKEN_KEY = CFG.TOKEN_KEY || "kk_token";

    document.getElementById("cfgBase").textContent = BASE_URL ? "ok" : "missing";
    document.getElementById("cfgKey").textContent  = API_KEY ? "ok" : "missing";
    document.getElementById("cfgTok").textContent  = TOKEN_KEY;

    function qs(obj) {
      const p = new URLSearchParams();
      Object.entries(obj || {}).forEach(([k,v]) => {
        if (v !== undefined && v !== null && String(v).length) p.set(k, v);
      });
      return p.toString();
    }

    function apiUrl(action, extraParams) {
      const q = qs({ action, key: API_KEY, ...(extraParams||{}) });
      return `${BASE_URL}?${q}`;
    }

    function cleanToken(t) {
      if (!t) return "";
      t = String(t).trim();
      // buang Bearer
      if (t.toLowerCase().startsWith("bearer ")) t = t.slice(7).trim();
      // buang quotes kalau token tersimpan sebagai "\"...\""
      t = t.replace(/^"+|"+$/g, "");
      return t.trim();
    }

    function setToken(t) {
      const tok = cleanToken(t);
      localStorage.setItem(TOKEN_KEY, tok); // SIMPAN RAW (no JSON.stringify)
      return tok;
    }

    function getToken() {
      return cleanToken(localStorage.getItem(TOKEN_KEY));
    }

    function clearToken() {
      localStorage.removeItem(TOKEN_KEY);
    }

    function setMsg(text, type="info") {
      const el = document.getElementById("msg");
      el.textContent = text || "";
      el.className = "text-sm mt-2 " + (type==="err" ? "text-red-600" : type==="ok" ? "text-emerald-700" : "text-slate-700");
    }

    async function testHealth() {
      try {
        const r = await fetch(apiUrl("health"));
        const j = await r.json();
        document.getElementById("healthText").textContent = j.ok ? `API ok (${j.time})` : "API failed";
        setMsg(j.ok ? "API boleh access." : "API fail.", j.ok ? "ok" : "err");
      } catch (e) {
        document.getElementById("healthText").textContent = "API failed";
        setMsg("Failed to fetch (health).", "err");
      }
    }

    async function doLogin() {
      setMsg("");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!BASE_URL || !API_KEY) return setMsg("config.js belum betul (BASE_URL / API_KEY).", "err");
      if (!email || !password) return setMsg("Isi email & password dulu.", "err");

      try {
        const r = await fetch(apiUrl("login"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const j = await r.json();

        if (!j.ok) return setMsg(j.message || j.error || "Login gagal.", "err");
        if (!j.token) return setMsg("Login ok tapi token kosong. Semak Apps Script.", "err");

        const tok = setToken(j.token);
        setMsg(`Login ok. role=${(j.user && j.user.role) ? j.user.role : "?"}`, "ok");

        // terus pergi kelas
        window.location.href = "./kelas.html";
      } catch (e) {
        setMsg("Failed to fetch (login).", "err");
      }
    }

    // ---------- events ----------
    document.getElementById("startBtn").addEventListener("click", () => {
      // kalau dah ada token, terus ke kelas
      if (getToken()) window.location.href = "./kelas.html";
      else document.getElementById("email").focus();
    });

    document.getElementById("testBtn").addEventListener("click", testHealth);
    document.getElementById("loginBtn").addEventListener("click", doLogin);

    document.getElementById("resetBtn").addEventListener("click", () => {
      clearToken();
      setMsg("Token dibuang. Sila login semula.", "ok");
    });

    document.getElementById("togglePw").addEventListener("click", (e) => {
      e.preventDefault();
      const pw = document.getElementById("password");
      pw.type = (pw.type === "password") ? "text" : "password";
      e.target.textContent = (pw.type === "password") ? "Show" : "Hide";
    });

    // auto test health on load
    testHealth();
  </script>
</body>
</html>
