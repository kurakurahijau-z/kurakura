<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kura kura hijau</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Inter', sans-serif;
    }

    /* Animated soft gradient */
    body {
      background: linear-gradient(
        -45deg,
        #e0f2fe,
        #f0fdf4,
        #ecfccb,
        #cffafe,
        #dbeafe
      );
      background-size: 400% 400%;
      animation: gradientMove 20s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="w-full bg-white/80 backdrop-blur-md shadow-sm fixed top-0 left-0">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <span class="font-bold text-emerald-600">
        kura kura hijau
      </span>
      <a href="kelas.html"
         class="px-5 py-2 rounded-lg font-semibold text-white
                bg-gradient-to-r from-emerald-500 to-teal-500
                hover:opacity-90 transition">
        Mula Sekarang
      </a>
    </div>
  </header>

  <!-- Center Title -->
  <main class="flex-1 flex items-center justify-center text-center px-6">
    <h1 class="text-5xl md:text-6xl font-semibold text-emerald-900">
      kura kura hijau
    </h1>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center text-gray-600 text-sm">
    © 2026 kura kura hijau
  </footer>

</body>
</html>
