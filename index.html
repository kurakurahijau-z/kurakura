<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kura kura hijau - Portal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./theme.css" />
  <script src="./config.js"></script>
</head>

<body>
  <div class="stage">
    <header class="topbar">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-emerald-600 text-white grid place-items-center font-extrabold">KK</div>
          <div class="leading-tight">
            <div class="font-semibold">kura kura hijau</div>
            <div class="text-xs text-emerald-700">Portal</div>
          </div>
        </div>
        <button id="startBtn" class="btn-primary">Mula Sekarang</button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">
      <div class="text-center mt-8 mb-8">
        <h1 class="text-6xl font-extrabold tracking-tight text-emerald-900">kura kura hijau</h1>
        <p class="mt-3 text-slate-700">Login untuk akses kelas & kuiz.</p>

        <div class="mt-5 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white/70 border border-white/60 shadow-sm">
          <span id="apiDot" class="w-2 h-2 rounded-full bg-slate-300"></span>
          <span id="healthText" class="text-sm text-slate-800">API belum test</span>
        </div>
      </div>

      <div class="max-w-xl mx-auto card">
        <div class="text-lg font-bold">Login</div>
        <div class="text-sm text-slate-600 mt-1">Token akan disimpan automatik lepas login.</div>

        <div class="mt-6 space-y-4">
          <div>
            <label class="text-sm font-semibold">Email</label>
            <input id="email" type="email" autocomplete="username" placeholder="nama@pms.edu.my"
              class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-200 bg-white/80" />
          </div>

          <div>
            <label class="text-sm font-semibold">Password</label>
            <div class="mt-2 flex gap-2">
              <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-200 bg-white/80" />
              <button id="togglePw" class="px-4 py-3 rounded-xl border border-slate-200 bg-white/70 text-sm font-semibold">Show</button>
            </div>
          </div>

          <button id="loginBtn" class="btn-primary w-full">Login</button>

          <div class="flex items-center justify-between text-sm pt-1">
            <button id="testBtn" class="text-emerald-700 font-semibold hover:underline">Test API</button>
            <button id="resetBtn" class="text-slate-600 hover:underline">Buang token (reset)</button>
          </div>

          <div id="msg" class="text-sm mt-2"></div>

          <div class="text-xs text-slate-400 mt-4">
            cfg: BASE_URL=<span id="cfgBase">?</span> | API_KEY=<span id="cfgKey">?</span> | TOKEN_KEY=<span id="cfgTok">?</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ---------- CONFIG ----------
    const CFG = window.APP_CONFIG || {};
    const BASE = (CFG.BASE_URL || "").trim();
    const KEY  = (CFG.API_KEY || "").trim();
    const TOKEN_KEY = (CFG.TOKEN_KEY || "kk_token").trim();

    const $ = (id) => document.getElementById(id);

    $("cfgBase").textContent = BASE ? "ok" : "missing";
    $("cfgKey").textContent  = KEY ? "ok" : "missing";
    $("cfgTok").textContent  = TOKEN_KEY;

    function setMsg(text, type="info") {
      const el = $("msg");
      el.textContent = text || "";
      el.className = "text-sm mt-2 " + (type==="err" ? "text-red-600" : type==="ok" ? "text-emerald-700" : "text-slate-700");
    }

    function setApiDot(ok, text) {
      $("apiDot").className = "w-2 h-2 rounded-full " + (ok ? "bg-emerald-500" : "bg-rose-500");
      $("healthText").textContent = text || (ok ? "API ok" : "API failed");
    }

    // ---------- TOKEN ----------
    function cleanToken(t) {
      if (!t) return "";
      t = String(t).trim();
      if (t.toLowerCase().startsWith("bearer ")) t = t.slice(7).trim();
      t = t.replace(/^"+|"+$/g, "");
      return t.trim();
    }

    function setToken(t) {
      const tok = cleanToken(t);
      localStorage.setItem(TOKEN_KEY, tok);
      return tok;
    }

    function getToken() {
      return cleanToken(localStorage.getItem(TOKEN_KEY));
    }

    function clearToken() {
      localStorage.removeItem(TOKEN_KEY);
    }

    // ---------- API HELPERS ----------
    function buildUrl(action, params={}) {
      if (!BASE) throw new Error("BASE_URL kosong. Semak config.js.");
      const url = new URL(BASE);
      url.searchParams.set("action", action);
      if (KEY) url.searchParams.set("key", KEY);
      Object.entries(params).forEach(([k,v]) => {
        if (v !== undefined && v !== null && String(v).length) url.searchParams.set(k, v);
      });
      return url.toString();
    }

    async function apiGet(action, params={}) {
      const res = await fetch(buildUrl(action, params), { method: "GET" });
      return await res.json();
    }

    // POST guna text/plain (kurang drama preflight untuk Apps Script)
    async function apiPost(action, body={}, params={}) {
      const res = await fetch(buildUrl(action, params), {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body || {})
      });
      return await res.json();
    }

    // ---------- ACTIONS ----------
    async function testHealth() {
      try {
        const j = await apiGet("health");
        if (j && j.ok) {
          setApiDot(true, `API ok ✅ (${j.time || "no time"})`);
          setMsg("API boleh access.", "ok");
        } else {
          setApiDot(false, "API error ❌");
          setMsg(j.error || j.message || "API fail.", "err");
        }
      } catch (e) {
        setApiDot(false, "API failed ❌");
        setMsg("Failed to fetch (health).", "err");
      }
    }

    async function doLogin() {
      setMsg("");
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!BASE || !KEY) return setMsg("config.js belum betul (BASE_URL / API_KEY).", "err");
      if (!email || !password) return setMsg("Isi email & password dulu.", "err");

      try {
        const j = await apiPost("login", { email, password });
        if (!j || !j.ok) return setMsg(j.message || j.error || "Login gagal.", "err");
        if (!j.token) return setMsg("Login ok tapi token kosong. Semak Apps Script.", "err");

        setToken(j.token);
        setMsg(`Login ok. role=${(j.user && j.user.role) ? j.user.role : "?"}`, "ok");
        window.location.href = "./kelas.html";
      } catch (e) {
        setMsg("Failed to fetch (login).", "err");
      }
    }

    // ---------- EVENTS ----------
    $("startBtn").addEventListener("click", () => {
      if (getToken()) window.location.href = "./kelas.html";
      else $("email").focus();
    });

    $("testBtn").addEventListener("click", testHealth);
    $("loginBtn").addEventListener("click", doLogin);

    $("resetBtn").addEventListener("click", () => {
      clearToken();
      // optional: buang legacy key yang pernah wujud
      localStorage.removeItem("kkh_token");
      localStorage.removeItem("kk_token");
      localStorage.removeItem("kkh_user");
      setMsg("Token dibuang. Sila login semula.", "ok");
    });

    $("togglePw").addEventListener("click", (e) => {
      e.preventDefault();
      const pw = $("password");
      pw.type = (pw.type === "password") ? "text" : "password";
      $("togglePw").textContent = (pw.type === "password") ? "Show" : "Hide";
    });

    // auto test bila buka
    testHealth();
  </script>
</body>
</html>
