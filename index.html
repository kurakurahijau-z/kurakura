<!doctype html>
<html lang="ms" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kura Kura Hijau</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Quicksand', sans-serif;
    }

    .hero-title {
      font-family: 'Fredoka', sans-serif;
      text-shadow: 0 12px 30px rgba(60, 0, 120, 0.25);
    }

    /* CARD HOVER – SAFE */
    .card-glass {
      background: rgba(255, 255, 255, 0.75);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(40, 0, 80, 0.18);
      backdrop-filter: blur(12px);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .card-glass:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 28px 70px rgba(40, 0, 80, 0.28);
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-purple-200 via-pink-200 to-yellow-100 flex items-center justify-center">

  <div class="absolute top-6 left-6 flex items-center gap-2 text-purple-700 font-semibold">
    🐢 kura kura hijau
  </div>

  <div class="absolute top-6 right-6 text-purple-600 text-sm cursor-pointer">
    Log Keluar
  </div>

  <main class="text-center">
    <h1 class="hero-title text-6xl text-purple-800 mb-16">
      kurakura
    </h1>

    <div class="flex gap-8 justify-center">
      <!-- KELAS -->
      <div class="card-glass w-72 h-48 flex flex-col items-center justify-center cursor-pointer">
        <div class="w-14 h-14 rounded-2xl bg-yellow-400 flex items-center justify-center text-white text-2xl mb-4">
          📘
        </div>
        <div class="text-xl font-semibold text-purple-800">Kelas</div>
        <div class="text-sm text-purple-500 mt-1">Kuiz & aktiviti</div>
      </div>

      <!-- PROFIL -->
      <div class="card-glass w-72 h-48 flex flex-col items-center justify-center cursor-pointer">
        <div class="w-14 h-14 rounded-2xl bg-pink-400 flex items-center justify-center text-white text-2xl mb-4">
          👤
        </div>
        <div class="text-xl font-semibold text-purple-800">Profil</div>
        <div class="text-sm text-purple-500 mt-1">Maklumat akaun</div>
      </div>
    </div>
  </main>

</body>
</html>
