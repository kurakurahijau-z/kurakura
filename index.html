<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kura kura hijau</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Landing-only tweaks (still respects your global theme) */
    .kk-wrap{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:22px;
      padding: 26px 16px;
    }

    /* =========
       TITLE: more striking but classy
       ========= */
    .kk-title{
      margin:0;
      font-size: clamp(3.6rem, 8.2vw, 5.2rem);
      font-weight: 950;
      letter-spacing: -0.02em;
      line-height: 1.02;
      color: #07131f;
      text-shadow:
        0 1px 0 rgba(255,255,255,.55),
        0 18px 46px rgba(2,6,23,.16);
    }

    /* Gradient text accent (quiet luxury, not neon) */
    .kk-title .accent{
      background: linear-gradient(90deg,
        #064e3b 0%,
        #059669 35%,
        #0ea5e9 70%,
        #065f46 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
    }

    /* tiny “glint” underline */
    .kk-glint{
      width: min(520px, 78vw);
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(5,150,105,.55) 22%,
        rgba(14,165,233,.40) 55%,
        rgba(250,204,21,.22) 78%,
        transparent 100%
      );
      opacity: .9;
      filter: blur(.1px);
      margin-top: 6px;
    }

    /* =========
       BUTTON GRID
       ========= */
    .kk-grid{
      width: 100%;
      max-width: 820px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 10px;
    }
    @media (min-width: 900px){
      .kk-grid{
        grid-template-columns: 1fr 1fr; /* side-by-side desktop */
        gap: 18px;
      }
    }

    .kk-link{
      text-decoration:none;
      color: inherit;
      display:block;
    }

    /* =========
       CARDS: more futuristic
       ========= */
    .kk-card{
      border-radius: 22px;
      padding: 18px;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow:
        0 22px 60px rgba(2,6,23,.12),
        0 1px 0 rgba(255,255,255,.65) inset;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform .14s ease, box-shadow .18s ease, border-color .18s ease;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      cursor: pointer;
    }

    /* gradient border illusion */
    .kk-card::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius: 24px;
      background: linear-gradient(135deg,
        rgba(5,150,105,.55),
        rgba(14,165,233,.40),
        rgba(250,204,21,.22),
        rgba(5,150,105,.50)
      );
      opacity: .55;
      z-index: 0;
      filter: blur(.2px);
    }

    /* inner glass layer */
    .kk-card::after{
      content:"";
      position:absolute;
      inset: 1px;
      border-radius: 21px;
      background: radial-gradient(1200px 420px at 15% 0%,
        rgba(255,255,255,.85),
        rgba(255,255,255,.55) 35%,
        rgba(255,255,255,.40) 70%
      );
      z-index: 1;
    }

    /* shine sweep line */
    .kk-card .shine{
      position:absolute;
      top:-30%;
      left:-60%;
      width: 55%;
      height: 180%;
      background: linear-gradient(90deg,
        transparent,
        rgba(255,255,255,.55),
        transparent
      );
      transform: rotate(18deg);
      opacity: .0;
      z-index: 2;
      transition: opacity .2s ease;
    }

    .kk-card:hover{
      transform: translateY(-4px);
      border-color: rgba(255,255,255,.75);
      box-shadow:
        0 30px 80px rgba(2,6,23,.16),
        0 1px 0 rgba(255,255,255,.70) inset;
    }
    .kk-card:hover .shine{
      opacity: .65;
      animation: kk_sweep 1.05s ease both;
    }
    @keyframes kk_sweep{
      0% { left:-70%; }
      100% { left: 120%; }
    }
    .kk-card:active{ transform: translateY(-2px); }

    .kk-card-inner{
      position:relative;
      z-index: 3;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 18px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.35);
      border: 1px solid rgba(255,255,255,.40);
    }

    .kk-label{
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: .01em;
      color: #07131f;
    }

    /* NO subtitle - remove completely */
    .kk-hint{ display:none; }

    .kk-pill{
      font-size: .78rem;
      font-weight: 900;
      padding: 9px 11px;
      border-radius: 999px;
      border: 1px solid rgba(5,150,105,.25);
      background: rgba(5,150,105,.10);
      color: #065f46;
      white-space: nowrap;
      box-shadow: 0 10px 20px rgba(5,150,105,.10);
    }
    .kk-pill.blue{
      border: 1px solid rgba(14,165,233,.25);
      background: rgba(14,165,233,.10);
      color: #075985;
      box-shadow: 0 10px 20px rgba(14,165,233,.10);
    }

    /* small helper: tighten vertical spacing for desktop (minimal) */
    @media (min-width: 900px){
      .kk-wrap{ gap: 18px; }
    }
  </style>
</head>

<body class="stage">
  <main class="kk-wrap">
    <div>
      <h1 class="kk-title">
        <span class="accent">kura kura</span> hijau
      </h1>
      <div class="kk-glint"></div>
    </div>

    <section class="kk-grid" aria-label="Pilih laluan">
      <!-- Pelajar -->
      <a class="kk-link" href="pelajar/">
        <div class="kk-card" role="button" aria-label="Pelajar">
          <span class="shine"></span>
          <div class="kk-card-inner">
            <div class="kk-label">Pelajar</div>
            <div class="kk-pill">Portal</div>
          </div>
        </div>
      </a>

      <!-- Bukan Pelajar -->
      <a class="kk-link" href="bukan-pelajar/">
        <div class="kk-card" role="button" aria-label="Bukan Pelajar">
          <span class="shine"></span>
          <div class="kk-card-inner">
            <div class="kk-label">Bukan Pelajar</div>
            <div class="kk-pill blue">Ruang</div>
          </div>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
