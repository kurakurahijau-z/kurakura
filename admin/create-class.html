<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buat Kelas • Admin</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Buat Kelas</h1>
      <p class="muted">Generate class code automatik. Lepas create, boleh terus urus subject/nota/kuiz.</p>
    </div>
    <div class="actions">
      <button class="btn" onclick="go('index.htm')">⬅ Admin</button>
      <button class="btn danger" onclick="logout()">Keluar</button>
    </div>
  </header>

  <main class="container">
    <div id="status" class="notice"></div>

    <section class="card">
      <h2>Maklumat Kelas</h2>

      <div class="row">
        <div class="col">
          <label for="className">Nama kelas</label>
          <input id="className" type="text" placeholder="Contoh: Kelas DUP4A (Accounting)" />
          <div class="small muted" style="margin-top:6px;">
            Tip: guna nama yang pelajar senang cam “DUP4A Accounting 2026”.
          </div>
        </div>
      </div>

      <div class="toolbar" style="margin-top:12px;">
        <button class="btn primary" id="btnCreate">Create</button>
        <button class="btn" onclick="resetForm()">Reset</button>
      </div>
    </section>

    <section class="card" id="resultCard" style="display:none;">
      <h2>Berjaya</h2>
      <p class="muted">Bagi pelajar code ni untuk join.</p>

      <div class="row">
        <div class="col">
          <label>Class Code</label>
          <input id="outCode" type="text" readonly />
        </div>
      </div>

      <div class="toolbar" style="margin-top:12px;">
        <button class="btn" onclick="copyCode()">Copy Code</button>
        <button class="btn" id="btnManage">Urus Kelas</button>
        <button class="btn" onclick="go('index.htm')">Kembali ke Senarai Kelas</button>
      </div>

      <div class="small muted" id="outMeta" style="margin-top:10px;"></div>
    </section>
  </main>

<script src="../app.js"></script>
<script>
let createdClassId = "";

(function init(){
  requireAuthOrRedirect();
  ensureAdmin();
  document.getElementById("btnCreate").addEventListener("click", onCreate);
  document.getElementById("className").addEventListener("keydown", (e)=>{
    if(e.key === "Enter") onCreate();
  });
})();

async function ensureAdmin(){
  const me = await apiPost({ action:"me" });
  if(!me.ok) return setStatus(me.message || "Gagal semak akaun.");
  if(String(me.user.role||"").toLowerCase() !== "admin"){
    setStatus("Akses ditolak. Akaun ini bukan admin.");
    document.getElementById("btnCreate").disabled = true;
  }
}

function setStatus(msg, isError=true){
  const el = document.getElementById("status");
  el.textContent = msg || "";
  el.style.display = msg ? "block" : "none";
  // styles.css dah ada .notice, kita biar simple
  if(msg){
    el.style.borderColor = isError ? "#f3b4b4" : "#cfe9d8";
    el.style.background = isError ? "#fff1f1" : "#f2fff7";
  }
}

function resetForm(){
  createdClassId = "";
  document.getElementById("className").value = "";
  document.getElementById("resultCard").style.display = "none";
  setStatus("");
}

async function onCreate(){
  setStatus("");

  const className = document.getElementById("className").value.trim();
  if(!className){
    setStatus("Nama kelas tak boleh kosong.");
    return;
  }

  const btn = document.getElementById("btnCreate");
  btn.disabled = true;
  btn.textContent = "Creating...";

  try{
    const res = await apiPost({ action:"adminCreateClass", className });
    if(!res.ok){
      setStatus(res.message || "Gagal create kelas.");
      return;
    }

    createdClassId = res.classId || "";
    document.getElementById("outCode").value = res.classCode || "";
    document.getElementById("outMeta").textContent =
      `classId: ${createdClassId || "-"} • createdAt: ${new Date().toISOString()}`;

    document.getElementById("resultCard").style.display = "block";

    const manageBtn = document.getElementById("btnManage");
    manageBtn.onclick = () => {
      if(!createdClassId) return;
      go(`class.html?classId=${encodeURIComponent(createdClassId)}`);
    };

    setStatus("Kelas berjaya dicipta ✅", false);
  }catch(err){
    setStatus("Tak dapat connect server. Semak BASE_URL dan Console.");
  }finally{
    btn.disabled = false;
    btn.textContent = "Create";
  }
}

async function copyCode(){
  const code = document.getElementById("outCode").value || "";
  if(!code) return;

  try{
    await navigator.clipboard.writeText(code);
    setStatus("Dah copy code ✅", false);
  }catch(_){
    // fallback: select text
    const el = document.getElementById("outCode");
    el.focus();
    el.select();
    document.execCommand("copy");
    setStatus("Dah copy code ✅", false);
  }
}
</script>
</body>
</html>
