<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • Create Kelas</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
  <script src="../app.js"></script>

  <style>
    .wrap{ min-height:100vh; display:flex; justify-content:center; padding: 26px 16px; }
    .container{ width:min(980px, 94vw); }
    .topbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .h1{ font-size:28px; font-weight:950; margin:0; letter-spacing:-0.02em; }
    .muted{ color: var(--kk-muted); font-weight:800; margin: 4px 0 0; }
    .grid{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    @media(max-width:900px){ .grid{ grid-template-columns: 1fr; } }

    .field label{ display:block; font-weight:900; margin: 10px 0 8px; }
    .input{
      width:100%; box-sizing:border-box;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,0.16);
      background: rgba(255,255,255,0.70);
      outline:none;
      font-size: 15px;
    }
    .input:focus{ border-color: rgba(5,150,105,0.55); box-shadow: 0 0 0 4px rgba(5,150,105,0.14); }

    .btn{ margin-top: 12px; width:100%; }

    .msg{ margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-weight: 850; display:none; }
    .msg.ok{ display:block; background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25); color: #065f46; }
    .msg.err{ display:block; background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.22); color: #991b1b; }

    .list{ margin-top: 10px; display:flex; flex-direction:column; gap:10px; }
    .item{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .item .name{ font-weight:950; }
    .item .code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px; padding: 4px 8px; border-radius: 10px;
      border:1px solid rgba(15,23,42,0.14); background: rgba(255,255,255,0.55);
      user-select: all;
    }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; }
    .btnSmall{ padding: 10px 12px; border-radius: 12px; font-weight: 900; border:0; cursor:pointer; }
    .btnGhost{ background: rgba(255,255,255,0.80); border: 1px solid rgba(15,23,42,0.12); }
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <div class="container">
      <div class="topbar">
        <div>
          <h1 class="h1">Create Kelas</h1>
          <div class="muted">Bina kelas baru & copy kod kelas untuk pelajar join.</div>
        </div>
        <div class="actions">
          <button class="btnSmall btnGhost" onclick="location.href='./dashboard.html'">← Dashboard</button>
          <button class="btnSmall btnGhost" onclick="logout()">Logout</button>
        </div>
      </div>

      <div class="grid">
        <!-- Create -->
        <section class="card">
          <div style="font-weight:950;font-size:16px">Create Kelas Baru</div>

          <div id="msg" class="msg"></div>

          <div class="field">
            <label for="className">Nama Kelas</label>
            <input id="className" class="input" type="text" placeholder="Contoh: Kelas DUP4A (Accounting)" />
          </div>

          <button id="btnCreate" class="btn-primary btn" type="button">Create Kelas</button>

          <div style="margin-top:10px;color:var(--kk-muted);font-weight:800;font-size:12px">
            Sistem auto-generate <b>classCode</b> (contoh: PMS-7917).
          </div>
        </section>

        <!-- List -->
        <section class="card">
          <div style="font-weight:950;font-size:16px">Kelas Saya</div>
          <div id="list" class="list"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    requireAdminOrRedirect();

    const $ = (id) => document.getElementById(id);

    function showMsg(type, text){
      const el = $("msg");
      el.className = "msg " + (type === "ok" ? "ok" : "err");
      el.textContent = text;
      el.style.display = "block";
    }

    async function loadMyClasses(){
      const data = await apiPost({ action:"adminListOwnedClasses" });
      if(!data.ok){
        $("list").innerHTML = `<div style="color:#991b1b;font-weight:900">Gagal load kelas: ${escapeHtml(data.message||"")}</div>`;
        return;
      }

      const classes = data.classes || [];
      if(!classes.length){
        $("list").innerHTML = `<div style="color:var(--kk-muted);font-weight:800">Belum ada kelas. Create satu dulu.</div>`;
        return;
      }

      $("list").innerHTML = classes.map(c => `
        <div class="card item">
          <div>
            <div class="name">${escapeHtml(c.className || "")}</div>
            <div style="margin-top:6px;color:var(--kk-muted);font-weight:800;font-size:12px">
              classId: ${escapeHtml(c.classId || "")}
            </div>
          </div>
          <div style="text-align:right">
            <div class="code">${escapeHtml(c.classCode || "")}</div>
          </div>
        </div>
      `).join("");
    }

    $("btnCreate").addEventListener("click", async () => {
      const className = $("className").value.trim();
      if(!className){
        showMsg("err", "Isi nama kelas dulu.");
        return;
      }

      $("btnCreate").disabled = true;
      $("btnCreate").textContent = "Creating...";

      try{
        const data = await apiPost({ action:"adminCreateClass", className });
        if(!data.ok){
          showMsg("err", data.message || "Create gagal.");
        }else{
          showMsg("ok", `Berjaya! Kod kelas: ${data.classCode}`);
          $("className").value = "";
          await loadMyClasses();
        }
      }catch(e){
        console.error(e);
        showMsg("err", "Error network/server. Check deploy version.");
      }finally{
        $("btnCreate").disabled = false;
        $("btnCreate").textContent = "Create Kelas";
      }
    });

    loadMyClasses();
  </script>
</body>
</html>
