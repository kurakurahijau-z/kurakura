<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Kelas • kura kura hijau</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
  <script src="../app.js"></script>
</head>
<body>
  <div class="page">
    <div class="card" style="max-width:720px;margin:40px auto;">
      <h1 style="margin:0 0 10px;">Create Kelas</h1>
      <p style="margin:0 0 18px;color:#4b5563;">
        Lepas create, sistem akan bagi <b>class code</b> untuk pelajar join.
      </p>

      <div id="msg" class="alert" style="display:none;"></div>

      <label class="label">Nama kelas</label>
      <input id="className" class="input" placeholder="Contoh: DTM40384 - Prinsip Akaun" />

      <div style="display:flex;gap:10px;margin-top:14px;">
        <button id="btnCreate" class="btn primary" style="flex:1;">Create</button>
        <a class="btn" href="./dashboard.html">Back</a>
      </div>

      <div id="result" style="display:none;margin-top:18px;padding:14px;border:1px solid #e5e7eb;border-radius:12px;">
        <div><b>Class ID:</b> <span id="outId"></span></div>
        <div><b>Class Code:</b> <span id="outCode"></span></div>
        <div><b>Nama:</b> <span id="outName"></span></div>
      </div>
    </div>
  </div>

<script>
  const msg = document.getElementById("msg");
  const result = document.getElementById("result");
  const outId = document.getElementById("outId");
  const outCode = document.getElementById("outCode");
  const outName = document.getElementById("outName");

  function showMsg(text, type="error"){
    msg.style.display = "block";
    msg.textContent = text;
    msg.style.background = type==="ok" ? "#dcfce7" : "#fee2e2";
    msg.style.border = "1px solid " + (type==="ok" ? "#86efac" : "#fecaca");
    msg.style.color = type==="ok" ? "#166534" : "#991b1b";
  }

  async function guardAdmin(){
    const me = await KKH.apiGet("me");
    if (!me.ok) throw new Error(me.error || "Sila login semula.");
    if (!me.user || !me.user.isAdmin) {
      location.href = "../pelajar/login.html";
      return false;
    }
    return true;
  }

  document.getElementById("btnCreate").addEventListener("click", async () => {
    msg.style.display = "none";
    result.style.display = "none";

    const ok = await guardAdmin();
    if (!ok) return;

    const className = document.getElementById("className").value.trim();
    if (!className) return showMsg("Nama kelas tak boleh kosong.");

    try{
      const r = await KKH.apiPost("createClass", { className });
      if (!r.ok) return showMsg(r.error || "Gagal create kelas.");
      showMsg("Kelas berjaya dicipta ✅", "ok");

      outId.textContent = r.classId;
      outCode.textContent = r.classCode;
      outName.textContent = r.className;
      result.style.display = "block";
    }catch(err){
      showMsg(err.message || String(err));
    }
  });

  // auto guard on load
  guardAdmin().catch(()=>{});
</script>
</body>
</html>
