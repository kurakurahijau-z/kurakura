<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Kuiz • kura kura hijau</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
  <script src="../app.js"></script>
</head>
<body class="stage">
  <header class="topbar">
    <div class="inner">
      <div>
        <h1>Admin • Kuiz</h1>
        <p id="who" class="muted">Loading...</p>
      </div>
      <div class="actions">
        <a class="btn ghost" href="./dashboard.html">← Dashboard</a>
        <button class="btn danger" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="msg" class="notice"></div>

    <section class="card">
      <div class="grid2">
        <div class="card" style="padding:14px;">
          <label>Kelas (owner)</label>
          <select id="classSel"></select>
        </div>

        <div class="card" style="padding:14px;">
          <label>Subject</label>
          <select id="subjectSel"></select>
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
        <button class="btn" id="btnReload" type="button">Reload</button>
        <button class="btn ghost" id="btnNew" type="button">+ Tambah Kuiz</button>
      </div>
    </section>

    <section class="card">
      <h3 style="margin:0 0 10px; font-weight:950;">Senarai Kuiz</h3>
      <p class="muted small" style="margin:0 0 10px;">Kuiz yang <b>active</b> sahaja akan nampak di portal pelajar.</p>

      <div style="overflow:auto;">
        <table style="width:100%; border-collapse:collapse;">
          <thead>
            <tr>
              <th style="text-align:left; padding:10px 8px; border-bottom:1px solid rgba(15,23,42,.08);">Title</th>
              <th style="text-align:left; padding:10px 8px; border-bottom:1px solid rgba(15,23,42,.08);">Subject</th>
              <th style="text-align:left; padding:10px 8px; border-bottom:1px solid rgba(15,23,42,.08);">Status</th>
              <th style="text-align:left; padding:10px 8px; border-bottom:1px solid rgba(15,23,42,.08);">Link</th>
              <th style="text-align:left; padding:10px 8px; border-bottom:1px solid rgba(15,23,42,.08);">Tindakan</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="formCard" style="display:none;">
      <h3 style="margin:0 0 10px; font-weight:950;" id="formTitle">Tambah Kuiz</h3>

      <label>Subject</label>
      <select id="fSubject"></select>

      <label>Title</label>
      <input id="fTitle" placeholder="Contoh: Kuiz 1 - Bab 1" />

      <label>Google Form Link</label>
      <input id="fLink" placeholder="https://forms.gle/..." />

      <label>Active?</label>
      <select id="fActive">
        <option value="true">true</option>
        <option value="false">false</option>
      </select>

      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
        <button class="btn" id="btnSave" type="button">Simpan</button>
        <button class="btn ghost" id="btnCancel" type="button">Batal</button>
      </div>
    </section>
  </main>

  <script>
    const $ = (id)=>document.getElementById(id);
    const msgEl = $("msg");

    let token = "";
    let currentClassId = "";
    let subjects = [];
    let quizzes = [];
    let editingQuizId = "";

    function showMsg(text, ok){
      msgEl.style.display="block";
      msgEl.textContent=text;
      msgEl.style.background = ok ? "rgba(34,197,94,.10)" : "rgba(239,68,68,.10)";
      msgEl.style.border = ok ? "1px solid rgba(34,197,94,.28)" : "1px solid rgba(239,68,68,.28)";
      msgEl.style.color = ok ? "#065f46" : "#991b1b";
    }
    function clearMsg(){ msgEl.style.display="none"; msgEl.textContent=""; }

    function fillSelect(sel, items, getVal, getText){
      sel.innerHTML = "";
      items.forEach(it=>{
        const opt = document.createElement("option");
        opt.value = getVal(it);
        opt.textContent = getText(it);
        sel.appendChild(opt);
      });
    }

    async function guardAdmin(){
      token = getToken();
      requireAuthOrRedirect();
      const me = await apiPost({ action:"me", token });
      if(!me.ok){ logout(); return false; }
      if(String(me.user?.role||"").toLowerCase()!=="admin"){
        location.href="../pelajar/dashboard.html"; return false;
      }
      $("who").textContent = `Hi, ${me.user?.name || me.user?.email || "Admin"}`;
      return true;
    }

    async function loadClasses(){
      const r = await apiPost({ action:"adminListOwnedClasses", token });
      if(!r.ok) throw new Error(r.message || "Gagal load classes");
      fillSelect($("classSel"), r.classes || [], x=>x.classId, x=>`${x.className} (${x.classCode})`);
      currentClassId = $("classSel").value || "";
    }

    async function loadSubjects(){
      if(!currentClassId){ subjects=[]; return; }
      const r = await apiPost({ action:"adminListSubjects", token, classId: currentClassId });
      if(!r.ok) throw new Error(r.message || "Gagal load subjects");
      subjects = r.subjects || [];
      fillSelect($("subjectSel"), subjects, s=>s.subjectId, s=>`${s.subjectName}${s.isActive ? "" : " (inactive)"}`);
      fillSelect($("fSubject"), subjects, s=>s.subjectId, s=>`${s.subjectName}${s.isActive ? "" : " (inactive)"}`);
    }

    async function loadQuizzes(){
      if(!currentClassId){ quizzes=[]; render(); return; }
      const r = await apiPost({ action:"adminListQuizzes", token, classId: currentClassId });
      if(!r.ok) throw new Error(r.message || "Gagal load quizzes");
      quizzes = r.quizzes || [];
      render();
    }

    function render(){
      const tbody = $("rows");
      tbody.innerHTML = "";
      const filter = $("subjectSel").value || "";
      const arr = filter ? quizzes.filter(q=>q.subjectId===filter) : quizzes;

      if(!arr.length){
        tbody.innerHTML = `<tr><td colspan="5" class="muted" style="padding:12px 8px;">Tiada kuiz.</td></tr>`;
        return;
      }

      arr.forEach(q=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="padding:10px 8px; border-bottom:1px solid rgba(15,23,42,.08); font-weight:900;">${escapeHtml(q.title||"-")}</td>
          <td style="padding:10px 8px; border-bottom:1px solid rgba(15,23,42,.08);">
            <div style="font-weight:900;">${escapeHtml(q.subjectName||q.subjectId||"-")}</div>
            <div class="muted small">${escapeHtml(q.subjectId||"")}</div>
          </td>
          <td style="padding:10px 8px; border-bottom:1px solid rgba(15,23,42,.08);">
            <span class="tab ${q.isActive ? "active":""}">${q.isActive ? "active" : "inactive"}</span>
          </td>
          <td style="padding:10px 8px; border-bottom:1px solid rgba(15,23,42,.08);">
            ${q.quizLink ? `<a target="_blank" href="${escapeAttr(q.quizLink)}">Buka</a>` : `<span class="muted small">-</span>`}
          </td>
          <td style="padding:10px 8px; border-bottom:1px solid rgba(15,23,42,.08);">
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn ghost" data-act="edit">Edit</button>
              <button class="btn" data-act="active">${q.isActive ? "Deactivate" : "Activate"}</button>
            </div>
          </td>
        `;
        tr.querySelector('[data-act="edit"]').onclick = ()=>openForm(q);
        tr.querySelector('[data-act="active"]').onclick = ()=>toggleActive(q);
        tbody.appendChild(tr);
      });
    }

    function openForm(q){
      $("formCard").style.display="block";
      if(q){
        editingQuizId = q.quizId;
        $("formTitle").textContent="Edit Kuiz";
        $("fSubject").value = q.subjectId;
        $("fTitle").value = q.title || "";
        $("fLink").value = q.quizLink || "";
        $("fActive").value = q.isActive ? "true" : "false";
      }else{
        editingQuizId = "";
        $("formTitle").textContent="Tambah Kuiz";
        $("fSubject").value = $("subjectSel").value || (subjects[0]?.subjectId || "");
        $("fTitle").value="";
        $("fLink").value="";
        $("fActive").value="true";
      }
      window.scrollTo({ top: document.body.scrollHeight, behavior:"smooth" });
    }
    function closeForm(){
      $("formCard").style.display="none";
      editingQuizId="";
    }

    async function saveQuiz(){
      clearMsg();
      const subjectId = $("fSubject").value;
      const title = $("fTitle").value.trim();
      const quizLink = $("fLink").value.trim();
      const isActive = $("fActive").value;

      if(!subjectId || !title || !quizLink) return showMsg("Subject, title, dan link wajib.", false);

      const r = await apiPost({
        action:"adminUpsertQuiz",
        token,
        quizId: editingQuizId,
        subjectId,
        title,
        quizLink,
        isActive
      });
      if(!r.ok) return showMsg(r.message || "Gagal simpan kuiz", false);

      showMsg("Kuiz disimpan.", true);
      closeForm();
      await loadQuizzes();
    }

    async function toggleActive(q){
      clearMsg();
      const next = q.isActive ? "false" : "true";
      const r = await apiPost({ action:"adminSetQuizActive", token, quizId:q.quizId, isActive:next });
      if(!r.ok) return showMsg(r.message || "Gagal update active", false);
      showMsg("Berjaya update active.", true);
      await loadQuizzes();
    }

    $("btnReload").onclick = async ()=>{
      try{ clearMsg(); await loadSubjects(); await loadQuizzes(); showMsg("Reload ok.", true); }
      catch(e){ console.error(e); showMsg(e.message || String(e), false); }
    };
    $("btnNew").onclick = ()=>openForm(null);
    $("btnCancel").onclick = closeForm;
    $("btnSave").onclick = saveQuiz;

    $("classSel").onchange = async ()=>{
      currentClassId = $("classSel").value || "";
      try{ await loadSubjects(); await loadQuizzes(); }
      catch(e){ console.error(e); showMsg(e.message || String(e), false); }
    };
    $("subjectSel").onchange = render;

    (async ()=>{
      try{
        if(!await guardAdmin()) return;
        await loadClasses();
        await loadSubjects();
        await loadQuizzes();
        if(!currentClassId) showMsg("Tiada kelas owner admin ditemui.", false);
      }catch(e){
        console.error(e);
        showMsg(e.message || String(e), false);
      }
    })();
  </script>
</body>
</html>
