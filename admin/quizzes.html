<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Kuiz • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .page{ min-height:100vh; padding: 18px 16px 40px; }
    .top{ position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.50); }
    .top-inner{ max-width: 1100px; margin: 0 auto; padding: 14px 8px; display:flex; align-items:center; justify-content:space-between; gap: 12px; }
    .brand h1{ margin:0; font-size: 20px; font-weight: 950; }
    .brand p{ margin:4px 0 0; color:#334155; font-weight:800; font-size: 12px; }

    .btn{ border: 0; cursor: pointer; padding: 10px 14px; border-radius: 14px; font-weight: 900; background: #059669; color: #fff; box-shadow: 0 8px 18px rgba(5,150,105,.18); }
    .btn:hover{ background:#047857; }
    .btn.ghost{ background: rgba(255,255,255,.75); color:#0f172a; border: 1px solid rgba(15,23,42,.10); box-shadow: 0 10px 30px rgba(2,6,23,.06); }
    .btn.ghost:hover{ background: rgba(255,255,255,.90); }
    .btn.small{ padding: 8px 10px; border-radius: 12px; font-size: 12px; }

    .container{ max-width: 1100px; margin: 16px auto 0; display:grid; gap: 14px; }
    .card{ background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.55); border-radius: 18px; box-shadow: 0 10px 30px rgba(2, 6, 23, .10); padding: 18px; }

    label{ display:block; font-weight: 900; margin: 10px 0 6px; }
    select, input{
      width:100%; box-sizing:border-box; padding: 12px 12px;
      border-radius: 14px; border: 1px solid rgba(15,23,42,.16);
      background: rgba(255,255,255,.70); outline:none;
      font-weight: 800;
    }
    input:focus, select:focus{ border-color: rgba(5,150,105,.55); box-shadow: 0 0 0 4px rgba(5,150,105,.14); }

    .msg{ display:none; padding: 10px 12px; border-radius: 14px; font-weight: 900; }
    .msg.err{ display:block; background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.28); color: #991b1b; }
    .msg.ok{ display:block; background: rgba(34,197,94,.10); border: 1px solid rgba(34,197,94,.28); color: #065f46; }

    table{ width:100%; border-collapse: collapse; }
    th, td{ padding: 10px 8px; border-bottom: 1px solid rgba(15,23,42,.08); vertical-align: top; }
    th{ text-align:left; font-size: 12px; color:#334155; font-weight: 950; }
    td{ font-size: 13px; font-weight: 800; color:#0f172a; }
    .muted{ color:#334155; font-weight: 800; opacity:.9; font-size: 12px; }
    .pill{ display:inline-flex; padding: 4px 10px; border-radius: 999px; border:1px solid rgba(15,23,42,.12); background: rgba(255,255,255,.65); font-size: 12px; font-weight: 950; }
    .rowBtns{ display:flex; gap: 8px; flex-wrap: wrap; }
    .link{ color:#059669; font-weight: 950; text-decoration: none; }
    .link:hover{ text-decoration: underline; }

    .grid{ display:grid; gap:14px; grid-template-columns: 1fr; }
    @media(min-width: 900px){ .grid{ grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body class="stage">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>Admin • Kuiz</h1>
        <p id="who">Loading...</p>
      </div>
      <div style="display:flex; gap:10px;">
        <a class="btn ghost" href="./dashboard.html">← Dashboard</a>
        <button class="btn" id="btnLogout" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div id="msg" class="msg"></div>

      <div class="card">
        <div class="grid">
          <div>
            <label>Kelas (owner kau)</label>
            <select id="classSel"></select>
          </div>

          <div>
            <label>Subject</label>
            <select id="subjectSel"></select>
          </div>
        </div>

        <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
          <button class="btn" id="btnReload" type="button">Reload</button>
          <button class="btn ghost" id="btnNew" type="button">+ Tambah Kuiz</button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 10px; font-weight:950;">Senarai Kuiz</h3>
        <div class="muted" style="margin-bottom:10px;">Kuiz yang <b>active</b> sahaja akan nampak di portal pelajar.</div>

        <div style="overflow:auto;">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Subject</th>
                <th>Status</th>
                <th>Link</th>
                <th>Tindakan</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>

      <div class="card" id="formCard" style="display:none;">
        <h3 style="margin:0 0 10px; font-weight:950;" id="formTitle">Tambah Kuiz</h3>

        <label>Subject</label>
        <select id="fSubject"></select>

        <label>Title</label>
        <input id="fTitle" placeholder="Contoh: Kuiz 1 - Bab 1" />

        <label>Google Form Link</label>
        <input id="fLink" placeholder="https://forms.gle/..." />

        <label>Active?</label>
        <select id="fActive">
          <option value="true">true</option>
          <option value="false">false</option>
        </select>

        <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
          <button class="btn" id="btnSave" type="button">Simpan</button>
          <button class="btn ghost" id="btnCancel" type="button">Batal</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const $ = (id)=>document.getElementById(id);
    const msgEl = $("msg");
    const whoEl = $("who");

    let token = "";
    let meUser = null;

    let currentClassId = "";
    let subjects = [];
    let quizzes = [];
    let editingQuizId = "";

    function showMsg(type, text){
      msgEl.className = "msg " + (type === "ok" ? "ok" : "err");
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }
    function clearMsg(){
      msgEl.style.display = "none";
      msgEl.textContent = "";
      msgEl.className = "msg";
    }

    function getBaseUrl(){
      const cfg = window.APP_CONFIG;
      return (cfg && cfg.BASE_URL) ? cfg.BASE_URL : null;
    }
    async function apiPost(params){
      const BASE_URL = getBaseUrl();
      if(!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud. Semak config.js");

      const body = new URLSearchParams();
      Object.entries(params).forEach(([k,v]) => body.append(k, v ?? ""));

      const res = await fetch(BASE_URL, { method:"POST", body });
      const text = await res.text();
      try{ return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Invalid JSON from server", raw:text }; }
    }

    function requireLogin(){
      token = localStorage.getItem("kk_token") || "";
      if(!token){ location.href = "../pelajar/login.html"; return false; }
      return true;
    }

    async function guardAdmin(){
      const me = await apiPost({ action:"me", token });
      if(!me || !me.ok || !me.user){
        localStorage.removeItem("kk_token"); localStorage.removeItem("kk_user");
        location.href = "../pelajar/login.html"; return false;
      }
      if(String(me.user.role||"").toLowerCase() !== "admin"){
        location.href = "../pelajar/dashboard.html"; return false;
      }
      meUser = me.user;
      whoEl.textContent = `Hi, ${me.user.name || me.user.email || "Admin"}`;
      return true;
    }

    function fillSelect(sel, items, getVal, getText){
      sel.innerHTML = "";
      items.forEach(it=>{
        const opt = document.createElement("option");
        opt.value = getVal(it);
        opt.textContent = getText(it);
        sel.appendChild(opt);
      });
    }

    async function loadClasses(){
      const r = await apiPost({ action:"adminListOwnedClasses", token });
      if(!r.ok) throw new Error(r.message || "Gagal load classes");

      fillSelect($("classSel"), r.classes || [], x=>x.classId, x=>`${x.className} (${x.classCode})`);
      currentClassId = $("classSel").value || "";
    }

    async function loadSubjects(){
      if(!currentClassId){ subjects = []; return; }
      const r = await apiPost({ action:"adminListSubjects", token, classId: currentClassId });
      if(!r.ok) throw new Error(r.message || "Gagal load subjects");
      subjects = r.subjects || [];

      fillSelect($("subjectSel"), subjects, s=>s.subjectId, s=>`${s.subjectName}${s.isActive ? "" : " (inactive)"}`);
      fillSelect($("fSubject"), subjects, s=>s.subjectId, s=>`${s.subjectName}${s.isActive ? "" : " (inactive)"}`);
    }

    async function loadQuizzes(){
      if(!currentClassId){ quizzes=[]; renderQuizzes(); return; }
      const r = await apiPost({ action:"adminListQuizzes", token, classId: currentClassId });
      if(!r.ok) throw new Error(r.message || "Gagal load quizzes");
      quizzes = r.quizzes || [];
      renderQuizzes();
    }

    function renderQuizzes(){
      const tbody = $("rows");
      tbody.innerHTML = "";

      const subjectFilter = $("subjectSel").value || "";
      const filtered = subjectFilter ? quizzes.filter(n=>n.subjectId === subjectFilter) : quizzes;

      filtered.forEach(q=>{
        const tr = document.createElement("tr");

        const td1 = document.createElement("td");
        td1.textContent = q.title || "-";

        const td2 = document.createElement("td");
        td2.innerHTML = `<div>${q.subjectName || q.subjectId}</div><div class="muted">${q.subjectId}</div>`;

        const td3 = document.createElement("td");
        td3.innerHTML = `<span class="pill">${q.isActive ? "active" : "inactive"}</span>`;

        const td4 = document.createElement("td");
        td4.innerHTML = q.quizLink ? `<a class="link" href="${q.quizLink}" target="_blank" rel="noopener">Buka</a>` : `<span class="muted">-</span>`;

        const td5 = document.createElement("td");
        td5.className = "rowBtns";
        td5.innerHTML = `
          <button class="btn small ghost" data-act="edit">Edit</button>
          <button class="btn small" data-act="toggleActive">${q.isActive ? "Deactivate" : "Activate"}</button>
        `;

        td5.querySelector('[data-act="edit"]').onclick = ()=>openForm(q);
        td5.querySelector('[data-act="toggleActive"]').onclick = ()=>toggleActive(q);

        tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4); tr.appendChild(td5);
        tbody.appendChild(tr);
      });
    }

    function openForm(q){
      $("formCard").style.display = "block";
      if(q){
        editingQuizId = q.quizId;
        $("formTitle").textContent = "Edit Kuiz";
        $("fSubject").value = q.subjectId;
        $("fTitle").value = q.title || "";
        $("fLink").value = q.quizLink || "";
        $("fActive").value = q.isActive ? "true" : "false";
      }else{
        editingQuizId = "";
        $("formTitle").textContent = "Tambah Kuiz";
        $("fSubject").value = $("subjectSel").value || (subjects[0]?.subjectId || "");
        $("fTitle").value = "";
        $("fLink").value = "";
        $("fActive").value = "true";
      }
      window.scrollTo({ top: document.body.scrollHeight, behavior:"smooth" });
    }

    function closeForm(){
      $("formCard").style.display = "none";
      editingQuizId = "";
    }

    async function saveQuiz(){
      clearMsg();
      const subjectId = $("fSubject").value;
      const title = $("fTitle").value.trim();
      const quizLink = $("fLink").value.trim();
      const isActive = $("fActive").value;

      if(!subjectId || !title || !quizLink){
        showMsg("err","Subject, title, dan link wajib.");
        return;
      }

      const r = await apiPost({
        action:"adminUpsertQuiz",
        token,
        quizId: editingQuizId,
        subjectId,
        title,
        quizLink,
        isActive
      });

      if(!r.ok){
        showMsg("err", r.message || "Gagal simpan kuiz");
        return;
      }

      showMsg("ok", "Kuiz disimpan.");
      closeForm();
      await loadQuizzes();
    }

    async function toggleActive(q){
      clearMsg();
      const next = q.isActive ? "false" : "true";
      const r = await apiPost({ action:"adminSetQuizActive", token, quizId: q.quizId, isActive: next });
      if(!r.ok){ showMsg("err", r.message || "Gagal tukar active"); return; }

      showMsg("ok", "Berjaya update active.");
      await loadQuizzes();
    }

    $("btnLogout").onclick = ()=>{
      localStorage.removeItem("kk_token");
      localStorage.removeItem("kk_user");
      location.href = "../pelajar/login.html";
    };

    $("classSel").onchange = async ()=>{
      currentClassId = $("classSel").value || "";
      try{
        await loadSubjects();
        await loadQuizzes();
      }catch(e){
        console.error(e);
        showMsg("err", e.message || String(e));
      }
    };

    $("subjectSel").onchange = renderQuizzes;
    $("btnReload").onclick = async ()=>{
      try{ clearMsg(); await loadSubjects(); await loadQuizzes(); showMsg("ok","Reload ok."); }
      catch(e){ console.error(e); showMsg("err", e.message || String(e)); }
    };
    $("btnNew").onclick = ()=>openForm(null);
    $("btnCancel").onclick = closeForm;
    $("btnSave").onclick = ()=>saveQuiz();

    (async ()=>{
      try{
        if(!requireLogin()) return;
        if(!await guardAdmin()) return;

        await loadClasses();
        await loadSubjects();
        await loadQuizzes();

        if(!currentClassId){
          showMsg("err","Tiada kelas owner admin ditemui. Semak sheet Classes.ownerUserId = userId admin.");
        }
      }catch(e){
        console.error(e);
        showMsg("err", e.message || String(e));
      }
    })();
  </script>
</body>
</html>
