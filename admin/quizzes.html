<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Quizzes • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
  <script src="../app.js"></script>

  <style>
    .page{ min-height:100vh; padding:18px 16px 40px; }
    .top{ position: sticky; top:0; z-index:20; background: rgba(255,255,255,.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.50); }
    .top-inner{ max-width:1100px; margin:0 auto; padding: 14px 8px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand{ display:flex; flex-direction:column; gap:4px; }
    .brand h1{ margin:0; font-size:22px; letter-spacing:-.02em; line-height:1.1; }
    .brand .sub{ margin:0; color:#334155; font-weight:800; font-size:13px; opacity:.9; }

    .btn{ border:0; cursor:pointer; padding:10px 14px; border-radius:14px; font-weight:900; background:#059669; color:#fff; box-shadow:0 8px 18px rgba(5,150,105,.18); }
    .btn:hover{ background:#047857; }
    .btn.ghost{ background: rgba(255,255,255,.75); color:#0f172a; border:1px solid rgba(15,23,42,.10); box-shadow:0 10px 30px rgba(2,6,23,.06); }
    .btn.ghost:hover{ background: rgba(255,255,255,.90); }

    .container{ max-width:1100px; margin:16px auto 0; display:grid; gap:14px; }

    .card{ background: rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.55); border-radius:18px; box-shadow:0 10px 30px rgba(2,6,23,.10); padding:18px; }
    .grid{ display:grid; gap:14px; grid-template-columns: 1fr; }
    @media(min-width: 900px){ .grid{ grid-template-columns: 1fr 1fr; } }

    .msg{ display:none; padding:10px 12px; border-radius:14px; font-weight:900; }
    .msg.err{ display:block; background: rgba(239,68,68,.10); border:1px solid rgba(239,68,68,.28); color:#991b1b; }
    .msg.ok{ display:block; background: rgba(34,197,94,.10); border:1px solid rgba(34,197,94,.28); color:#065f46; }

    label{ display:block; font-weight:900; margin:12px 0 8px; }
    .input{
      width:100%; box-sizing:border-box; padding:12px 14px; border-radius:14px;
      border:1px solid rgba(15,23,42,.16); background:rgba(255,255,255,.70);
      outline:none; font-size:14px;
    }
    .input:focus{ border-color:rgba(5,150,105,.55); box-shadow:0 0 0 4px rgba(5,150,105,.14); }

    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px; border-radius:999px;
      border:1px solid rgba(5,150,105,.20);
      background: rgba(5,150,105,.08);
      color:#065f46; font-weight:950; font-size:12px;
      width: fit-content;
    }

    .list{ display:grid; gap:12px; }
    .quiz-card{
      border-radius:18px; padding:14px;
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(15,23,42,.08);
      box-shadow: 0 14px 34px rgba(2,6,23,.08);
      display:flex; flex-direction:column; gap:10px;
    }
    .quiz-card .title{ margin:0; font-weight:950; font-size:16px; }
    .quiz-card .meta{ margin:0; color:#334155; font-weight:800; font-size:13px; opacity:.9; line-height:1.35; }
    .quiz-card .actions{ display:flex; gap:10px; flex-wrap:wrap; }
    .badge{
      display:inline-flex; align-items:center; padding:6px 10px; border-radius:999px;
      font-weight:950; font-size:12px; border:1px solid rgba(15,23,42,.12); background:rgba(255,255,255,.65);
    }
    .badge.green{ border-color: rgba(34,197,94,.25); background: rgba(34,197,94,.10); color:#065f46; }
    .badge.red{ border-color: rgba(239,68,68,.25); background: rgba(239,68,68,.10); color:#991b1b; }
    .muted{ margin:0; color:#334155; font-weight:800; opacity:.92; line-height:1.55; }
    .section-title{ margin: 0 0 10px; font-size: 16px; font-weight: 950; letter-spacing: -.01em; }
  </style>
</head>

<body class="stage">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>Admin • Quizzes</h1>
        <p class="sub" id="who">Memuatkan...</p>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn ghost" id="btnBack" type="button">← Dashboard</button>
        <button class="btn ghost" id="btnRefresh" type="button">Muat semula</button>
        <button class="btn" id="btnLogout" type="button">Keluar</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div id="msg" class="msg"></div>

      <div class="grid">
        <!-- left: form -->
        <section class="card">
          <h2 class="section-title">Tambah / Kemaskini Kuiz</h2>

          <label>Kelas</label>
          <select id="classId" class="input"></select>

          <label>Subject</label>
          <select id="subjectId" class="input"></select>

          <label>Tajuk Kuiz</label>
          <input id="title" class="input" type="text" placeholder="Contoh: Quiz Bab 1" />

          <label>Quiz Link (Google Form)</label>
          <input id="quizLink" class="input" type="url" placeholder="https://forms.gle/..." />

          <label>Status Active</label>
          <select id="isActive" class="input">
            <option value="true">Active</option>
            <option value="false">Inactive</option>
          </select>

          <div class="row" style="margin-top:14px;">
            <button class="btn" id="btnSave" type="button">Simpan</button>
            <button class="btn ghost" id="btnClear" type="button">Clear</button>
          </div>

          <p class="muted" style="margin-top:12px;">
            Tip: Pelajar hanya nampak kuiz yang “Active”.
          </p>
        </section>

        <!-- right: list -->
        <section class="card">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
            <h2 class="section-title" style="margin:0;">Senarai Kuiz</h2>
            <div class="row">
              <span class="pill" id="pillCount">Kuiz: -</span>
            </div>
          </div>

          <div id="quizzes" class="list" style="margin-top:12px;"></div>

          <p id="emptyHint" class="muted" style="margin-top:10px; display:none;">
            Tiada kuiz untuk kelas ini lagi.
          </p>
        </section>
      </div>
    </div>
  </main>

  <script>
    // WAJIB: lock page admin
    requireAdminOrRedirect();

    const msgEl = document.getElementById("msg");
    const whoEl = document.getElementById("who");
    const listEl = document.getElementById("quizzes");
    const emptyHint = document.getElementById("emptyHint");
    const pillCount = document.getElementById("pillCount");

    const classSel = document.getElementById("classId");
    const subjectSel = document.getElementById("subjectId");
    const titleEl = document.getElementById("title");
    const linkEl = document.getElementById("quizLink");
    const activeSel = document.getElementById("isActive");

    const btnSave = document.getElementById("btnSave");
    const btnClear = document.getElementById("btnClear");
    const btnRefresh = document.getElementById("btnRefresh");
    const btnBack = document.getElementById("btnBack");
    const btnLogout = document.getElementById("btnLogout");

    let editingQuizId = "";

    function showMsg(type, text){
      msgEl.className = "msg " + (type === "ok" ? "ok" : "err");
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }
    function clearMsg(){
      msgEl.style.display = "none";
      msgEl.textContent = "";
      msgEl.className = "msg";
    }

    function setWho(){
      const u = getUser();
      const name = u.name || u.email || "Admin";
      whoEl.textContent = `Hi, ${name}`;
    }

    function opt(html){
      const d = document.createElement("div");
      d.innerHTML = html.trim();
      return d.firstChild;
    }

    function resetForm(){
      editingQuizId = "";
      titleEl.value = "";
      linkEl.value = "";
      activeSel.value = "true";
      btnSave.textContent = "Simpan";
    }

    async function loadOwnedClasses(){
      const out = await apiPost({ action:"adminListOwnedClasses" });
      if(!out || !out.ok) throw new Error(out?.message || "Gagal load classes");

      classSel.innerHTML = "";
      (out.classes || []).forEach(c => {
        classSel.appendChild(opt(`<option value="${escapeAttr(c.classId)}">${escapeHtml(c.className)} (${escapeHtml(c.classCode||"")})</option>`));
      });

      if(!classSel.value && (out.classes || []).length){
        classSel.value = out.classes[0].classId;
      }
    }

    async function loadSubjects(){
      subjectSel.innerHTML = "";
      const classId = classSel.value;
      if(!classId){
        subjectSel.appendChild(opt(`<option value="">(Tiada kelas)</option>`));
        return;
      }

      const out = await apiPost({ action:"adminListSubjects", classId });
      if(!out || !out.ok) throw new Error(out?.message || "Gagal load subjects");

      const subs = (out.subjects || []).filter(s => s.isActive !== false);
      if(!subs.length){
        subjectSel.appendChild(opt(`<option value="">(Tiada subject — tambah dulu dekat Admin Subjects)</option>`));
        return;
      }

      subs.forEach(s => {
        subjectSel.appendChild(opt(`<option value="${escapeAttr(s.subjectId)}">${escapeHtml(s.subjectName)}</option>`));
      });

      if(!subjectSel.value) subjectSel.value = subs[0].subjectId;
    }

    function renderQuizzes(list){
      listEl.innerHTML = "";

      const arr = Array.isArray(list) ? list : [];
      pillCount.textContent = `Kuiz: ${arr.length}`;
      emptyHint.style.display = arr.length ? "none" : "block";

      arr.forEach(q => {
        const isActive = (q.isActive !== false);

        const badgeActive = isActive
          ? `<span class="badge green">Active</span>`
          : `<span class="badge red">Inactive</span>`;

        const card = document.createElement("div");
        card.className = "quiz-card";
        card.innerHTML = `
          <p class="title">${escapeHtml(q.title || "Untitled")}</p>
          <p class="meta">
            <b>Subject:</b> ${escapeHtml(q.subjectName || q.subjectId || "-")}<br>
            <b>Link:</b> ${q.quizLink ? `<a href="${escapeAttr(q.quizLink)}" target="_blank" rel="noopener">buka</a>` : "-"}<br>
            <b>Created:</b> ${escapeHtml(q.createdAt || "-")}
          </p>
          <div class="row">${badgeActive}</div>
          <div class="actions">
            <button class="btn ghost" type="button" data-act="edit">Edit</button>
            <button class="btn ghost" type="button" data-act="toggleActive">${isActive ? "Set Inactive" : "Set Active"}</button>
          </div>
        `;

        card.querySelector('[data-act="edit"]').addEventListener("click", () => {
          editingQuizId = q.quizId || "";
          if(q.subjectId) subjectSel.value = q.subjectId;
          titleEl.value = q.title || "";
          linkEl.value = q.quizLink || "";
          activeSel.value = isActive ? "true" : "false";
          btnSave.textContent = "Kemaskini";
          showMsg("ok", "Mode edit: kuiz dipilih. Lepas kemaskini tekan Kemaskini.");
          window.scrollTo({ top:0, behavior:"smooth" });
        });

        card.querySelector('[data-act="toggleActive"]').addEventListener("click", async () => {
          clearMsg();
          const out = await apiPost({ action:"adminSetQuizActive", quizId: q.quizId, isActive: String(!isActive) });
          if(!out || !out.ok){ showMsg("err", out?.message || "Gagal tukar status"); return; }
          showMsg("ok", "Status kuiz dikemaskini.");
          await loadQuizzes();
        });

        listEl.appendChild(card);
      });
    }

    async function loadQuizzes(){
      const classId = classSel.value;
      if(!classId){ renderQuizzes([]); return; }

      const out = await apiPost({ action:"adminListQuizzes", classId });
      if(!out || !out.ok) throw new Error(out?.message || "Gagal load quizzes");
      renderQuizzes(out.quizzes || []);
    }

    async function saveQuiz(){
      clearMsg();

      const subjectId = subjectSel.value;
      const title = titleEl.value.trim();
      const quizLink = linkEl.value.trim();
      const isActive = activeSel.value;

      if(!subjectId){ showMsg("err", "Subject wajib."); return; }
      if(!title){ showMsg("err", "Tajuk wajib."); return; }
      if(!quizLink){ showMsg("err", "Quiz link wajib."); return; }

      btnSave.disabled = true;
      btnSave.textContent = (editingQuizId ? "Kemaskini..." : "Simpan...");

      try{
        const out = await apiPost({
          action:"adminUpsertQuiz",
          quizId: editingQuizId || "",
          subjectId,
          title,
          quizLink,
          isActive
        });

        if(!out || !out.ok){
          showMsg("err", out?.message || "Simpan gagal.");
          return;
        }

        showMsg("ok", editingQuizId ? "Kuiz dikemaskini." : "Kuiz ditambah.");
        resetForm();
        await loadQuizzes();

      }catch(e){
        console.error(e);
        showMsg("err", "Ralat simpan. Check Console.");
      }finally{
        btnSave.disabled = false;
        btnSave.textContent = "Simpan";
      }
    }

    // events
    classSel.addEventListener("change", async () => {
      resetForm();
      try{
        await loadSubjects();
        await loadQuizzes();
      }catch(e){
        console.error(e);
        showMsg("err", e.message || "Gagal load data.");
      }
    });

    btnSave.addEventListener("click", saveQuiz);
    btnClear.addEventListener("click", () => { clearMsg(); resetForm(); });

    btnRefresh.addEventListener("click", async () => {
      clearMsg();
      try{
        await loadOwnedClasses();
        await loadSubjects();
        await loadQuizzes();
        showMsg("ok", "Reload siap.");
      }catch(e){
        console.error(e);
        showMsg("err", e.message || "Reload gagal.");
      }
    });

    btnBack.addEventListener("click", () => go("/admin/dashboard.html"));
    btnLogout.addEventListener("click", logout);

    // init
    (async function init(){
      setWho();
      resetForm();
      try{
        await loadOwnedClasses();
        await loadSubjects();
        await loadQuizzes();
        showMsg("ok", "Admin Quizzes siap dimuatkan.");
      }catch(e){
        console.error(e);
        showMsg("err", e.message || "Gagal init Admin Quizzes.");
      }
    })();
  </script>
</body>
</html>
