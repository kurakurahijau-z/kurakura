<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • Redirect</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
  <script src="../app.js"></script>

  <style>
    .wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .cardx{
      width:min(560px,92vw);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, .10);
      padding: 18px;
    }
    .t{ margin:0 0 6px; font-size:18px; font-weight:950; letter-spacing:-.01em; }
    .s{ margin:0; color:var(--kk-muted); font-weight:800; }
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <section class="cardx">
      <p class="t">Admin</p>
      <p class="s">Redirecting…</p>
    </section>
  </main>

  <script>
    // Pastikan hanya admin boleh lepas
    try{
      requireAdminOrRedirect();           // akan campak kalau bukan admin / tak login
      go("/admin/dashboard.html");        // kalau ok, terus dashboard admin
    }catch(e){
      // fallback safety
      go("/pelajar/login.html");
    }
  </script>
</body>
</html>
