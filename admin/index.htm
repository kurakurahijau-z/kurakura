<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard • Kura Kura Hijau</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Admin Dashboard</h1>
      <p id="meLine" class="muted"></p>
    </div>
    <div class="actions">
      <button class="btn primary" onclick="go('create-class.html')">+ Buat Kelas</button>
      <button class="btn" onclick="go('../dashboard.html')">Dashboard</button>
      <button class="btn danger" onclick="logout()">Keluar</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Kelas Anda</h2>
      <p class="muted">Pilih kelas untuk urus Subjects / Notes / Quizzes.</p>

      <div id="status" class="notice"></div>
      <div id="classes" class="grid"></div>
    </section>
  </main>

<script src="../app.js"></script>
<script>
(async function init(){
  requireAuthOrRedirect();

  const me = await apiPost({ action:"me" });
  if(!me.ok) return setStatus(me.message || "Gagal load profile.");

  if(String(me.user.role||"").toLowerCase() !== "admin"){
    setStatus("Akses ditolak. Akaun ini bukan admin.");
    return;
  }

  document.getElementById("meLine").textContent =
    `Hi, ${me.user.name || me.user.email} (Admin)`;

  const res = await apiPost({ action:"adminListOwnedClasses" });
  if(!res.ok) return setStatus(res.message || "Gagal load kelas.");

  renderClasses(res.classes || []);
})();

function setStatus(msg){
  const el = document.getElementById("status");
  el.textContent = msg || "";
  el.style.display = msg ? "block" : "none";
}

function renderClasses(list){
  const root = document.getElementById("classes");
  root.innerHTML = "";

  if(!list.length){
    root.innerHTML = `
      <div class="muted">
        Tiada kelas lagi. Tekan <b>+ Buat Kelas</b> dekat atas.
      </div>
    `;
    return;
  }

  list.forEach(c=>{
    const div = document.createElement("div");
    div.className = "tile";
    div.innerHTML = `
      <div class="tile-title">${escapeHtml(c.className || c.classId)}</div>
      <div class="tile-sub muted">Code: <b>${escapeHtml(c.classCode||"-")}</b></div>
      <div class="tile-actions">
        <button class="btn" onclick="go('class.html?classId=${encodeURIComponent(c.classId)}')">Urus Kelas</button>
      </div>
    `;
    root.appendChild(div);
  });
}
</script>
</body>
</html>
