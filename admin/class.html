<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Urus Kelas • Admin</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
  <script src="../app.js"></script>
</head>
<body class="stage">
  <header class="topbar">
    <div class="inner">
      <div>
        <h1>Urus Kelas</h1>
        <p id="who" class="muted">Loading...</p>
      </div>
      <div class="actions">
        <a class="btn ghost" href="./dashboard.html">← Dashboard</a>
        <button class="btn danger" onclick="logout()">Keluar</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="msg" class="notice"></div>

    <section class="card">
      <div class="grid2">
        <div class="card" style="padding:14px;">
          <h2 style="margin:0; font-weight:950;">Create Kelas</h2>
          <p class="muted small">Auto generate classCode (contoh PMS-1234).</p>

          <label>Nama kelas</label>
          <input id="className" placeholder="Contoh: Kelas DUP4A (Accounting)" />

          <button class="btn" id="btnCreate" style="margin-top:12px;">Create</button>
        </div>

        <div class="card" style="padding:14px;">
          <h2 style="margin:0; font-weight:950;">Senarai kelas (owner)</h2>
          <div id="list" class="list" style="margin-top:10px;"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const msg = document.getElementById("msg");
    const list = document.getElementById("list");
    function showMsg(text, ok){
      msg.style.display="block";
      msg.textContent=text;
      msg.style.background = ok ? "rgba(34,197,94,.10)" : "rgba(239,68,68,.10)";
      msg.style.border = ok ? "1px solid rgba(34,197,94,.28)" : "1px solid rgba(239,68,68,.28)";
      msg.style.color = ok ? "#065f46" : "#991b1b";
    }
    function clearMsg(){ msg.style.display="none"; msg.textContent=""; }

    async function guard(){
      requireAuthOrRedirect();
      const r = await apiPost({ action:"me", token:getToken() });
      if(!r.ok){ logout(); return null; }
      if(String(r.user?.role||"").toLowerCase()!=="admin"){
        location.href="../pelajar/dashboard.html"; return null;
      }
      document.getElementById("who").textContent = `Hi, ${r.user?.name || r.user?.email || "admin"}`;
      return r.user;
    }

    async function loadClasses(){
      list.innerHTML="";
      const r = await apiPost({ action:"adminListOwnedClasses", token:getToken() });
      if(!r.ok){
        list.innerHTML = `<div class="muted">Gagal load classes.</div>`;
        return;
      }
      const arr = r.classes || [];
      if(!arr.length){
        list.innerHTML = `<div class="muted">Belum ada kelas.</div>`;
        return;
      }
      arr.forEach(c=>{
        const div = document.createElement("div");
        div.className="item";
        div.innerHTML = `
          <div class="item-main">
            <div class="item-title">${escapeHtml(c.className)}</div>
            <div class="muted small">classCode: <b>${escapeHtml(c.classCode)}</b> • classId: ${escapeHtml(c.classId)}</div>
          </div>
          <div class="item-actions">
            <a class="btn ghost" href="./notes.html">Nota</a>
            <a class="btn ghost" href="./quizzes.html">Kuiz</a>
          </div>
        `;
        list.appendChild(div);
      });
    }

    document.getElementById("btnCreate").onclick = async ()=>{
      clearMsg();
      const className = document.getElementById("className").value.trim();
      if(!className) return showMsg("Nama kelas wajib.", false);

      const r = await apiPost({ action:"adminCreateClass", token:getToken(), className });
      if(!r.ok) return showMsg(r.message || "Gagal create kelas.", false);

      showMsg(`Berjaya create kelas. ClassCode: ${r.class?.classCode}`, true);
      document.getElementById("className").value="";
      await loadClasses();
    };

    (async ()=>{
      const u = await guard(); if(!u) return;
      await loadClasses();
    })();
  </script>
</body>
</html>
