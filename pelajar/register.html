<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Pelajar</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:26px 16px; }
    .box{ width:min(540px,92vw); }
    .title{ margin:0 0 6px; font-size:42px; line-height:1.05; letter-spacing:-.02em; font-weight:900; }
    .sub{ margin:0 0 18px; color:var(--kk-muted); font-weight:600; }
    label{ display:block; font-weight:800; margin:14px 0 8px; }
    .input{
      width:100%; box-sizing:border-box; padding:14px 14px; border-radius:14px;
      border:1px solid rgba(15,23,42,.16); background:rgba(255,255,255,.70);
      outline:none; font-size:15px;
    }
    .input:focus{ border-color:rgba(5,150,105,.55); box-shadow:0 0 0 4px rgba(5,150,105,.14); }
    .btn{ width:100%; margin-top:16px; }
    .msg{ margin-top:12px; padding:10px 12px; border-radius:12px; font-weight:800; display:none; }
    .msg.ok{ display:block; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.25); color:#065f46; }
    .msg.err{ display:block; background:rgba(239,68,68,.10); border:1px solid rgba(239,68,68,.22); color:#991b1b; }
    .row{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; flex-wrap:wrap; }
    .back{ display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--kk-text); font-weight:800; opacity:.9; }
    .back:hover{ opacity:1; }
    .tiny{ font-size:12px; color:var(--kk-muted); font-weight:700; opacity:.85; }
    .kbd{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
      font-size:11px; padding:2px 6px; border-radius:8px; border:1px solid rgba(15,23,42,.18); background:rgba(255,255,255,.55);
    }
    .hint{
      margin:8px 0 0;
      font-size:12px;
      color:var(--kk-muted);
      font-weight:700;
      line-height:1.45;
      opacity:.9;
    }
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <section class="card box">
      <h1 class="title">Daftar Pelajar</h1>
      <p class="sub">Isi maklumat ringkas untuk cipta akaun.</p>

      <div id="msg" class="msg"></div>

      <label for="name">Nama (optional)</label>
      <input id="name" class="input" type="text" placeholder="contoh: Ali" autocomplete="name" />

      <label for="email">Email</label>
      <input id="email" class="input" type="email" placeholder="contoh: ali@student.com" autocomplete="username" />

      <label for="studentId">No Pendaftaran</label>
      <input id="studentId" class="input" type="text" placeholder="contoh: DUP4A-23-0123" />

      <label for="password">Password</label>
      <input id="password" class="input" type="password" placeholder="Password (min 4)" autocomplete="new-password" />

      <label for="classCode">Kod Kelas (optional tapi digalakkan)</label>
      <input id="classCode" class="input" type="text" placeholder="contoh: PMS-ABC123" />
      <p class="hint">Kalau isi kod kelas, lepas daftar sistem akan auto join kelas tu.</p>

      <button id="btnRegister" class="btn-primary btn">Daftar</button>

      <div class="row">
        <a class="back" href="./login.html">← balik ke login</a>
        <div class="tiny">Tip Mac: Console <span class="kbd">⌥⌘J</span></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id)=>document.getElementById(id);

    function showMsg(type, text){
      const el = $("msg");
      el.className = "msg " + (type==="ok" ? "ok" : "err");
      el.textContent = text;
      el.style.display = "block";
    }

    function getBaseUrl(){
      const cfg = window.APP_CONFIG;
      return (cfg && cfg.BASE_URL) ? cfg.BASE_URL : null;
    }

    async function apiPost(params){
      const BASE_URL = getBaseUrl();
      if(!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud. Semak config.js");

      const body = new URLSearchParams();
      Object.entries(params).forEach(([k,v])=> body.append(k, v ?? ""));

      const res = await fetch(BASE_URL, { method:"POST", body });
      const text = await res.text();
      try{ return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Invalid JSON from server", raw:text }; }
    }

    $("btnRegister").addEventListener("click", async ()=>{
      const name = $("name").value.trim();
      const email = $("email").value.trim();
      const studentId = $("studentId").value.trim();
      const password = $("password").value;
      const classCode = $("classCode").value.trim();

      if(!email || !studentId || !password){
        showMsg("err","Isi email, no pendaftaran & password dulu.");
        return;
      }
      if(password.length < 4){
        showMsg("err","Password terlalu pendek (min 4).");
        return;
      }

      $("btnRegister").disabled = true;
      $("btnRegister").textContent = "Daftar...";

      try{
        // 1) register
        const reg = await apiPost({
          action: "register",
          name,
          email,
          studentId,
          password
        });

        if(!reg || !reg.ok){
          showMsg("err", reg?.message || "Register gagal.");
          $("btnRegister").disabled = false;
          $("btnRegister").textContent = "Daftar";
          return;
        }

        showMsg("ok","Register berjaya. Auto login...");

        // 2) auto login
        const log = await apiPost({
          action: "login",
          email,
          password
        });

        if(!log || !log.ok || !log.token){
          showMsg("err", log?.message || "Auto login gagal. Sila login manual.");
          setTimeout(()=> window.location.href = "./login.html", 800);
          return;
        }

        localStorage.setItem("kk_token", log.token);
        if(log.user) localStorage.setItem("kk_user", JSON.stringify(log.user));

        // 3) auto join class (kalau ada classCode)
        if(classCode){
          const join = await apiPost({
            action: "joinClass",
            token: log.token,
            classCode
          });

          if(join && join.ok){
            showMsg("ok","Siap daftar + join kelas. Redirect dashboard...");
            setTimeout(()=> window.location.href = "./dashboard.html", 650);
            return;
          }else{
            // join fail tapi akaun dah wujud; still boleh masuk dashboard
            showMsg("err", (join?.message || "Join kelas gagal") + " — anda masih boleh join kemudian.");
            setTimeout(()=> window.location.href = "./dashboard.html", 900);
            return;
          }
        }

        // kalau tak isi kod kelas
        showMsg("ok","Register + login berjaya. Redirect dashboard...");
        setTimeout(()=> window.location.href = "./dashboard.html", 650);

      }catch(err){
        console.error(err);
        showMsg("err","Fetch gagal. Check Console (URL / CORS).");
        $("btnRegister").disabled = false;
        $("btnRegister").textContent = "Daftar";
      }
    });
  </script>
</body>
</html>
