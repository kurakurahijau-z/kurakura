<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password Pelajar</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 16px;
    }
    .box{
      width:min(520px,92vw);
    }
    h1{
      margin:0 0 6px;
      font-size:38px;
      font-weight:900;
      letter-spacing:-0.02em;
    }
    .sub{
      margin:0 0 18px;
      color:var(--kk-muted);
      font-weight:700;
    }
    label{
      display:block;
      margin:14px 0 8px;
      font-weight:800;
    }
    .input{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid rgba(15,23,42,.16);
      background:rgba(255,255,255,.75);
      font-size:15px;
      outline:none;
    }
    .input:focus{
      border-color:rgba(5,150,105,.55);
      box-shadow:0 0 0 4px rgba(5,150,105,.14);
    }
    .btn{
      width:100%;
      margin-top:18px;
    }
    .msg{
      display:none;
      margin-bottom:14px;
      padding:10px 12px;
      border-radius:12px;
      font-weight:800;
    }
    .msg.ok{
      display:block;
      background:rgba(34,197,94,.12);
      border:1px solid rgba(34,197,94,.25);
      color:#065f46;
    }
    .msg.err{
      display:block;
      background:rgba(239,68,68,.10);
      border:1px solid rgba(239,68,68,.22);
      color:#991b1b;
    }
    .row{
      margin-top:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    a{
      text-decoration:none;
      font-weight:800;
      color:var(--kk-text);
      opacity:.9;
    }
    a:hover{opacity:1;}
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <section class="card box">
      <h1>Reset Password</h1>
      <p class="sub">Masukkan email & no pendaftaran pelajar.</p>

      <div id="msg" class="msg"></div>

      <label>Email</label>
      <input id="email" class="input" type="email" placeholder="ali@student.com"/>

      <label>No Pendaftaran</label>
      <input id="studentId" class="input" type="text" placeholder="DUP4A-23-0123"/>

      <label>Password Baru</label>
      <input id="newPassword" class="input" type="password" placeholder="Password baru"/>

      <button id="btnReset" class="btn-primary btn">Reset Password</button>

      <div class="row">
        <a href="./login.html">← balik login</a>
      </div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    function showMsg(type,text){
      const m = $("msg");
      m.className = "msg " + (type==="ok"?"ok":"err");
      m.textContent = text;
    }

    function baseUrl(){
      if(!window.APP_CONFIG || !APP_CONFIG.BASE_URL)
        throw new Error("BASE_URL tak wujud");
      return APP_CONFIG.BASE_URL;
    }

    async function apiPost(data){
      const body = new URLSearchParams(data);
      const res = await fetch(baseUrl(),{
        method:"POST",
        body
      });
      const t = await res.text();
      try{ return JSON.parse(t); }
      catch(e){ return {ok:false,message:"Invalid JSON",raw:t}; }
    }

    $("btnReset").onclick = async ()=>{
      const email = $("email").value.trim();
      const studentId = $("studentId").value.trim();
      const newPassword = $("newPassword").value;

      if(!email || !studentId || !newPassword){
        showMsg("err","Sila isi semua medan.");
        return;
      }

      $("btnReset").disabled = true;
      $("btnReset").textContent = "Memproses...";

      try{
        const r = await apiPost({
          action:"resetPassword",
          email,
          studentId,
          newPassword
        });

        if(!r.ok){
          showMsg("err", r.message || "Reset gagal.");
          $("btnReset").disabled=false;
          $("btnReset").textContent="Reset Password";
          return;
        }

        showMsg("ok","Password berjaya direset. Sila login.");
        setTimeout(()=>location.href="./login.html",1200);

      }catch(e){
        console.error(e);
        showMsg("err","Fetch gagal. Check Console.");
        $("btnReset").disabled=false;
        $("btnReset").textContent="Reset Password";
      }
    };
  </script>
</body>
</html>
