<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:26px 16px; }
    .box{ width:min(540px,92vw); }
    .title{ margin:0 0 6px; font-size:42px; line-height:1.05; letter-spacing:-.02em; font-weight:900; }
    .sub{ margin:0 0 18px; color:var(--kk-muted); font-weight:600; }
    label{ display:block; font-weight:800; margin:14px 0 8px; }
    .input{
      width:100%; box-sizing:border-box; padding:14px 14px; border-radius:14px;
      border:1px solid rgba(15,23,42,.16); background:rgba(255,255,255,.70);
      outline:none; font-size:15px;
    }
    .input:focus{ border-color:rgba(5,150,105,.55); box-shadow:0 0 0 4px rgba(5,150,105,.14); }
    .btn{ width:100%; margin-top:16px; }
    .msg{ margin-top:12px; padding:10px 12px; border-radius:12px; font-weight:800; display:none; }
    .msg.ok{ display:block; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.25); color:#065f46; }
    .msg.err{ display:block; background:rgba(239,68,68,.10); border:1px solid rgba(239,68,68,.22); color:#991b1b; }
    .row{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; flex-wrap:wrap; }
    .back{ display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--kk-text); font-weight:800; opacity:.9; }
    .back:hover{ opacity:1; }
    .tiny{ font-size:12px; color:var(--kk-muted); font-weight:700; opacity:.85; }
    .kbd{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
      font-size:11px; padding:2px 6px; border-radius:8px; border:1px solid rgba(15,23,42,.18); background:rgba(255,255,255,.55);
    }
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <section class="card box">
      <h1 class="title">Reset Password</h1>
      <p class="sub">Masukkan email + no pendaftaran untuk set password baru.</p>

      <div id="msg" class="msg"></div>

      <label for="email">Email</label>
      <input id="email" class="input" type="email" placeholder="contoh: ali@student.com" autocomplete="username" />

      <label for="studentId">No Pendaftaran</label>
      <input id="studentId" class="input" type="text" placeholder="contoh: DUP4A-23-0123" />

      <label for="newPassword">Password Baru</label>
      <input id="newPassword" class="input" type="password" placeholder="Password baru (min 4)" autocomplete="new-password" />

      <button id="btnReset" class="btn-primary btn">Reset Password</button>

      <div class="row">
        <a class="back" href="./login.html">← balik ke login</a>
        <div class="tiny">Tip Mac: Console <span class="kbd">⌥⌘J</span></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id)=>document.getElementById(id);

    function showMsg(type, text){
      const el = $("msg");
      el.className = "msg " + (type==="ok" ? "ok" : "err");
      el.textContent = text;
    }

    function getBaseUrl(){
      const cfg = window.APP_CONFIG;
      return (cfg && cfg.BASE_URL) ? cfg.BASE_URL : null;
    }

    async function apiPost(params){
      const BASE_URL = getBaseUrl();
      if(!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud. Semak config.js");

      const body = new URLSearchParams();
      Object.entries(params).forEach(([k,v])=> body.append(k, v ?? ""));

      const res = await fetch(BASE_URL, { method:"POST", body });
      const text = await res.text();
      try{ return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Invalid JSON from server", raw:text }; }
    }

    $("btnReset").addEventListener("click", async ()=>{
      const email = $("email").value.trim();
      const studentId = $("studentId").value.trim();
      const newPassword = $("newPassword").value;

      if(!email || !studentId || !newPassword){
        showMsg("err","Isi email, no pendaftaran & password baru dulu.");
        return;
      }

      $("btnReset").disabled = true;
      $("btnReset").textContent = "Reset...";

      try{
        const data = await apiPost({
          action: "resetPassword",
          email,
          studentId,
          newPassword
        });

        if(!data || !data.ok){
          showMsg("err", data?.message || "Reset gagal.");
          $("btnReset").disabled = false;
          $("btnReset").textContent = "Reset Password";
          return;
        }

        showMsg("ok","Reset berjaya. Redirect ke login...");
        setTimeout(()=> window.location.href = "./login.html", 650);

      }catch(err){
        console.error(err);
        showMsg("err","Fetch gagal. Check Console (URL / CORS).");
        $("btnReset").disabled = false;
        $("btnReset").textContent = "Reset Password";
      }
    });
  </script>
</body>
</html>
