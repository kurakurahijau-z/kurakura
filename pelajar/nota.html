<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nota • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .page{ min-height:100vh; padding: 18px 16px 40px; }
    .top{
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.50);
    }
    .top-inner{
      max-width: 1100px; margin: 0 auto; padding: 14px 8px;
      display:flex; align-items:center; justify-content:space-between; gap: 12px;
    }
    .brand{ display:flex; flex-direction:column; gap: 4px; }
    .brand h1{ margin:0; font-size: 20px; letter-spacing: -0.02em; line-height: 1.1; }
    .brand .sub{ margin:0; color:#334155; font-weight:800; font-size: 13px; opacity: .9; }

    .btn{
      border: 0; cursor: pointer;
      padding: 10px 14px; border-radius: 14px;
      font-weight: 900; background: #059669; color: #fff;
      box-shadow: 0 8px 18px rgba(5,150,105,.18);
      text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }
    .btn:hover{ background:#047857; }
    .btn.ghost{
      background: rgba(255,255,255,.75);
      color:#0f172a;
      border: 1px solid rgba(15,23,42,.10);
      box-shadow: 0 10px 30px rgba(2,6,23,.06);
    }
    .btn.ghost:hover{ background: rgba(255,255,255,.90); }

    .container{ max-width: 1100px; margin: 16px auto 0; display:grid; gap: 14px; }
    .card{
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, .10);
      padding: 18px;
    }
    .msg{
      display:none;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 900;
    }
    .msg.err{
      display:block;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.28);
      color: #991b1b;
    }
    .msg.ok{
      display:block;
      background: rgba(34,197,94,.10);
      border: 1px solid rgba(34,197,94,.28);
      color: #065f46;
    }
    .frame{
      width:100%;
      height: 72vh;
      border: 1px solid rgba(15,23,42,.10);
      border-radius: 16px;
      background: rgba(255,255,255,.60);
    }
  </style>
</head>

<body class="stage">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1 id="title">Nota</h1>
        <p class="sub" id="who">Loading...</p>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <a class="btn ghost" id="btnBack" href="./dashboard.html">← Kembali</a>
        <button class="btn" id="btnLogout" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div id="msg" class="msg"></div>

      <section class="card">
        <iframe id="frame" class="frame" title="Nota"></iframe>
      </section>
    </div>
  </main>

  <script>
    const BASE_URL = window.APP_CONFIG && window.APP_CONFIG.BASE_URL ? window.APP_CONFIG.BASE_URL : "";
    const msgEl = document.getElementById("msg");
    const whoEl = document.getElementById("who");
    const titleEl = document.getElementById("title");
    const frameEl = document.getElementById("frame");

    function showMsg(type, text){
      msgEl.className = "msg " + (type === "ok" ? "ok" : "err");
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }

    function readUser(){
      try{
        const raw = localStorage.getItem("kk_user");
        return raw ? JSON.parse(raw) : null;
      }catch(e){ return null; }
    }

    function qs(name){
      return new URLSearchParams(location.search).get(name) || "";
    }

    async function apiPost(params){
      if(!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud");
      const body = new URLSearchParams();
      Object.entries(params).forEach(([k,v]) => body.append(k, v ?? ""));
      const res = await fetch(BASE_URL, { method:"POST", body });
      const text = await res.text();
      try{ return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Response bukan JSON", raw:text }; }
    }

    async function load(){
      const token = localStorage.getItem("kk_token") || "";
      const user = readUser();
      if(!token && !user){
        location.href = "./login.html";
        return;
      }

      whoEl.textContent = `Hi, ${(user?.name || user?.email || "Pelajar")}`;

      const noteId = qs("noteId");
      const classId = qs("classId");

      // back to kelas if possible
      const back = document.getElementById("btnBack");
      if(classId) back.href = `./kelas.html?classId=${encodeURIComponent(classId)}`;

      if(!noteId){
        showMsg("err","noteId tak ada.");
        return;
      }

      const out = await apiPost({ action:"getNote", token, noteId, classId });
      if(!out || !out.ok){
        console.error(out);
        showMsg("err", out?.message || "Tak dapat load nota.");
        return;
      }

      titleEl.textContent = out.note?.title || "Nota";
      const link = out.note?.contentLink || "";
      if(!link){
        showMsg("err","contentLink kosong.");
        return;
      }

      frameEl.src = link;
      showMsg("ok","Nota dimuatkan.");
    }

    document.getElementById("btnLogout").addEventListener("click", () => {
      localStorage.removeItem("kk_token");
      localStorage.removeItem("kk_user");
      location.href = "./login.html";
    });

    load();
  </script>
</body>
</html>
