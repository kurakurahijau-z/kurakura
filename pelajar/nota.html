<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nota • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .page{ min-height:100vh; padding: 18px 16px 40px; }
    .top{ position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.50); }
    .top-inner{ max-width: 1100px; margin: 0 auto; padding: 14px 8px; display:flex; align-items:center; justify-content:space-between; gap: 12px; }
    .brand{ display:flex; flex-direction:column; gap: 4px; }
    .brand h1{ margin:0; font-size: 20px; letter-spacing: -0.02em; line-height: 1.1; font-weight: 950; }
    .brand .sub{ margin:0; color:#334155; font-weight:800; font-size: 13px; opacity:.9; }

    .btn{ border: 0; cursor: pointer; padding: 10px 14px; border-radius: 14px; font-weight: 900; background: #059669; color: #fff; box-shadow: 0 8px 18px rgba(5,150,105,.18); }
    .btn:hover{ background:#047857; }
    .btn.ghost{ background: rgba(255,255,255,.75); color:#0f172a; border: 1px solid rgba(15,23,42,.10); box-shadow: 0 10px 30px rgba(2,6,23,.06); }
    .btn.ghost:hover{ background: rgba(255,255,255,.90); }

    .container{ max-width: 1100px; margin: 16px auto 0; display:grid; gap: 14px; }
    .card{ background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.55); border-radius: 18px; box-shadow: 0 10px 30px rgba(2, 6, 23, .10); padding: 18px; }

    .msg{ display:none; padding: 10px 12px; border-radius: 14px; font-weight: 900; }
    .msg.err{ display:block; background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.28); color: #991b1b; }
    .msg.ok{ display:block; background: rgba(34,197,94,.10); border: 1px solid rgba(34,197,94,.28); color: #065f46; }

    .frameWrap{
      border-radius: 18px;
      overflow:hidden;
      border: 1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.65);
      box-shadow: 0 14px 34px rgba(2,6,23,.08);
      min-height: 520px;
    }
    iframe{
      width:100%;
      height: 70vh;
      min-height: 520px;
      border:0;
      background:#fff;
    }
    .meta{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      font-weight:800; color:#334155; opacity:.95;
      margin: 8px 0 0;
      font-size: 12px;
    }
    .pill{
      display:inline-flex; align-items:center; gap: 8px;
      padding: 6px 10px; border-radius: 999px;
      border: 1px solid rgba(5,150,105,.20);
      background: rgba(5,150,105,.08);
      color:#065f46;
      font-weight: 950;
      font-size: 12px;
    }
    .code{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; }
  </style>
</head>

<body class="stage">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1 id="title">Nota</h1>
        <p class="sub" id="sub">Loading...</p>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn ghost" id="btnBack" type="button">← Kembali</button>
        <button class="btn" id="btnLogout" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div id="msg" class="msg"></div>

      <section class="card">
        <div class="meta">
          <span class="pill">noteId: <span class="code" id="noteIdPill">-</span></span>
          <span class="pill">classId: <span class="code" id="classIdPill">-</span></span>
          <span class="pill">subjectId: <span class="code" id="subjectIdPill">-</span></span>
          <span class="pill">releasedAt: <span class="code" id="releasedAtPill">-</span></span>
          <button class="btn ghost" id="btnOpenLink" type="button">Buka link</button>
        </div>
      </section>

      <section class="card frameWrap">
        <iframe id="frame" src="about:blank" referrerpolicy="no-referrer"></iframe>
      </section>
    </div>
  </main>

  <script>
    const $ = (id)=>document.getElementById(id);

    function showMsg(type, text){
      const el = $("msg");
      el.className = "msg " + (type === "ok" ? "ok" : "err");
      el.textContent = text;
      el.style.display = "block";
    }
    function clearMsg(){
      const el = $("msg");
      el.style.display = "none";
      el.textContent = "";
      el.className = "msg";
    }

    function getBaseUrl(){
      const cfg = window.APP_CONFIG;
      return (cfg && cfg.BASE_URL) ? cfg.BASE_URL : null;
    }

    async function apiPost(params){
      const BASE_URL = getBaseUrl();
      if(!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud. Semak config.js");

      const body = new URLSearchParams();
      Object.entries(params).forEach(([k,v]) => body.append(k, v ?? ""));

      const res = await fetch(BASE_URL, { method:"POST", body });
      const text = await res.text();
      try{ return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Invalid JSON from server", raw:text }; }
    }

    function q(name){
      return new URLSearchParams(location.search).get(name) || "";
    }

    let contentLink = "";
    let classId = "";

    async function boot(){
      clearMsg();

      const token = localStorage.getItem("kk_token") || "";
      if(!token){
        location.href = "./login.html";
        return;
      }

      const noteId = q("noteId").trim();
      classId = q("classId").trim(); // optional (for back button)
      if(!noteId){
        showMsg("err", "noteId tak wujud dalam URL.");
        return;
      }

      $("noteIdPill").textContent = noteId;
      $("classIdPill").textContent = classId || "-";

      // me
      const me = await apiPost({ action:"me", token });
      if(!me || !me.ok){
        showMsg("err", me?.message || "Token invalid. Sila login semula.");
        localStorage.removeItem("kk_token");
        localStorage.removeItem("kk_user");
        setTimeout(()=> location.href="./login.html", 600);
        return;
      }
      const displayName = me.user?.name || me.user?.email || "Pelajar";
      $("sub").textContent = `Hi, ${displayName}`;

      // getNote
      const out = await apiPost({ action:"getNote", token, noteId });
      if(!out || !out.ok){
        showMsg("err", out?.message || "Tak dapat load nota.");
        return;
      }

      const n = out.note || {};
      $("title").textContent = n.title || "Nota";
      $("subjectIdPill").textContent = n.subjectId || "-";
      $("releasedAtPill").textContent = n.releasedAt || "-";

      // if classId not passed, use from backend
      if(!classId && n.classId) {
        classId = n.classId;
        $("classIdPill").textContent = classId;
      }

      contentLink = (n.contentLink || "").trim();
      if(!contentLink){
        showMsg("err", "contentLink kosong dalam sheet Notes.");
        return;
      }

      // embed
      $("frame").src = contentLink;

      showMsg("ok", "Nota dimuatkan.");
    }

    $("btnOpenLink").addEventListener("click", ()=>{
      if(!contentLink){
        alert("contentLink kosong.");
        return;
      }
      window.open(contentLink, "_blank", "noopener");
    });

    $("btnBack").addEventListener("click", ()=>{
      if(classId){
        location.href = `./kelas.html?classId=${encodeURIComponent(classId)}`;
      }else{
        location.href = "./dashboard.html";
      }
    });

    $("btnLogout").addEventListener("click", ()=>{
      localStorage.removeItem("kk_token");
      localStorage.removeItem("kk_user");
      location.href = "./login.html";
    });

    boot();
  </script>
</body>
</html>
