<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard Pelajar</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
  <script src="../app.js"></script>
</head>
<body class="stage">
  <header class="topbar">
    <div class="inner">
      <div>
        <h1>Dashboard Pelajar</h1>
        <p id="who" class="muted">Loading...</p>
      </div>
      <div class="actions">
        <button class="btn danger" onclick="logout()">Keluar</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div id="msg" class="notice"></div>

      <div class="row">
        <div class="col">
          <h2 style="margin:0; font-weight:950;">Kelas saya</h2>
          <p class="muted">Join kelas guna class code yang pensyarah bagi.</p>
        </div>
      </div>

      <div class="grid2" style="margin-top:10px;">
        <div class="card" style="padding:14px;">
          <label>Class Code</label>
          <input id="classCode" placeholder="Contoh: PMS-7917" />
          <button class="btn" id="btnJoin" style="margin-top:12px;">Join Kelas</button>
          <p class="muted small" style="margin-top:10px;">
            Lepas join, kelas akan muncul bawah.
          </p>
        </div>

        <div class="card" style="padding:14px;">
          <h3 style="margin:0 0 10px; font-weight:950;">Senarai kelas</h3>
          <div id="classes" class="list"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const who = document.getElementById("who");
    const msg = document.getElementById("msg");
    const classesRoot = document.getElementById("classes");

    function showMsg(text, ok){
      msg.style.display="block";
      msg.textContent=text;
      msg.style.background = ok ? "rgba(34,197,94,.10)" : "rgba(239,68,68,.10)";
      msg.style.border = ok ? "1px solid rgba(34,197,94,.28)" : "1px solid rgba(239,68,68,.28)";
      msg.style.color = ok ? "#065f46" : "#991b1b";
    }
    function clearMsg(){ msg.style.display="none"; msg.textContent=""; }

    async function loadMe(){
      const r = await apiPost({ action:"me", token:getToken() });
      if(!r.ok){ logout(); return null; }
      if(String(r.user?.role||"").toLowerCase()==="admin"){
        location.href = "../admin/dashboard.html";
        return null;
      }
      who.textContent = `Hi, ${r.user?.name || r.user?.email || "Pelajar"}`;
      return r.user;
    }

    async function loadMyClasses(){
      classesRoot.innerHTML = "";
      const r = await apiPost({ action:"studentListMyClasses", token:getToken() });
      if(!r.ok){
        classesRoot.innerHTML = `<div class="muted">Gagal load kelas.</div>`;
        return;
      }
      const list = r.classes || [];
      if(!list.length){
        classesRoot.innerHTML = `<div class="muted">Belum join mana-mana kelas.</div>`;
        return;
      }
      list.forEach(c=>{
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="item-main">
            <div class="item-title">${escapeHtml(c.className)}</div>
            <div class="muted small">classCode: ${escapeHtml(c.classCode)} • classId: ${escapeHtml(c.classId)}</div>
          </div>
          <div class="item-actions">
            <button class="btn" onclick="location.href='./kelas.html?classId=${encodeURIComponent(c.classId)}'">Buka</button>
          </div>
        `;
        classesRoot.appendChild(div);
      });
    }

    document.getElementById("btnJoin").onclick = async ()=>{
      clearMsg();
      const classCode = document.getElementById("classCode").value.trim();
      if(!classCode) return showMsg("Class code wajib.", false);

      const r = await apiPost({ action:"studentJoinClass", token:getToken(), classCode });
      if(!r.ok) return showMsg(r.message || "Join gagal.", false);

      showMsg("Berjaya join kelas.", true);
      document.getElementById("classCode").value="";
      await loadMyClasses();
    };

    (async ()=>{
      requireAuthOrRedirect();
      const u = await loadMe();
      if(!u) return;
      await loadMyClasses();
    })();
  </script>
</body>
</html>
