<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Pelajar • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .page{ min-height:100vh; padding: 18px 16px 40px; }
    .top{
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.50);
    }
    .top-inner{
      max-width: 1100px; margin: 0 auto; padding: 14px 8px;
      display:flex; align-items:center; justify-content:space-between; gap: 12px;
    }
    .brand{ display:flex; flex-direction:column; gap: 4px; }
    .brand h1{ margin:0; font-size: 22px; letter-spacing: -0.02em; line-height: 1.1; }
    .brand .sub{ margin:0; color:#334155; font-weight:700; font-size: 13px; opacity: .9; }

    .btn{
      border: 0; cursor: pointer;
      padding: 10px 14px; border-radius: 14px; font-weight: 900;
      background: #059669; color: #fff;
      box-shadow: 0 8px 18px rgba(5,150,105,.18);
    }
    .btn:hover{ background:#047857; }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .btn.ghost{
      background: rgba(255,255,255,.75);
      color:#0f172a;
      border: 1px solid rgba(15,23,42,.10);
      box-shadow: 0 10px 30px rgba(2,6,23,.06);
    }
    .btn.ghost:hover{ background: rgba(255,255,255,.90); }

    .container{
      max-width: 1100px;
      margin: 16px auto 0;
      display:grid;
      gap: 14px;
    }

    .card{
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, .10);
      padding: 18px;
    }

    .msg{
      display:none;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 900;
    }
    .msg.err{
      display:block;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.28);
      color: #991b1b;
    }
    .msg.ok{
      display:block;
      background: rgba(34,197,94,.10);
      border: 1px solid rgba(34,197,94,.28);
      color: #065f46;
    }

    .grid{
      display:grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }
    @media(min-width: 900px){
      .grid{ grid-template-columns: 1.1fr .9fr; }
    }

    .section-title{
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 950;
      letter-spacing: -.01em;
    }

    .class-list{
      display:grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }
    @media(min-width: 900px){
      .class-list{ grid-template-columns: 1fr 1fr; }
    }

    .class-card{
      border-radius: 18px;
      padding: 14px;
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(15,23,42,.08);
      box-shadow: 0 14px 34px rgba(2,6,23,.08);
      display:flex;
      flex-direction:column;
      gap: 8px;
    }
    .class-card .title{
      font-weight: 950;
      font-size: 16px;
      margin:0;
      color:#0f172a;
    }
    .class-card .meta{
      margin:0;
      color:#334155;
      font-weight: 800;
      font-size: 13px;
      opacity: .9;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(5,150,105,.20);
      background: rgba(5,150,105,.08);
      color:#065f46;
      font-weight: 950;
      font-size: 12px;
      width: fit-content;
    }

    .placeholder{
      color:#334155;
      font-weight: 800;
      opacity: .9;
      line-height: 1.5;
    }

    .join{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom: 12px;
    }
    .input{
      flex: 1;
      min-width: 220px;
      box-sizing:border-box;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.16);
      background: rgba(255,255,255,.70);
      outline: none;
      font-size: 14px;
      font-weight: 800;
    }
    .input:focus{
      border-color: rgba(5,150,105,.55);
      box-shadow: 0 0 0 4px rgba(5,150,105,.14);
    }

    code{
      background: rgba(2,6,23,.06);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 900;
    }
  </style>
</head>

<body class="stage">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>Dashboard Pelajar</h1>
        <p class="sub" id="who">Loading...</p>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn ghost" id="btnRefresh" type="button">Refresh</button>
        <button class="btn" id="btnLogout" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div id="msg" class="msg"></div>

      <div class="grid">
        <!-- LEFT: Classes -->
        <section class="card">
          <h2 class="section-title">Kelas saya</h2>

          <!-- JOIN CLASS -->
          <div class="join">
            <input id="classCode" class="input" placeholder="Masukkan kod kelas (contoh: PMS-7917)" />
            <button id="btnJoin" class="btn" type="button">Join</button>
          </div>

          <div id="classes" class="class-list"></div>

          <p class="placeholder" id="classesHint" style="margin:10px 0 0;">
            Kalau kosong, maksudnya student belum enroll apa-apa kelas (atau API belum bagi data).
          </p>
        </section>

        <!-- RIGHT: Notes/Quiz placeholder -->
        <section class="card">
          <h2 class="section-title">Nota & Kuiz</h2>
          <p class="placeholder" style="margin:0;">
            Bahagian ni kita hidupkan lepas kelas dah confirm jalan.
            <br><br>
            Debug cepat (Mac): <code>⌥⌘J</code> → tengok Console.
            <br>
            Token: <code>localStorage.getItem("kk_token")</code>
          </p>
        </section>
      </div>
    </div>
  </main>

  <script>
    const BASE_URL = window.APP_CONFIG && window.APP_CONFIG.BASE_URL ? window.APP_CONFIG.BASE_URL : "";
    const msgEl = document.getElementById("msg");
    const whoEl = document.getElementById("who");
    const classesEl = document.getElementById("classes");
    const classesHint = document.getElementById("classesHint");

    function showMsg(type, text){
      msgEl.className = "msg " + (type === "ok" ? "ok" : "err");
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }
    function clearMsg(){
      msgEl.style.display = "none";
      msgEl.textContent = "";
      msgEl.className = "msg";
    }

    function readUser(){
      try{
        const raw = localStorage.getItem("kk_user");
        return raw ? JSON.parse(raw) : null;
      }catch(e){
        return null;
      }
    }

    async function postForm(action, data){
      const url = `${BASE_URL}?action=${encodeURIComponent(action)}`;
      const body = new URLSearchParams(data);
      const res = await fetch(url, { method:"POST", body });
      const text = await res.text();
      try{ return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Response bukan JSON", raw:text }; }
    }

    function renderClasses(list){
      classesEl.innerHTML = "";
      if(!Array.isArray(list) || list.length === 0){
        classesHint.style.display = "block";
        return;
      }
      classesHint.style.display = "none";

      list.forEach(c => {
        const title = c.title || c.name || "Kelas";
        const desc  = c.desc || c.description || "";
        const classId = c.classId || c.id || "";

        const card = document.createElement("div");
        card.className = "class-card";

        card.innerHTML = `
          <p class="title">${escapeHtml(title)}</p>
          <p class="meta">${escapeHtml(desc)}</p>
          <span class="pill">classId: ${escapeHtml(classId)}</span>
        `;

        classesEl.appendChild(card);
      });
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    async function loadDashboard(){
      clearMsg();

      if(!BASE_URL){
        showMsg("err", "APP_CONFIG.BASE_URL tak wujud. Semak config.js");
        return;
      }

      const token = localStorage.getItem("kk_token") || "";
      const user = readUser();

      if(!token && !user){
        window.location.href = "./login.html";
        return;
      }

      const displayName = user?.name || user?.email || "Pelajar";
      whoEl.textContent = `Hi, ${displayName}`;

      let out = null;

      if(token){
        out = await postForm("listMyClasses", { token });
      }

      if(!out || !out.ok){
        const userId = user?.userId || user?.id || "";
        if(userId){
          out = await postForm("listMyClasses", { userId });
        }
      }

      if(!out || !out.ok){
        console.error("listMyClasses failed:", out);
        showMsg("err", out?.message || "Tak dapat load kelas. Check Console.");
        renderClasses([]);
        return;
      }

      renderClasses(out.classes || []);
      showMsg("ok", "Kelas berjaya dimuatkan.");
    }

    // JOIN CLASS
    document.getElementById("btnJoin").addEventListener("click", async () => {
      clearMsg();

      const token = localStorage.getItem("kk_token") || "";
      if(!token){
        showMsg("err","Token tak wujud. Sila login semula.");
        window.location.href = "./login.html";
        return;
      }

      const classCode = (document.getElementById("classCode").value || "").trim();
      if(!classCode){
        showMsg("err","Masukkan kod kelas dulu.");
        return;
      }

      const btn = document.getElementById("btnJoin");
      btn.disabled = true;
      btn.textContent = "Joining...";

      try{
        const out = await postForm("joinClass", { token, classCode });

        if(!out || !out.ok){
          showMsg("err", out?.message || "Join gagal.");
          console.error("joinClass failed:", out);
          btn.disabled = false;
          btn.textContent = "Join";
          return;
        }

        showMsg("ok", out.message || "Berjaya join kelas.");
        document.getElementById("classCode").value = "";

        await loadDashboard();
      }catch(e){
        console.error(e);
        showMsg("err","Fetch gagal. Check Console.");
      }finally{
        btn.disabled = false;
        btn.textContent = "Join";
      }
    });

    document.getElementById("btnLogout").addEventListener("click", () => {
      localStorage.removeItem("kk_token");
      localStorage.removeItem("kk_user");
      window.location.href = "./login.html";
    });

    document.getElementById("btnRefresh").addEventListener("click", loadDashboard);

    loadDashboard();
  </script>
</body>
</html>
