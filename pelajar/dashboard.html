<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Pelajar • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .page{ min-height:100vh; padding: 18px 16px 40px; }
    .top{ position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.75); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.50); }
    .top-inner{ max-width: 1100px; margin: 0 auto; padding: 14px 8px; display:flex; align-items:center; justify-content:space-between; gap: 12px; }

    .brand{ display:flex; flex-direction:column; gap: 4px; }
    .brand h1{ margin:0; font-size: 22px; letter-spacing: -0.02em; }
    .brand .sub{ margin:0; color:#334155; font-weight:800; font-size: 13px; opacity: .9; }

    .btn{ border: 0; cursor: pointer; padding: 10px 14px; border-radius: 14px; font-weight: 900; background: #059669; color: #fff; }
    .btn:hover{ background:#047857; }
    .btn.ghost{ background: rgba(255,255,255,.75); color:#0f172a; border: 1px solid rgba(15,23,42,.10); }

    .container{ max-width: 1100px; margin: 16px auto 0; display:grid; gap: 14px; }
    .card{ background: rgba(255,255,255,.85); border-radius: 18px; padding: 18px; }

    .msg{ display:none; padding: 10px 12px; border-radius: 14px; font-weight: 900; }
    .msg.ok{ display:block; background: rgba(34,197,94,.12); color: #065f46; }
    .msg.err{ display:block; background: rgba(239,68,68,.12); color: #991b1b; }

    .grid{ display:grid; gap: 14px; grid-template-columns: 1fr; }
    @media(min-width: 900px){ .grid{ grid-template-columns: 1.2fr .8fr; } }

    .section-title{ margin: 0 0 10px; font-size: 16px; font-weight: 950; }

    .class-list{ display:grid; gap: 12px; }
    @media(min-width: 900px){ .class-list{ grid-template-columns: 1fr 1fr; } }

    .class-card{
      border-radius: 18px;
      padding: 14px;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(15,23,42,.08);
      cursor: pointer;
      transition: .15s ease;
    }
    .class-card:hover{
      transform: translateY(-2px);
      border-color: rgba(5,150,105,.25);
    }

    .class-card .title{ font-weight: 950; margin:0; }
    .class-card .meta{ margin:0; color:#334155; font-weight:800; font-size:13px; }

    .pill{
      display:inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(5,150,105,.08);
      font-weight: 900;
      font-size: 12px;
    }

    .muted{ color:#475569; font-weight:800; font-size:14px; }
  </style>
</head>

<body class="stage">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>Dashboard Pelajar</h1>
        <p class="sub" id="who">Memuatkan maklumat...</p>
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn ghost" id="btnRefresh">Segar Semula</button>
        <button class="btn" id="btnLogout">Log Keluar</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <div id="msg" class="msg"></div>

      <div class="grid">

        <section class="card">
          <h2 class="section-title">Kelas Berdaftar</h2>
          <div id="classes" class="class-list"></div>

          <p class="muted" id="classesHint" style="margin-top:12px;">
            Anda belum berdaftar dalam mana-mana kelas.
          </p>
        </section>

        <section class="card">
          <h2 class="section-title">Panduan Penggunaan</h2>
          <p class="muted">
            • Klik kelas untuk mengakses nota dan kuiz.<br>
            • Nota dipaparkan mengikut status "Released".<br>
            • Kuiz akan dibuka di tab baharu (Google Form).
          </p>

          <div style="margin-top:14px;">
            <span class="pill" id="pillCount">Jumlah Kelas: -</span>
          </div>
        </section>

      </div>
    </div>
  </main>

  <script>
    const BASE_URL = window.APP_CONFIG?.BASE_URL || "";
    const msgEl = document.getElementById("msg");
    const classesEl = document.getElementById("classes");
    const classesHint = document.getElementById("classesHint");
    const pillCount = document.getElementById("pillCount");
    const whoEl = document.getElementById("who");

    function showMsg(type,text){
      msgEl.className = "msg " + type;
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }

    function renderClasses(list){
      classesEl.innerHTML = "";

      if(!list || list.length === 0){
        classesHint.style.display = "block";
        pillCount.textContent = "Jumlah Kelas: 0";
        return;
      }

      classesHint.style.display = "none";
      pillCount.textContent = "Jumlah Kelas: " + list.length;

      list.forEach(c=>{
        const card = document.createElement("div");
        card.className="class-card";
        card.innerHTML = `
          <p class="title">${c.title}</p>
          <p class="meta">${c.desc || ""}</p>
          <span class="pill">Klik untuk akses</span>
        `;
        card.onclick=()=>location.href=`./kelas.html?classId=${c.classId}`;
        classesEl.appendChild(card);
      });
    }

    async function load(){
      const token = localStorage.getItem("kk_token");
      if(!token){ location.href="./login.html"; return; }

      const res = await fetch(`${BASE_URL}?action=listMyClasses`,{
        method:"POST",
        body:new URLSearchParams({token})
      });

      const out = await res.json();
      if(!out.ok){
        showMsg("err", out.message);
        return;
      }

      renderClasses(out.classes);
      showMsg("ok","Data kelas berjaya dimuatkan.");
    }

    load();
  </script>
</body>
</html>
