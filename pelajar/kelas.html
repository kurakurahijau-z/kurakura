<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelas • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .page{ min-height:100vh; padding: 18px 16px 44px; }
    .top{ position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.50); }
    .top-inner{ max-width: 1120px; margin: 0 auto; padding: 14px 8px; display:flex; align-items:center; justify-content:space-between; gap: 12px; }

    .brand{ display:flex; flex-direction:column; gap: 4px; }
    .brand h1{ margin:0; font-size: 20px; letter-spacing: -0.02em; line-height: 1.1; }
    .brand .sub{ margin:0; color:#334155; font-weight:800; font-size: 13px; opacity: .9; }

    .btn{ border: 0; cursor: pointer; padding: 10px 14px; border-radius: 14px; font-weight: 900; background: #059669; color: #fff; box-shadow: 0 8px 18px rgba(5,150,105,.18); }
    .btn:hover{ background:#047857; }
    .btn.ghost{ background: rgba(255,255,255,.75); color:#0f172a; border: 1px solid rgba(15,23,42,.10); box-shadow: 0 10px 30px rgba(2,6,23,.06); }
    .btn.ghost:hover{ background: rgba(255,255,255,.90); }

    .container{ max-width: 1120px; margin: 16px auto 0; display:grid; gap: 14px; }

    .card{ background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.55); border-radius: 18px; box-shadow: 0 10px 30px rgba(2, 6, 23, .10); padding: 18px; }

    .msg{ display:none; padding: 10px 12px; border-radius: 14px; font-weight: 900; }
    .msg.err{ display:block; background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.28); color: #991b1b; }
    .msg.ok{ display:block; background: rgba(34,197,94,.10); border: 1px solid rgba(34,197,94,.28); color: #065f46; }

    .grid{ display:grid; gap: 14px; grid-template-columns: 1fr; }
    @media(min-width: 980px){ .grid{ grid-template-columns: 1fr 1fr; } }

    .section-title{ margin: 0 0 10px; font-size: 16px; font-weight: 950; letter-spacing: -.01em; }
    .muted{ margin:0; color:#334155; font-weight: 800; opacity: .92; line-height: 1.55; }

    .list{ display:grid; gap: 10px; }
    .item{
      border-radius: 18px; padding: 14px;
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(15,23,42,.08);
      box-shadow: 0 14px 34px rgba(2,6,23,.08);
      display:flex; flex-direction:column; gap: 6px;
    }
    .item .title{ font-weight: 950; font-size: 15px; margin:0; color:#0f172a; }
    .item .meta{ margin:0; color:#334155; font-weight: 800; font-size: 12.5px; opacity: .9; }
    .item .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 6px; }

    .pill{
      display:inline-flex; align-items:center; gap: 8px;
      padding: 8px 10px; border-radius: 999px;
      border: 1px solid rgba(5,150,105,.20);
      background: rgba(5,150,105,.08);
      color:#065f46; font-weight: 950; font-size: 12px;
      width: fit-content;
    }
    a.linkbtn{
      display:inline-flex; align-items:center; justify-content:center;
      text-decoration:none;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 950;
      background: rgba(255,255,255,.75);
      color:#0f172a;
      border: 1px solid rgba(15,23,42,.10);
      box-shadow: 0 10px 30px rgba(2,6,23,.06);
    }
    a.linkbtn:hover{ background: rgba(255,255,255,.90); }
  </style>
</head>

<body class="stage">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1 id="title">Kelas</h1>
        <p class="sub" id="subtitle">Memuatkan...</p>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn ghost" id="btnBack" type="button">← Dashboard</button>
        <button class="btn ghost" id="btnRefresh" type="button">Muat semula</button>
        <button class="btn" id="btnLogout" type="button">Keluar</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div id="msg" class="msg"></div>

      <div class="grid">
        <section class="card">
          <h2 class="section-title">Nota (released)</h2>
          <div id="notes" class="list"></div>
          <p id="notesHint" class="muted" style="margin-top:10px; display:none;">Tiada nota untuk kelas ini.</p>
        </section>

        <section class="card">
          <h2 class="section-title">Kuiz (active)</h2>
          <div id="quizzes" class="list"></div>
          <p id="quizHint" class="muted" style="margin-top:10px; display:none;">Tiada kuiz untuk kelas ini.</p>
        </section>
      </div>
    </div>
  </main>

  <script>
    const BASE_URL = window.APP_CONFIG && window.APP_CONFIG.BASE_URL ? window.APP_CONFIG.BASE_URL : "";
    const msgEl = document.getElementById("msg");

    function showMsg(type, text){
      msgEl.className = "msg " + (type === "ok" ? "ok" : "err");
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }
    function clearMsg(){
      msgEl.style.display = "none";
      msgEl.textContent = "";
      msgEl.className = "msg";
    }

    function getParam(name){
      const u = new URL(window.location.href);
      return u.searchParams.get(name) || "";
    }

    async function apiPost(params){
      if(!BASE_URL) return { ok:false, message:"APP_CONFIG.BASE_URL tak wujud. Semak config.js" };

      const body = new URLSearchParams();
      Object.entries(params || {}).forEach(([k,v]) => body.append(k, v ?? ""));

      const res = await fetch(BASE_URL, { method: "POST", body });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Response bukan JSON", raw:text }; }
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function renderNotes(list){
      const el = document.getElementById("notes");
      const hint = document.getElementById("notesHint");
      el.innerHTML = "";

      if(!Array.isArray(list) || list.length === 0){
        hint.style.display = "block";
        return;
      }
      hint.style.display = "none";

      list.forEach(n => {
        const title = n.title || "Nota";
        const subject = n.subjectName ? `Subject: ${n.subjectName}` : "";
        const link = n.contentLink || "";

        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `
          <p class="title">${escapeHtml(title)}</p>
          <p class="meta">${escapeHtml(subject)}</p>
          <div class="actions">
            ${link ? `<a class="linkbtn" href="${escapeHtml(link)}" target="_blank" rel="noopener">Buka nota</a>` : `<span class="pill">Tiada link</span>`}
            <span class="pill">released</span>
          </div>
        `;
        el.appendChild(item);
      });
    }

    function renderQuizzes(list){
      const el = document.getElementById("quizzes");
      const hint = document.getElementById("quizHint");
      el.innerHTML = "";

      if(!Array.isArray(list) || list.length === 0){
        hint.style.display = "block";
        return;
      }
      hint.style.display = "none";

      list.forEach(q => {
        const title = q.title || "Kuiz";
        const subject = q.subjectName ? `Subject: ${q.subjectName}` : "";
        const link = q.quizLink || "";

        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `
          <p class="title">${escapeHtml(title)}</p>
          <p class="meta">${escapeHtml(subject)}</p>
          <div class="actions">
            ${link ? `<a class="linkbtn" href="${escapeHtml(link)}" target="_blank" rel="noopener">Buka kuiz</a>` : `<span class="pill">Tiada link</span>`}
            <span class="pill">active</span>
          </div>
        `;
        el.appendChild(item);
      });
    }

    async function loadPage(){
      clearMsg();

      const token = localStorage.getItem("kk_token") || "";
      const userRaw = localStorage.getItem("kk_user") || "";
      if(!token || !userRaw){
        window.location.href = "./login.html";
        return;
      }

      const classId = getParam("classId");
      if(!classId){
        showMsg("err","classId tiada dalam URL.");
        return;
      }

      // 1) get class
      const c = await apiPost({ action:"getClass", token, classId });
      if(!c || !c.ok){
        showMsg("err", c?.message || "Tak dapat load kelas.");
        return;
      }

      const className = c.class?.className || "Kelas";
      const classCode = c.class?.classCode || "";
      document.getElementById("title").textContent = className;
      document.getElementById("subtitle").textContent = classCode ? `Kod kelas: ${classCode}` : "—";

      // 2) notes
      const n = await apiPost({ action:"listNotesForClass", token, classId });
      if(!n || !n.ok){
        console.warn("notes failed:", n);
        renderNotes([]);
      }else{
        renderNotes(n.notes || []);
      }

      // 3) quizzes
      const q = await apiPost({ action:"listQuizzesForClass", token, classId });
      if(!q || !q.ok){
        console.warn("quizzes failed:", q);
        renderQuizzes([]);
      }else{
        renderQuizzes(q.quizzes || []);
      }
    }

    document.getElementById("btnBack").addEventListener("click", ()=> {
      window.location.href = "./dashboard.html";
    });

    document.getElementById("btnRefresh").addEventListener("click", loadPage);

    document.getElementById("btnLogout").addEventListener("click", ()=> {
      localStorage.removeItem("kk_token");
      localStorage.removeItem("kk_user");
      window.location.href = "./login.html";
    });

    loadPage();
  </script>
</body>
</html>
