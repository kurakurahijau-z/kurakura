<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kelas</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
  <script src="../app.js"></script>
</head>
<body class="stage">
  <header class="topbar">
    <div class="inner">
      <div>
        <h1 id="title">Kelas</h1>
        <p id="who" class="muted">Loading...</p>
      </div>
      <div class="actions">
        <button class="btn ghost" onclick="location.href='./dashboard.html'">← Dashboard</button>
        <button class="btn danger" onclick="logout()">Keluar</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="msg" class="notice"></div>

    <section class="card">
      <div id="info" class="card" style="padding:14px; margin-bottom:14px;"></div>

      <div class="grid2">
        <div class="card" style="padding:14px;">
          <h2 style="margin:0 0 6px; font-weight:950;">Nota</h2>
          <p class="muted small" style="margin:0 0 10px;">
            Dipaparkan jika <b>releaseStatus=released</b> dan <b>isActive=true</b> (kosong dikira true).
          </p>
          <div id="notes" class="list"></div>
        </div>

        <div class="card" style="padding:14px;">
          <h2 style="margin:0 0 6px; font-weight:950;">Kuiz</h2>
          <p class="muted small" style="margin:0 0 10px;">
            Dipaparkan jika <b>isActive=true</b>.
          </p>
          <div id="quizzes" class="list"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const msg = document.getElementById("msg");
    const title = document.getElementById("title");
    const who = document.getElementById("who");
    const info = document.getElementById("info");
    const notesRoot = document.getElementById("notes");
    const quizzesRoot = document.getElementById("quizzes");

    function showMsg(text){
      msg.style.display="block";
      msg.textContent=text;
    }
    function hideMsg(){ msg.style.display="none"; msg.textContent=""; }

    async function init(){
      requireAuthOrRedirect();

      const meRes = await apiPost({ action:"me", token:getToken() });
      if(!meRes.ok){ logout(); return; }
      if(String(meRes.user?.role||"").toLowerCase()==="admin"){
        location.href = "../admin/dashboard.html"; return;
      }
      who.textContent = `Hi, ${meRes.user?.name || meRes.user?.email || "Pelajar"}`;

      const classId = getParam("classId");
      if(!classId){ showMsg("classId tiada dalam URL."); return; }

      // 1) load class info
      const c = await apiPost({ action:"studentGetClass", token:getToken(), classId });
      if(!c.ok){ showMsg(c.message || "Gagal load kelas."); return; }

      title.textContent = c.class?.className ? `Kelas ${c.class.className}` : "Kelas";
      info.innerHTML = `
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <span class="tab active">classId: ${escapeHtml(c.class?.classId || classId)}</span>
          <span class="tab">classCode: ${escapeHtml(c.class?.classCode || "-")}</span>
        </div>
        <p class="muted" style="margin:10px 0 0;">
          Di bawah ialah senarai Nota (released sahaja) dan Kuiz mengikut kelas ini.
        </p>
      `;

      // 2) notes + quizzes
      const n = await apiPost({ action:"studentListNotes", token:getToken(), classId });
      const q = await apiPost({ action:"studentListQuizzes", token:getToken(), classId });

      renderNotes((n.ok ? (n.notes||[]) : []));
      renderQuizzes((q.ok ? (q.quizzes||[]) : []));

      hideMsg();
    }

    function renderNotes(list){
      notesRoot.innerHTML = "";
      if(!list.length){
        notesRoot.innerHTML = `
          <div class="item">
            <div class="item-main">
              <div class="item-title">Tiada nota</div>
              <div class="muted small">Nota akan muncul lepas pensyarah “release” nota untuk kelas ini.</div>
            </div>
          </div>
        `;
        return;
      }

      list.forEach(n=>{
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="item-main">
            <div class="item-title">${escapeHtml(n.title || "Nota")}</div>
            <div class="muted small">${escapeHtml(n.subjectName || n.subjectId || "")}</div>
          </div>
          <div class="item-actions">
            ${n.contentLink ? `<a class="btn" target="_blank" href="${escapeAttr(n.contentLink)}">Buka</a>` : `<span class="muted small">Tiada link</span>`}
          </div>
        `;
        notesRoot.appendChild(div);
      });
    }

    function renderQuizzes(list){
      quizzesRoot.innerHTML = "";
      if(!list.length){
        quizzesRoot.innerHTML = `
          <div class="item">
            <div class="item-main">
              <div class="item-title">Tiada kuiz</div>
              <div class="muted small">Kuiz akan muncul bila pensyarah aktifkan kuiz.</div>
            </div>
          </div>
        `;
        return;
      }

      list.forEach(q=>{
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="item-main">
            <div class="item-title">${escapeHtml(q.title || "Kuiz")}</div>
            <div class="muted small">${escapeHtml(q.subjectName || q.subjectId || "")}</div>
          </div>
          <div class="item-actions">
            ${q.quizLink ? `<a class="btn" target="_blank" href="${escapeAttr(q.quizLink)}">Buka kuiz</a>` : `<span class="muted small">Tiada link</span>`}
          </div>
        `;
        quizzesRoot.appendChild(div);
      });
    }

    init();
  </script>
</body>
</html>
