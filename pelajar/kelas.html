<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelas • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .page{ min-height:100vh; padding: 18px 16px 40px; }

    .top{
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.50);
    }
    .top-inner{
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap: 4px;
    }
    .brand h1{
      margin:0;
      font-size: 20px;
      letter-spacing: -0.02em;
      line-height: 1.1;
      font-weight: 950;
    }
    .brand .sub{
      margin:0;
      color:#334155;
      font-weight:800;
      font-size: 13px;
      opacity:.9;
    }

    .btn{
      border: 0;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 900;
      background: #059669;
      color: #fff;
      box-shadow: 0 8px 18px rgba(5,150,105,.18);
      transition: transform .08s ease, background .15s ease, box-shadow .15s ease;
    }
    .btn:hover{ background:#047857; }
    .btn:active{ transform: translateY(1px); }
    .btn.ghost{
      background: rgba(255,255,255,.75);
      color:#0f172a;
      border: 1px solid rgba(15,23,42,.10);
      box-shadow: 0 10px 30px rgba(2,6,23,.06);
    }
    .btn.ghost:hover{ background: rgba(255,255,255,.90); }

    .container{
      max-width: 1100px;
      margin: 16px auto 0;
      display:grid;
      gap: 14px;
    }

    .card{
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, .10);
      padding: 18px;
    }

    .msg{
      display:none;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 900;
    }
    .msg.err{
      display:block;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.28);
      color: #991b1b;
    }
    .msg.ok{
      display:block;
      background: rgba(34,197,94,.10);
      border: 1px solid rgba(34,197,94,.28);
      color: #065f46;
    }

    .grid{
      display:grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }
    @media(min-width: 900px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }

    .section-title{
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 950;
      letter-spacing: -.01em;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(5,150,105,.20);
      background: rgba(5,150,105,.08);
      color:#065f46;
      font-weight: 950;
      font-size: 12px;
      width: fit-content;
      white-space: nowrap;
    }

    .pillDanger{
      border-color: rgba(239,68,68,.25);
      background: rgba(239,68,68,.08);
      color:#991b1b;
      opacity:.75;
    }

    .muted{
      margin:0;
      color:#334155;
      font-weight: 800;
      opacity: .92;
      line-height: 1.55;
    }

    .list{
      display:grid;
      gap: 10px;
      margin-top: 10px;
    }
    .item{
      border-radius: 16px;
      padding: 12px;
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(15,23,42,.08);
      box-shadow: 0 14px 34px rgba(2,6,23,.06);
    }
    .item .t{
      margin:0;
      font-weight: 950;
      font-size: 14px;
      color:#0f172a;
    }
    .item .d{
      margin:6px 0 0;
      font-weight: 800;
      font-size: 12px;
      color:#334155;
      opacity:.92;
    }

    .code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,.14);
      background: rgba(255,255,255,.55);
      font-weight: 900;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      margin-top:10px;
    }
    .btnSmall{
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 950;
      border:0;
      cursor:pointer;
    }
    .btnLink{
      background: rgba(255,255,255,.80);
      border: 1px solid rgba(15,23,42,.10);
      color:#0f172a;
    }
    .btnPortal{
      background:#059669;
      color:#fff;
      box-shadow: 0 8px 18px rgba(5,150,105,.18);
    }
    .btnSmall:disabled{
      opacity:.55;
      cursor:not-allowed;
      box-shadow:none;
    }
  </style>
</head>

<body class="stage">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1 id="title">Kelas</h1>
        <p class="sub" id="sub">Loading...</p>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn ghost" id="btnBack" type="button">← Dashboard</button>
        <button class="btn" id="btnLogout" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div id="msg" class="msg"></div>

      <section class="card">
        <h2 class="section-title">Info Kelas</h2>
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
          <span class="pill">classId: <span class="code" id="classIdPill">-</span></span>
          <span class="pill">classCode: <span class="code" id="classCodePill">-</span></span>
        </div>
        <p class="muted" style="margin-top:10px;">
          Kat bawah ni kita paparkan <b>Nota</b> (released sahaja) dan <b>Kuiz</b> ikut subject untuk kelas ni.
        </p>
      </section>

      <div class="grid">
        <section class="card">
          <h2 class="section-title">Nota</h2>
          <p class="muted">Student nampak: <b>releaseStatus = released</b> + <b>isActive = TRUE</b>.</p>
          <div class="list" id="notesList"></div>
        </section>

        <section class="card">
          <h2 class="section-title">Kuiz</h2>
          <p class="muted">Student nampak: <b>isActive = TRUE</b>. Kalau <b>isActiveSoft = closed</b> → lock.</p>
          <div class="list" id="quizList"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    const $ = (id)=>document.getElementById(id);

    function showMsg(type, text){
      const el = $("msg");
      el.className = "msg " + (type === "ok" ? "ok" : "err");
      el.textContent = text;
      el.style.display = "block";
    }
    function clearMsg(){
      const el = $("msg");
      el.style.display = "none";
      el.textContent = "";
      el.className = "msg";
    }

    function getBaseUrl(){
      const cfg = window.APP_CONFIG;
      return (cfg && cfg.BASE_URL) ? cfg.BASE_URL : null;
    }

    async function apiPost(params){
      const BASE_URL = getBaseUrl();
      if(!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud. Semak config.js");

      const body = new URLSearchParams();
      Object.entries(params).forEach(([k,v]) => body.append(k, v ?? ""));

      const res = await fetch(BASE_URL, { method:"POST", body });
      const text = await res.text();
      try{ return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Invalid JSON from server", raw:text }; }
    }

    function q(name){
      return new URLSearchParams(location.search).get(name) || "";
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    // ===================== RENDER: NOTES =====================
    function renderNotes(list, classId){
      const el = $("notesList");
      el.innerHTML = "";

      if(!Array.isArray(list) || list.length === 0){
        el.innerHTML = `
          <div class="item">
            <p class="t">Tiada nota lagi</p>
            <p class="d">Tambah row dalam sheet Notes (released + active) dan pastikan subjectId betul untuk kelas ni.</p>
          </div>
        `;
        return;
      }

      list.forEach(n => {
        const title = escapeHtml(n.title || "Nota");
        const noteId = encodeURIComponent(n.noteId || "");
        const subjectId = escapeHtml(n.subjectId || "-");
        const releasedAt = escapeHtml(n.releasedAt || "-");
        const link = String(n.contentLink || "").trim();

        const card = document.createElement("div");
        card.className = "item";

        card.innerHTML = `
          <p class="t">${title}</p>
          <p class="d"><b>subjectId:</b> <span class="code">${subjectId}</span> • <b>releasedAt:</b> ${releasedAt}</p>
          <div class="actions">
            <button class="btnSmall btnLink" type="button">Buka link</button>
            <button class="btnSmall btnPortal" type="button">Buka dalam portal</button>
          </div>
        `;

        const btnLink = card.querySelector(".btnLink");
        const btnPortal = card.querySelector(".btnPortal");

        btnLink.addEventListener("click", ()=>{
          if(!link){
            alert("contentLink kosong dalam sheet Notes.");
            return;
          }
          window.open(link, "_blank", "noopener");
        });

        btnPortal.addEventListener("click", ()=>{
          if(!noteId){
            alert("noteId kosong dalam data.");
            return;
          }
          location.href = `./nota.html?noteId=${noteId}&classId=${encodeURIComponent(classId)}`;
        });

        el.appendChild(card);
      });
    }

    // ===================== RENDER: QUIZZES =====================
    // ✅ Kuiz tak masuk portal. Terus buka quizLink (Google Forms).
    function renderQuizzes(list){
      const el = $("quizList");
      el.innerHTML = "";

      if(!Array.isArray(list) || list.length === 0){
        el.innerHTML = `
          <div class="item">
            <p class="t">Tiada kuiz lagi</p>
            <p class="d">Tambah row dalam sheet Quizzes dan pastikan subjectId betul.</p>
          </div>
        `;
        return;
      }

      list.forEach(qz => {
        const title = escapeHtml(qz.title || "Kuiz");
        const subjectId = escapeHtml(qz.subjectId || "-");
        const link = String(qz.quizLink || "").trim();

        const soft = String(qz.isActiveSoft || "").trim().toLowerCase();
        const locked = (soft === "closed");

        const card = document.createElement("div");
        card.className = "item";

        card.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <div>
              <p class="t">${title}</p>
              <p class="d"><b>subjectId:</b> <span class="code">${subjectId}</span></p>
            </div>

            <span class="pill ${locked ? "pillDanger" : ""}">
              ${locked ? "closed" : "open"}
            </span>
          </div>

          <div class="actions">
            <button class="btnSmall btnPortal" type="button" ${locked ? "disabled" : ""}>
              Buka kuiz
            </button>
          </div>
        `;

        const btn = card.querySelector(".btnPortal");
        btn.addEventListener("click", () => {
          if(locked) return;
          if(!link){
            alert("quizLink kosong dalam sheet Quizzes.");
            return;
          }
          window.open(link, "_blank", "noopener"); // ✅ terus jawab kat Google Forms
        });

        el.appendChild(card);
      });
    }

    // ===================== BOOT =====================
    async function boot(){
      clearMsg();

      const token = localStorage.getItem("kk_token") || "";
      if(!token){
        location.href = "./login.html";
        return;
      }

      const classId = q("classId").trim();
      if(!classId){
        showMsg("err", "classId tak wujud dalam URL. Balik dashboard.");
        return;
      }

      $("classIdPill").textContent = classId;

      // 1) verify token -> me
      const me = await apiPost({ action:"me", token });
      if(!me || !me.ok){
        showMsg("err", me?.message || "Token invalid. Sila login semula.");
        localStorage.removeItem("kk_token");
        localStorage.removeItem("kk_user");
        setTimeout(()=> location.href="./login.html", 600);
        return;
      }
      const displayName = me.user?.name || me.user?.email || "Pelajar";
      $("sub").textContent = `Hi, ${displayName}`;

      // 2) get class info
      const cls = await apiPost({ action:"getClass", token, classId });
      if(!cls || !cls.ok){
        showMsg("err", cls?.message || "Tak dapat load kelas.");
        return;
      }

      $("title").textContent = cls.class?.className || "Kelas";
      $("classCodePill").textContent = cls.class?.classCode || "-";

      // 3) list notes
      const notes = await apiPost({ action:"listNotesForClass", token, classId });
      if(!notes || !notes.ok){
        console.error("listNotesForClass failed:", notes);
        renderNotes([], classId);
      } else {
        renderNotes(notes.notes || [], classId);
      }

      // 4) list quizzes (✅ terus buka link, tak masuk portal)
      // Kalau backend kau guna action lain, tukar sini je.
      const quizzes = await apiPost({ action:"listQuizzesForClass", token, classId });
      if(!quizzes || !quizzes.ok){
        console.error("listQuizzesForClass failed:", quizzes);
        renderQuizzes([]);
      } else {
        renderQuizzes(quizzes.quizzes || quizzes.items || []);
      }

      showMsg("ok", "Kelas ok. Enrollment ok. Nota & Kuiz dimuatkan.");
    }

    $("btnBack").addEventListener("click", ()=> location.href = "./dashboard.html");
    $("btnLogout").addEventListener("click", ()=>{
      localStorage.removeItem("kk_token");
      localStorage.removeItem("kk_user");
      location.href = "./login.html";
    });

    boot();
  </script>
</body>
</html>
