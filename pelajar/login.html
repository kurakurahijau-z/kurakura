<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Masuk • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
  <script src="../app.js"></script>

  <style>
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 26px 16px;
    }
    .box{ width: min(520px, 92vw); }
    .title{
      margin:0 0 6px;
      font-size: 42px;
      line-height:1.05;
      letter-spacing:-0.02em;
      font-weight: 950;
    }
    .sub{
      margin:0 0 18px;
      color: rgba(15,23,42,0.65);
      font-weight: 800;
    }
    label{
      display:block;
      font-weight: 900;
      margin: 14px 0 8px;
    }
    .input{
      width:100%;
      padding: 14px 14px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,0.16);
      background: rgba(255,255,255,0.70);
      outline: none;
      font-size: 15px;
    }
    .input:focus{
      border-color: rgba(5,150,105,0.55);
      box-shadow: 0 0 0 4px rgba(5,150,105,0.14);
    }
    .btn{ width:100%; margin-top: 16px; }

    .msg{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 850;
      display:none;
    }
    .msg.ok{
      display:block;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.25);
      color: #065f46;
    }
    .msg.err{
      display:block;
      background: rgba(239,68,68,0.10);
      border: 1px solid rgba(239,68,68,0.22);
      color: #991b1b;
    }

    .links{
      margin-top: 10px;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .links a{
      font-size: 13px;
      font-weight: 900;
      color: #059669;
      text-decoration:none;
    }
    .links a:hover{ text-decoration:underline; }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .back{
      text-decoration:none;
      color: #0f172a;
      font-weight: 900;
      opacity:.9;
    }
    .back:hover{ opacity:1; }
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <section class="card box">
      <h1 class="title">Log Masuk</h1>
      <p class="sub">Masuk untuk akses kelas, nota & kuiz. Admin akan auto-redirect ke dashboard admin.</p>

      <div id="msg" class="msg"></div>

      <label for="email">Email</label>
      <input id="email" class="input" type="email" placeholder="contoh: ali@student.com" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password" />

      <!-- ✅ BUTTON SUBMIT -->
      <button id="btnLogin" class="btn-primary btn" type="button">Log Masuk</button>

      <div class="links">
        <a href="./register.html">Daftar akaun baru</a>
        <a href="./reset-password.html">Lupa password?</a>
      </div>

      <div class="row">
        <a class="back" href="../index.html">← balik</a>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function showMsg(type, text){
      const el = $("msg");
      el.className = "msg " + (type === "ok" ? "ok" : "err");
      el.textContent = text;
      el.style.display = "block";
    }

    function routeByRole(role){
      const r = String(role || "").toLowerCase();
      if (r === "admin") return "../admin/dashboard.html";
      return "./dashboard.html";
    }

    $("btnLogin").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password){
        showMsg("err", "Sila isi email dan password.");
        return;
      }

      $("btnLogin").disabled = true;
      $("btnLogin").textContent = "Log masuk...";

      try{
        const data = await apiPost({ action:"login", email, password });

        if (!data || !data.ok){
          showMsg("err", data?.message || "Log masuk gagal.");
          $("btnLogin").disabled = false;
          $("btnLogin").textContent = "Log Masuk";
          return;
        }

        if (data.token) localStorage.setItem("kk_token", data.token);
        if (data.user)  localStorage.setItem("kk_user", JSON.stringify(data.user));

        showMsg("ok", "Berjaya. Redirect...");
        window.location.replace(routeByRole(data.user?.role));

      }catch(err){
        console.error(err);
        showMsg("err", "Tak dapat connect server. Semak BASE_URL dan Console.");
        $("btnLogin").disabled = false;
        $("btnLogin").textContent = "Log Masuk";
      }
    });
  </script>
</body>
</html>
