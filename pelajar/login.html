<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Masuk • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 24px 16px; }
    .wrap{ width: 100%; max-width: 520px; }
    .card{
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 22px;
      box-shadow: 0 16px 45px rgba(2, 6, 23, .12);
      padding: 22px;
    }
    .title{ margin: 0; font-size: 34px; font-weight: 950; letter-spacing: -0.02em; text-align:center; }
    .subtitle{ margin: 8px 0 0; text-align:center; color:#334155; font-weight: 800; opacity:.92; line-height:1.4; }

    .msg{ display:none; margin: 14px 0 0; padding: 10px 12px; border-radius: 14px; font-weight: 900; }
    .msg.err{ display:block; background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.28); color: #991b1b; }
    .msg.ok { display:block; background: rgba(34,197,94,.10); border: 1px solid rgba(34,197,94,.28); color: #065f46; }

    .form{ margin-top: 16px; display:grid; gap: 12px; }
    label{ font-weight: 900; color:#0f172a; font-size: 13px; }
    input{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.14);
      background: rgba(255,255,255,.90);
      outline: none;
      font-weight: 800;
      color:#0f172a;
    }
    input:focus{
      border-color: rgba(5,150,105,.45);
      box-shadow: 0 0 0 5px rgba(5,150,105,.12);
    }

    .btn{
      width:100%;
      border: 0;
      cursor: pointer;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 950;
      background: #059669;
      color: #fff;
      box-shadow: 0 10px 24px rgba(5,150,105,.18);
    }
    .btn:hover{ background:#047857; }
    .btn:disabled{ opacity: .55; cursor: not-allowed; box-shadow:none; }

    .links{
      margin-top: 14px;
      display:flex;
      justify-content:space-between;
      gap: 12px;
      font-weight: 900;
      color:#0f172a;
    }
    .links a{ color:#0f172a; text-decoration:none; opacity:.86; }
    .links a:hover{ opacity:1; text-decoration:underline; }

    .tip{
      margin-top: 12px;
      text-align:center;
      color:#334155;
      font-weight: 800;
      opacity:.9;
      font-size: 12px;
    }
    .kbd{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,.18);
      background: rgba(255,255,255,.55);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-weight: 900;
      font-size: 11px;
      margin-left: 6px;
    }
  </style>
</head>

<body class="stage">
  <main class="page">
    <div class="wrap">
      <div class="card">
        <h1 class="title">Log Masuk</h1>
        <p class="subtitle">
          Satu pintu masuk untuk admin & pelajar.<br/>
          Selepas login, sistem akan hantar automatik ikut peranan.
        </p>

        <div id="msg" class="msg"></div>

        <form id="form" class="form" autocomplete="on">
          <div>
            <label for="email">Email</label>
            <input id="email" type="email" required placeholder="contoh: ali@student.com" />
          </div>

          <div>
            <label for="password">Password</label>
            <input id="password" type="password" required placeholder="••••••••" />
          </div>

          <button class="btn" id="btnLogin" type="submit">Log Masuk</button>
        </form>

        <div class="links">
          <a href="./register.html">Daftar akaun baru</a>
          <a href="./reset-password.html">Lupa password?</a>
          <a href="../index.html">← balik</a>
        </div>

        <div class="tip">
          Tip Mac: buka Console <span class="kbd">⌥⌘J</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const msgEl = document.getElementById("msg");
    const formEl = document.getElementById("form");
    const btnLogin = document.getElementById("btnLogin");
    const emailEl = document.getElementById("email");
    const passEl  = document.getElementById("password");

    function getBaseUrl(){
      const cfg = window.APP_CONFIG || {};
      return cfg.BASE_URL || "";
    }

    function showMsg(type, text){
      msgEl.className = "msg " + (type === "ok" ? "ok" : "err");
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }
    function clearMsg(){
      msgEl.style.display = "none";
      msgEl.textContent = "";
      msgEl.className = "msg";
    }

    async function apiPost(action, params){
      const BASE_URL = getBaseUrl();
      if(!BASE_URL) return { ok:false, message:"BASE_URL belum set. Semak config.js" };

      const body = new URLSearchParams();
      Object.entries(params || {}).forEach(([k,v]) => body.append(k, v ?? ""));

      try{
        const res = await fetch(`${BASE_URL}?action=${encodeURIComponent(action)}`, {
          method: "POST",
          body
        });
        const text = await res.text();
        try { return JSON.parse(text); }
        catch(e){ return { ok:false, message:"Response bukan JSON", raw:text }; }
      }catch(err){
        return { ok:false, message:"Tak dapat connect server. Check Console.", error:String(err) };
      }
    }

    function goByRole(user){
      // server kau simpan role: "admin" / "student"
      const role = String(user?.role || "").toLowerCase();
      if(role === "admin"){
        window.location.href = "../admin/dashboard.html";
      }else{
        window.location.href = "./dashboard.html";
      }
    }

    async function tryAutoRedirect(){
      const token = localStorage.getItem("kk_token") || "";
      if(!token) return;

      // verify token
      const me = await apiPost("me", { token });
      if(me && me.ok && me.user){
        localStorage.setItem("kk_user", JSON.stringify(me.user));
        goByRole(me.user);
      }else{
        // token rosak -> clear
        localStorage.removeItem("kk_token");
        localStorage.removeItem("kk_user");
      }
    }

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();

      const email = (emailEl.value || "").trim();
      const password = passEl.value || "";

      if(!email || !password){
        showMsg("err", "Sila isi email dan password.");
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = "Loading...";

      const out = await apiPost("login", { email, password });

      btnLogin.disabled = false;
      btnLogin.textContent = "Log Masuk";

      if(!out || !out.ok){
        showMsg("err", out?.message || "Login gagal.");
        return;
      }

      // simpan token & user
      if(out.token) localStorage.setItem("kk_token", out.token);
      if(out.user)  localStorage.setItem("kk_user", JSON.stringify(out.user));

      showMsg("ok", "Login berjaya. Mengalihkan anda...");
      setTimeout(() => goByRole(out.user), 250);
    });

    // on load
    tryAutoRedirect();
  </script>
</body>
</html>
