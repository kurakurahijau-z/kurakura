<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Masuk • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .wrap{ min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
    .card{
      width:min(520px, 100%);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(2, 6, 23, .14);
      padding: 18px;
    }
    h1{ margin:0; font-size: 34px; letter-spacing:-.03em; font-weight: 950; color:#0f172a; }
    p{ margin:6px 0 0; color:#334155; font-weight: 850; opacity:.92; line-height:1.6; }
    label{ display:block; margin-top:12px; font-weight: 900; color:#0f172a; font-size: 13px; }
    input{
      width:100%;
      margin-top:6px;
      padding:12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.12);
      background: rgba(255,255,255,.7);
      outline:none;
      font-weight: 850;
    }
    input:focus{ border-color: rgba(2,132,199,.45); box-shadow: 0 0 0 4px rgba(56,189,248,.16); }
    .btn{
      width:100%;
      margin-top:14px;
      border:0;
      padding:12px 14px;
      border-radius: 14px;
      font-weight: 950;
      cursor:pointer;
      color:#fff;
      background: linear-gradient(135deg, #059669, #0ea5e9);
      box-shadow: 0 12px 28px rgba(2,132,199,.18);
    }
    .btn:hover{ filter: brightness(0.98); }
    .row{ display:flex; justify-content:space-between; gap:10px; margin-top:12px; font-weight: 900; }
    .row a{ text-decoration:none; }
    .row a:hover{ text-decoration: underline; }
    .msg{ display:none; margin-top:12px; padding:10px 12px; border-radius: 14px; font-weight: 950; }
    .msg.err{ display:block; background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.28); color: #991b1b; }
    .msg.ok{ display:block; background: rgba(34,197,94,.10); border: 1px solid rgba(34,197,94,.28); color: #065f46; }
    .back{ margin-top:10px; display:inline-flex; gap:6px; align-items:center; font-weight: 950; }
  </style>
</head>

<body class="stage">
  <div class="wrap">
    <div class="card">
      <h1>Log Masuk</h1>
      <p>Masuk untuk akses kelas, nota & kuiz. Admin akan auto-redirect ke dashboard admin.</p>

      <div id="msg" class="msg"></div>

      <form id="formLogin">
        <label>Email</label>
        <input id="email" type="email" placeholder="email@contoh.com" autocomplete="username" required>

        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>

        <button class="btn" type="submit">Log Masuk</button>
      </form>

      <div class="row">
        <a href="./register.html">Daftar akaun baru</a>
        <a href="./reset.html">Lupa password?</a>
      </div>

      <a class="back" href="../index.html">← balik</a>
    </div>
  </div>

  <script>
    const msgEl = document.getElementById("msg");
    const form = document.getElementById("formLogin");

    function showMsg(type, text){
      msgEl.className = "msg " + (type === "ok" ? "ok" : "err");
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }
    function clearMsg(){
      msgEl.style.display = "none";
      msgEl.textContent = "";
      msgEl.className = "msg";
    }
    function getBaseUrl(){
      const cfg = window.APP_CONFIG;
      return (cfg && cfg.BASE_URL) ? cfg.BASE_URL : null;
    }

    async function apiPost(obj){
      const BASE_URL = getBaseUrl();
      if(!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud. Semak config.js");

      const res = await fetch(BASE_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(obj || {})
      });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Invalid JSON from server", raw:text }; }
    }

    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      clearMsg();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      showMsg("ok", "Checking...");

      try{
        const data = await apiPost({ action:"login", email, password });
        if(!data || !data.ok){
          showMsg("err", data?.message || "Login gagal");
          return;
        }

        localStorage.setItem("kk_token", data.token || "");
        localStorage.setItem("kk_user", JSON.stringify(data.user || {}));

        // role-based redirect
        const role = String(data.user?.role || "").toLowerCase();
        if(role === "admin") location.href = "../admin/dashboard.html";
        else location.href = "./dashboard.html";

      } catch(err){
        showMsg("err", "Tak dapat connect server. Semak BASE_URL dan Console.");
      }
    });
  </script>
</body>
</html>
