<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Masuk • kura kura hijau</title>

<script src="../config.js"></script>

<style>
body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(135deg,#cfe8dd,#e6e8c7);
}

.box{
  width:380px;
  background:#fff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.1);
}

h1{
  margin:0 0 10px;
  text-align:center;
}

.sub{
  text-align:center;
  font-size:14px;
  margin-bottom:20px;
  color:#555;
}

label{
  font-weight:600;
  font-size:14px;
}

input{
  width:100%;
  padding:10px;
  margin:6px 0 14px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#059669;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  background:#047857;
}

.msg{
  margin-bottom:15px;
  padding:10px;
  border-radius:8px;
  font-weight:600;
  display:none;
}

.msg.err{
  background:#fee2e2;
  color:#991b1b;
}

.msg.ok{
  background:#dcfce7;
  color:#065f46;
}
</style>
</head>

<body>

<div class="box">
<h1>Log Masuk</h1>
<div class="sub">
Satu pintu masuk untuk admin & pelajar
</div>

<div id="msg" class="msg"></div>

<form id="form">
<label>Email</label>
<input type="email" id="email" required>

<label>Password</label>
<input type="password" id="password" required>

<button type="submit">Log Masuk</button>
</form>
</div>

<script>
const BASE_URL = window.APP_CONFIG?.BASE_URL || "";
const msgEl = document.getElementById("msg");

function showMsg(type,text){
  msgEl.className="msg "+type;
  msgEl.textContent=text;
  msgEl.style.display="block";
}

async function apiPost(params){
  const body=new URLSearchParams();
  Object.entries(params).forEach(([k,v])=>body.append(k,v));
  const res=await fetch(BASE_URL,{method:"POST",body});
  const text=await res.text();
  return JSON.parse(text);
}

function goByRole(role){
  if(role==="admin"){
    location.href="../admin/dashboard.html";
  }else{
    location.href="./dashboard.html";
  }
}

document.getElementById("form").addEventListener("submit",async(e)=>{
  e.preventDefault();
  msgEl.style.display="none";

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  try{
    const out=await apiPost({action:"login",email,password});
    if(!out.ok){
      showMsg("err",out.message||"Login gagal");
      return;
    }

    localStorage.setItem("kk_token",out.token);
    localStorage.setItem("kk_user",JSON.stringify(out.user));

    goByRole(out.user.role);

  }catch(err){
    showMsg("err","Tak dapat connect server");
  }
});
</script>

</body>
</html>
