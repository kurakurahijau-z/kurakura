<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login Pelajar</title>

  <script src="../config.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(120deg,#e6fff3,#fff9cc);
      margin: 0;
      padding: 40px;
    }
    .card {
      max-width: 420px;
      background: #fff;
      margin: auto;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,.1);
    }
    h1 { margin-top: 0 }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 999px;
      border: 0;
      background: #059669;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
    .back {
      margin-top: 12px;
      display: inline-block;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Login Pelajar</h1>
  <p>Masuk untuk akses kelas, nota & kuiz.</p>

  <div id="err" class="error"></div>

  <input id="email" type="email" placeholder="contoh: ali@student.com" />
  <input id="password" type="password" placeholder="Password" />

  <button onclick="login()">Log Masuk</button>

  <a class="back" href="../index.html">← balik</a>
</div>

<script>
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const err = document.getElementById('err');
  err.style.display = 'none';

  if (!email || !password) {
    err.textContent = "Sila isi email & password.";
    err.style.display = 'block';
    return;
  }

  const url = window.APP_CONFIG.BASE_URL
            + "&action=login"
            + "&email=" + encodeURIComponent(email)
            + "&password=" + encodeURIComponent(password);

  try {
    const res = await fetch(url);
    const data = await res.json();

    console.log("LOGIN RESPONSE:", data);

    if (!data.ok) {
      err.textContent = data.message || "Login gagal.";
      err.style.display = 'block';
      return;
    }

    // Simpan session ringkas
    localStorage.setItem("user", JSON.stringify(data.user));

    // Redirect dashboard
    window.location.href = "dashboard.html";

  } catch (e) {
    console.error(e);
    err.textContent = "Fetch gagal. Sila buka Console.";
    err.style.display = 'block';
  }
}
</script>

</body>
</html>
