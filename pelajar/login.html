<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Pelajar • kura kura hijau</title>

  <!-- Global theme -->
  <link rel="stylesheet" href="../styles.css" />

  <!-- APP CONFIG (WAJIB ADA) -->
  <script src="../config.js"></script>

  <style>
    .wrap{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding: 26px 16px;
    }
    .card-login{
      width: min(520px, 92vw);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, .10);
      padding: 22px;
    }
    h1{
      margin: 0 0 6px;
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .sub{
      margin: 0 0 16px;
      color: #334155;
      font-weight: 600;
    }
    label{
      display:block;
      font-weight: 800;
      margin: 14px 0 8px;
    }
    input{
      width: 100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.18);
      outline: none;
      background: rgba(255,255,255,.88);
      font-size: 16px;
    }
    input:focus{
      border-color: rgba(5,150,105,.45);
      box-shadow: 0 0 0 4px rgba(5,150,105,.12);
    }
    .btn{
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 0;
      cursor: pointer;
      background: #059669;
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 8px 18px rgba(5,150,105,.18);
    }
    .btn:hover{ background:#047857; }
    .btn:active{ transform: translateY(1px); }

    .msg{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      display:none;
      font-weight: 800;
    }
    .msg.err{
      display:block;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.28);
      color: #991b1b;
    }
    .msg.ok{
      display:block;
      background: rgba(34,197,94,.10);
      border: 1px solid rgba(34,197,94,.28);
      color: #065f46;
    }
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }
    a{
      color:#0f172a;
      font-weight: 900;
      text-decoration:none;
      opacity: .85;
    }
    a:hover{ opacity: 1; text-decoration: underline; }

    .tiny{
      margin-top: 10px;
      font-size: 13px;
      color: #334155;
      opacity: .85;
    }
    code{
      background: rgba(2,6,23,.06);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 800;
    }
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <section class="card-login">
      <h1>Login Pelajar</h1>
      <p class="sub">Masuk untuk akses kelas, nota & kuiz.</p>

      <div id="msg" class="msg"></div>

      <form id="loginForm" autocomplete="on">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="contoh: ali@student.com" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required />

        <button class="btn" type="submit" id="btnLogin">Log Masuk</button>
      </form>

      <div class="row">
        <a href="../index.html">← balik</a>
        <span class="tiny">Tip Mac: buka Console <code>⌥⌘J</code></span>
      </div>

      <div class="tiny" style="margin-top:12px">
        Debug cepat: taip <code>window.APP_CONFIG</code>
      </div>
    </section>
  </main>

  <script>
    // ====== Config check ======
    const BASE_URL = window.APP_CONFIG && window.APP_CONFIG.BASE_URL ? window.APP_CONFIG.BASE_URL : "";
    const msgEl = document.getElementById("msg");
    const btnLogin = document.getElementById("btnLogin");

    function showMsg(type, text){
      msgEl.className = "msg " + (type === "ok" ? "ok" : "err");
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }

    function clearMsg(){
      msgEl.style.display = "none";
      msgEl.textContent = "";
      msgEl.className = "msg";
    }

    async function postForm(action, data){
      // ✅ NO custom headers -> avoid preflight
      const url = `${BASE_URL}?action=${encodeURIComponent(action)}`;
      const body = new URLSearchParams(data);

      const res = await fetch(url, { method: "POST", body });
      const text = await res.text();

      // Apps Script kadang return text JSON
      try { return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Response bukan JSON", raw:text }; }
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();

      if(!BASE_URL){
        showMsg("err", "APP_CONFIG.BASE_URL tak wujud. Semak config.js");
        return;
      }

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if(!email || !password){
        showMsg("err", "Isi email & password dulu.");
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = "Logging in...";

      try{
        const out = await postForm("login", { email, password });

        if(!out || !out.ok){
          showMsg("err", out?.message || "Login gagal.");
          return;
        }

        // Simpan token/session (ikut backend kau; aku letak common fields)
        if(out.token) localStorage.setItem("kk_token", out.token);
        if(out.user)  localStorage.setItem("kk_user", JSON.stringify(out.user));

        showMsg("ok", "Login berjaya. Redirect...");
        setTimeout(() => {
          // tukar target ni ikut struktur folder kau
          window.location.href = "./dashboard.html";
        }, 450);

      }catch(err){
        console.error(err);
        showMsg("err", "Fetch gagal. Check Console error (CORS / URL).");
      }finally{
        btnLogin.disabled = false;
        btnLogin.textContent = "Log Masuk";
      }
    });
  </script>
</body>
</html>
