<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Masuk • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .wrap{
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px 16px;
    }
    .card{
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(2,6,23,.12);
      padding: 18px;
    }
    .title{
      margin: 6px 0 0;
      font-size: 34px;
      font-weight: 950;
      letter-spacing: -0.02em;
      text-align:center;
    }
    .sub{
      margin: 8px 0 0;
      text-align:center;
      font-weight: 800;
      color:#334155;
      opacity:.9;
      line-height: 1.4;
    }
    .msg{ display:none; margin:14px 0 0; padding: 10px 12px; border-radius: 14px; font-weight: 900; }
    .msg.err{ display:block; background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.28); color: #991b1b; }
    .msg.ok{ display:block; background: rgba(34,197,94,.10); border: 1px solid rgba(34,197,94,.28); color: #065f46; }

    .form{ margin-top: 14px; display:grid; gap: 12px; }
    label{ font-weight: 900; color:#0f172a; }
    input{
      width:100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,.12);
      outline: none;
      font-weight: 800;
      background: rgba(255,255,255,.9);
    }
    input:focus{
      border-color: rgba(5,150,105,.45);
      box-shadow: 0 0 0 4px rgba(5,150,105,.12);
    }
    .btn{
      border:0;
      cursor:pointer;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 950;
      background: #059669;
      color:#fff;
      box-shadow: 0 8px 18px rgba(5,150,105,.18);
    }
    .btn:hover{ background:#047857; }
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .link{
      font-weight: 900;
      color:#0f172a;
      text-decoration: none;
      opacity:.85;
    }
    .link:hover{ opacity:1; text-decoration: underline; }
    .tip{
      margin-top: 10px;
      font-weight: 800;
      color:#334155;
      opacity:.9;
      font-size: 12px;
      text-align:right;
    }
    .kbd{
      display:inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,.14);
      background: rgba(255,255,255,.65);
      font-weight: 950;
      font-size: 12px;
      margin-left: 6px;
    }
  </style>
</head>

<body class="stage">
  <div class="wrap">
    <div class="card">
      <h1 class="title">Log Masuk</h1>
      <p class="sub">Satu pintu masuk untuk admin &amp; pelajar. Lepas login, sistem akan hantar automatik ikut peranan.</p>

      <div id="msg" class="msg"></div>

      <form id="form" class="form" autocomplete="on">
        <div>
          <label for="email">Email</label><br />
          <input id="email" type="email" placeholder="contoh: ali@student.com" required />
        </div>

        <div>
          <label for="password">Password</label><br />
          <input id="password" type="password" placeholder="••••••••" required />
        </div>

        <button class="btn" type="submit" id="btn">Log Masuk</button>
      </form>

      <div class="row">
        <a class="link" href="./register.html">Daftar akaun baru</a>
        <a class="link" href="./reset.html">Lupa password?</a>
        <a class="link" href="../index.html">← balik</a>
      </div>

      <div class="tip">Tip Mac: buka Console <span class="kbd">⌥⌘J</span></div>
    </div>
  </div>

  <script>
    const BASE_URL = window.APP_CONFIG && window.APP_CONFIG.BASE_URL ? window.APP_CONFIG.BASE_URL : "";
    const msgEl = document.getElementById("msg");
    const form = document.getElementById("form");
    const btn  = document.getElementById("btn");

    function showMsg(type, text){
      msgEl.className = "msg " + (type === "ok" ? "ok" : "err");
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }
    function clearMsg(){
      msgEl.style.display = "none";
      msgEl.textContent = "";
      msgEl.className = "msg";
    }

    async function apiPost(action, params){
      if(!BASE_URL) return { ok:false, message:"APP_CONFIG.BASE_URL tak wujud. Semak config.js" };

      const body = new URLSearchParams();
      Object.entries(params || {}).forEach(([k,v]) => body.append(k, v ?? ""));

      let res, text;
      try{
        res = await fetch(`${BASE_URL}?action=${encodeURIComponent(action)}`, { method:"POST", body });
        text = await res.text();
      }catch(err){
        return { ok:false, message:"Tak dapat connect server. Check Console.", error:String(err) };
      }

      try { return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Response bukan JSON", raw:text }; }
    }

    function goByRole(user){
      const role = String(user?.role || "").toLowerCase();
      if(role === "admin"){
        window.location.href = "../admin/dashboard.html";
      }else{
        window.location.href = "./dashboard.html";
      }
    }

    // ✅ kalau token dah ada, terus resolve role dari backend (auto redirect)
    async function autoRedirectIfLoggedIn(){
      const token = localStorage.getItem("kk_token") || "";
      if(!token) return;

      const me = await apiPost("me", { token });
      if(me && me.ok){
        localStorage.setItem("kk_user", JSON.stringify(me.user || {}));
        goByRole(me.user);
        return;
      }

      // token rosak → clear
      localStorage.removeItem("kk_token");
      localStorage.removeItem("kk_user");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if(!email || !password){
        showMsg("err", "Sila isi email dan password.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Memproses...";

      const out = await apiPost("login", { email, password });

      btn.disabled = false;
      btn.textContent = "Log Masuk";

      if(!out || !out.ok){
        console.error("login failed:", out);
        showMsg("err", out?.message || "Login gagal.");
        return;
      }

      // simpan token + user
      localStorage.setItem("kk_token", out.token || "");
      localStorage.setItem("kk_user", JSON.stringify(out.user || {}));

      showMsg("ok", "Login berjaya. Mengalihkan ikut peranan...");

      setTimeout(() => {
        goByRole(out.user);
      }, 300);
    });

    autoRedirectIfLoggedIn();
  </script>
</body>
</html>
