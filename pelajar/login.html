<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login • kura kura hijau</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
  <script src="../app.js"></script>
</head>
<body class="stage">
  <header class="topbar">
    <div class="inner">
      <div>
        <h1>Login</h1>
        <p class="muted">Masuk sebagai admin atau pelajar</p>
      </div>
      <div class="actions">
        <a class="btn ghost" href="../index.html">Home</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card" style="max-width:520px;">
      <div id="msg" class="notice"></div>

      <label>Email</label>
      <input id="email" placeholder="contoh: ali@gmail.com" />

      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" />

      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
        <button class="btn" id="btnLogin">Login</button>
        <button class="btn ghost" id="btnClear">Clear</button>
      </div>

      <p class="muted small" style="margin-top:10px;">
        Tip: Lepas login, sistem akan redirect automatik ikut role.
      </p>
    </section>
  </main>

  <script>
    const msg = document.getElementById("msg");
    function showMsg(text, ok){
      msg.style.display = "block";
      msg.textContent = text;
      msg.style.background = ok ? "rgba(34,197,94,.10)" : "rgba(239,68,68,.10)";
      msg.style.border = ok ? "1px solid rgba(34,197,94,.28)" : "1px solid rgba(239,68,68,.28)";
      msg.style.color = ok ? "#065f46" : "#991b1b";
    }
    function hideMsg(){ msg.style.display="none"; msg.textContent=""; }

    document.getElementById("btnClear").onclick = ()=>{
      document.getElementById("email").value="";
      document.getElementById("password").value="";
      hideMsg();
    };

    document.getElementById("btnLogin").onclick = async ()=>{
      hideMsg();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if(!email || !password) return showMsg("Email & password wajib.", false);

      const res = await apiPost({ action:"login", email, password });
      if(!res.ok) return showMsg(res.message || "Login gagal.", false);

      setToken(res.token);
      localStorage.setItem("kk_user", JSON.stringify(res.user || {}));

      const role = String(res.user?.role || "").toLowerCase();
      if(role === "admin") location.href = "../admin/dashboard.html";
      else location.href = "./dashboard.html";
    };

    // jika dah login, terus redirect ikut role
    (async ()=>{
      const t = getToken();
      if(!t) return;
      const r = await apiPost({ action:"me", token:t });
      if(!r.ok){ clearToken(); return; }
      const role = String(r.user?.role || "").toLowerCase();
      if(role === "admin") location.href = "../admin/dashboard.html";
      else location.href = "./dashboard.html";
    })();
  </script>
</body>
</html>
