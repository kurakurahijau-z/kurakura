<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login Pelajar</title>

  <!-- ✅ absolute paths (penting untuk GitHub Pages /kurakura/) -->
  <link rel="stylesheet" href="/kurakura/styles.css" />
  <script src="/kurakura/config.js"></script>
  <script src="/kurakura/app.js"></script>
</head>

<body>
  <main class="auth-wrap">
    <section class="card auth-card">
      <h1 class="auth-title">Login</h1>
      <p class="muted">Masuk untuk akses kelas, nota & kuiz.</p>

      <div id="msg" class="notice err" style="display:none;"></div>

      <label class="label">Email</label>
      <input id="email" class="input" type="email" autocomplete="username" placeholder="email@contoh.com" />

      <label class="label">Password</label>
      <input id="password" class="input" type="password" autocomplete="current-password" placeholder="••••••••" />

      <button id="btnLogin" class="btn primary w-full">Log Masuk</button>

      <div class="auth-links">
        <a class="link" href="./register.html">Daftar akaun baru</a>
        <a class="link" href="./reset.html">Lupa password?</a>
      </div>

      <a class="link" href="/kurakura/index.html">← balik</a>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function showErr(text){
      const el = $("msg");
      el.style.display = "block";
      el.textContent = text;
    }
    function clearErr(){
      const el = $("msg");
      el.style.display = "none";
      el.textContent = "";
    }

    // ✅ guard: kalau config.js tak load, bagi mesej jelas
    const BASE_URL = window.APP_CONFIG?.BASE_URL || "";
    if(!BASE_URL){
      showErr("BASE_URL tak dijumpai. Semak fail /kurakura/config.js wujud & path script betul.");
    }

    $("btnLogin").addEventListener("click", async ()=>{
      clearErr();

      if(!BASE_URL){
        showErr("BASE_URL tak dijumpai. config.js belum load.");
        return;
      }

      const email = ($("email").value || "").trim();
      const password = $("password").value || "";

      if(!email || !password){
        showErr("Sila isi email dan password.");
        return;
      }

      // apiPost dari app.js (akan guna BASE_URL dari config.js)
      const res = await apiPost({ action:"login", email, password });

      if(!res || !res.ok){
        showErr(res?.message || "Login gagal.");
        return;
      }

      localStorage.setItem("kk_token", res.token);
      localStorage.setItem("kk_user", JSON.stringify(res.user || {}));

      // ✅ auto redirect ikut role
      const role = (res.user?.role || "").toLowerCase();
      if(role === "admin") location.href = "/kurakura/admin/dashboard.html";
      else location.href = "/kurakura/pelajar/dashboard.html";
    });
  </script>
</body>
</html>
