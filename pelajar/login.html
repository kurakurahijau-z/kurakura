<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Login Pelajar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CONFIG -->
  <script src="../config.js"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#e7f3ef;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .card{
      background:#fff;
      padding:30px;
      border-radius:12px;
      width:350px;
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
    }
    h2{
      margin-top:0;
    }
    input{
      width:100%;
      padding:10px;
      margin:8px 0;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:14px;
    }
    button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      background:#16a34a;
      color:#fff;
      font-weight:bold;
      cursor:pointer;
    }
    button:hover{
      background:#15803d;
    }
    .error{
      background:#fee2e2;
      color:#991b1b;
      padding:8px;
      border-radius:6px;
      margin-bottom:10px;
      display:none;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Login</h2>
  <div id="errorBox" class="error"></div>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Log Masuk</button>
</div>

<script>
function getBaseUrl(){
  return window.APP_CONFIG?.BASE_URL || "";
}

async function apiPost(params){
  const BASE_URL = getBaseUrl();
  if(!BASE_URL){
    return { ok:false, message:"BASE_URL tak dijumpai" };
  }

  const action = String(params?.action || "").trim();

  // Force action masuk querystring
  const url = action
    ? `${BASE_URL}?action=${encodeURIComponent(action)}`
    : BASE_URL;

  const body = new URLSearchParams();

  Object.entries(params || {}).forEach(([k,v])=>{
    if(k === "action") return;
    body.append(k, v ?? "");
  });

  const res = await fetch(url,{
    method:"POST",
    headers:{
      "Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"
    },
    body
  });

  const text = await res.text();

  try{
    return JSON.parse(text);
  }catch(e){
    return { ok:false, message:"Response bukan JSON", raw:text };
  }
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorBox = document.getElementById("errorBox");

  errorBox.style.display="none";

  if(!email || !password){
    errorBox.innerText="Isi email dan password.";
    errorBox.style.display="block";
    return;
  }

  const result = await apiPost({
    action:"login",
    email,
    password
  });

  if(!result.ok){
    errorBox.innerText=result.message || "Login gagal.";
    errorBox.style.display="block";
    return;
  }

  // Simpan token
  localStorage.setItem("token", result.token);

  // Redirect ikut role
  if(result.user?.isAdmin){
    window.location.href="../admin/dashboard.html";
  }else{
    window.location.href="dashboard.html";
  }
}
</script>

</body>
</html>
