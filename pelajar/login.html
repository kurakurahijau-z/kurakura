<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Masuk • kura kura hijau</title>

  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>

  <style>
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 26px 16px;
    }
    .box{ width: min(520px, 92vw); }
    .title{
      margin:0 0 6px;
      font-size: 42px;
      line-height:1.05;
      letter-spacing:-0.02em;
      font-weight: 950;
    }
    .sub{
      margin:0 0 18px;
      color: var(--kk-muted);
      font-weight: 700;
    }
    label{
      display:block;
      font-weight: 850;
      margin: 14px 0 8px;
    }
    .input{
      width:100%;
      box-sizing:border-box;
      padding: 14px 14px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.16);
      background: rgba(255,255,255,.70);
      outline: none;
      font-size: 15px;
    }
    .input:focus{
      border-color: rgba(5,150,105,.55);
      box-shadow: 0 0 0 4px rgba(5,150,105,.14);
    }
    .btn{ width:100%; margin-top: 16px; }

    .msg{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 850;
      display:none;
    }
    .msg.ok{
      display:block;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.25);
      color: #065f46;
    }
    .msg.err{
      display:block;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.22);
      color: #991b1b;
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .back{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      text-decoration:none;
      color: var(--kk-text);
      font-weight: 850;
      opacity:.9;
    }
    .back:hover{ opacity:1; }

    .tiny{
      font-size: 12px;
      color: var(--kk-muted);
      font-weight: 750;
      opacity:.85;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(15,23,42,.18);
      background: rgba(255,255,255,.55);
    }

    .links{
      margin-top: 10px;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .links a{
      font-size: 13px;
      font-weight: 900;
      color: #059669;
      text-decoration:none;
    }
    .links a:hover{ text-decoration:underline; }

    /* ✅ session box */
    .session{
      display:none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(2,6,23,.04);
      border: 1px solid rgba(15,23,42,.08);
    }
    .session strong{ font-weight: 950; }
    .session .actions{
      margin-top: 10px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content:flex-end;
    }
    .btnSmall{
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 900;
      border: 0;
      cursor: pointer;
    }
    .btnGo{ background:#059669; color:#fff; }
    .btnSwap{ background: rgba(255,255,255,.85); border:1px solid rgba(15,23,42,.12); color:#0f172a; }
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <section class="card box">
      <h1 class="title">Log Masuk</h1>
      <p class="sub">Satu pintu masuk untuk admin & pelajar. Sistem akan hantar automatik ikut peranan.</p>

      <div id="msg" class="msg"></div>

      <!-- ✅ kalau ada token, kita bagi pilihan -->
      <div id="session" class="session">
        <div id="sessionText"></div>
        <div class="actions">
          <button id="btnContinue" class="btnSmall btnGo" type="button">Teruskan</button>
          <button id="btnSwitch" class="btnSmall btnSwap" type="button">Tukar akaun</button>
        </div>
      </div>

      <label for="email">Email</label>
      <input id="email" class="input" type="email"
        placeholder="contoh: ali@student.com"
        autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" class="input" type="password"
        placeholder="Password"
        autocomplete="current-password" />

      <button id="btnLogin" class="btn-primary btn" type="button">Log Masuk</button>

      <div class="links">
        <a href="./register.html">Daftar akaun baru</a>
        <a href="./reset-password.html">Lupa password?</a>
      </div>

      <div class="row">
        <a class="back" href="../index.html">← balik</a>
        <div class="tiny">Tip Mac: buka Console <span class="kbd">⌥⌘J</span></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function showMsg(type, text){
      const el = $("msg");
      el.className = "msg " + (type === "ok" ? "ok" : "err");
      el.textContent = text;
      el.style.display = "block";
    }

    function getBaseUrl(){
      const cfg = window.APP_CONFIG;
      return (cfg && cfg.BASE_URL) ? cfg.BASE_URL : null;
    }

    async function apiPost(params){
      const BASE_URL = getBaseUrl();
      if (!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud. Semak config.js");

      const body = new URLSearchParams();
      Object.entries(params).forEach(([k,v]) => body.append(k, v ?? ""));

      const res = await fetch(BASE_URL, { method:"POST", body });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Response bukan JSON", raw:text }; }
    }

    function routeByRole(role){
      const r = String(role || "").toLowerCase();
      if (r === "admin") return "../admin/dashboard.html";
      return "./dashboard.html";
    }

    function clearSession(){
      localStorage.removeItem("kk_token");
      localStorage.removeItem("kk_user");
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    async function checkExistingSession(){
      const token = localStorage.getItem("kk_token") || "";
      if(!token) return;

      try{
        const me = await apiPost({ action:"me", token });
        if(!me || !me.ok || !me.user){
          clearSession();
          return;
        }

        const u = me.user;
        $("sessionText").innerHTML =
          `Anda masih log masuk sebagai <strong>${escapeHtml(u.name || u.email || "user")}</strong> (${escapeHtml(u.role || "student")}).`;

        $("session").style.display = "block";

        $("btnContinue").onclick = () => {
          window.location.replace(routeByRole(u.role));
        };

        $("btnSwitch").onclick = () => {
          clearSession();
          $("session").style.display = "none";
          showMsg("ok", "Ok. Sila log masuk guna akaun lain.");
        };

      }catch(e){
        // kalau server down, jangan kacau
      }
    }

    $("btnLogin").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password){
        showMsg("err", "Sila isi email dan password.");
        return;
      }

      $("btnLogin").disabled = true;
      $("btnLogin").textContent = "Log masuk...";

      try{
        const data = await apiPost({ action:"login", email, password });

        if (!data || !data.ok){
          showMsg("err", data?.message || "Log masuk gagal.");
          $("btnLogin").disabled = false;
          $("btnLogin").textContent = "Log Masuk";
          return;
        }

        if (data.token) localStorage.setItem("kk_token", data.token);
        if (data.user)  localStorage.setItem("kk_user", JSON.stringify(data.user));

        const dest = routeByRole(data.user?.role);
        showMsg("ok", "Berjaya. Sedang bawa masuk...");
        window.location.replace(dest);

      }catch(err){
        console.error(err);
        showMsg("err", "Tak dapat connect server. Semak BASE_URL dan Console.");
        $("btnLogin").disabled = false;
        $("btnLogin").textContent = "Log Masuk";
      }
    });

    checkExistingSession();
  </script>
</body>
</html>
