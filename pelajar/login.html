<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Pelajar</title>

  <!-- global theme -->
  <link rel="stylesheet" href="../styles.css" />

  <!-- config (WAJIB) -->
  <script src="../config.js"></script>

  <style>
    /* page layout */
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 26px 16px;
    }
    .box{
      width: min(520px, 92vw);
    }
    .title{
      margin:0 0 6px;
      font-size: 42px;
      line-height:1.05;
      letter-spacing:-0.02em;
      font-weight: 900;
    }
    .sub{
      margin:0 0 18px;
      color: var(--kk-muted);
      font-weight: 600;
    }
    label{
      display:block;
      font-weight: 800;
      margin: 14px 0 8px;
    }
    .input{
      width:100%;
      box-sizing:border-box;
      padding: 14px 14px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.16);
      background: rgba(255,255,255,.70);
      outline: none;
      font-size: 15px;
    }
    .input:focus{
      border-color: rgba(5,150,105,.55);
      box-shadow: 0 0 0 4px rgba(5,150,105,.14);
    }
    .btn{
      width:100%;
      margin-top: 16px;
    }
    .msg{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 800;
      display:none;
    }
    .msg.ok{
      display:block;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.25);
      color: #065f46;
    }
    .msg.err{
      display:block;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.22);
      color: #991b1b;
    }
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top: 14px;
      gap: 10px;
    }
    .back{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      text-decoration:none;
      color: var(--kk-text);
      font-weight: 800;
      opacity:.9;
    }
    .back:hover{ opacity:1; }
    .tiny{
      font-size: 12px;
      color: var(--kk-muted);
      font-weight: 700;
      opacity:.85;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(15,23,42,.18);
      background: rgba(255,255,255,.55);
    }
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <section class="card box">
      <h1 class="title">Login Pelajar</h1>
      <p class="sub">Masuk untuk akses kelas, nota & kuiz.</p>

      <div id="msg" class="msg"></div>

      <label for="email">Email</label>
      <input id="email" class="input" type="email" placeholder="contoh: ali@student.com" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password" />

      <button id="btnLogin" class="btn-primary btn">Log Masuk</button>

      <div class="row">
        <a class="back" href="../index.html">← balik</a>
        <div class="tiny">Tip Mac: buka Console <span class="kbd">⌥⌘J</span></div>
      </div>
    </section>
  </main>

  <script>
    // ===== helpers =====
    const $ = (id) => document.getElementById(id);

    function showMsg(type, text){
      const el = $("msg");
      el.className = "msg " + (type === "ok" ? "ok" : "err");
      el.textContent = text;
    }

    function getBaseUrl(){
      // allow either APP_CONFIG or window.APP_CONFIG (your screenshots show APP_CONFIG exists)
      const cfg = window.APP_CONFIG || window.APP_CONFIG;
      if (!cfg || !cfg.BASE_URL) return null;
      return cfg.BASE_URL;
    }

    // POST as x-www-form-urlencoded (simple request => usually no CORS preflight)
    async function apiPost(params){
      const BASE_URL = getBaseUrl();
      if (!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud. Semak config.js");

      const body = new URLSearchParams();
      Object.entries(params).forEach(([k,v]) => body.append(k, v ?? ""));

      const res = await fetch(BASE_URL, {
        method: "POST",
        body
      });

      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Invalid JSON from server", raw:text }; }
    }

    // ===== page init =====
    console.log("APP_CONFIG:", window.APP_CONFIG);

    $("btnLogin").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password){
        showMsg("err", "Isi email & password dulu.");
        return;
      }

      $("btnLogin").disabled = true;
      $("btnLogin").textContent = "Log masuk...";

      try{
        const data = await apiPost({
          action: "login",
          email,
          password
        });

        if (!data || !data.ok){
          showMsg("err", data?.message || "Login gagal.");
          $("btnLogin").disabled = false;
          $("btnLogin").textContent = "Log Masuk";
          return;
        }

        // simpan token + user
        if (data.token) localStorage.setItem("kk_token", data.token);
        if (data.user)  localStorage.setItem("kk_user", JSON.stringify(data.user));

        showMsg("ok", "Login berjaya. Redirect...");

        // redirect student dashboard
        window.location.href = "./dashboard.html";
      }catch(err){
        console.error(err);
        showMsg("err", "Fetch gagal. Check Console error (URL / CORS).");
        $("btnLogin").disabled = false;
        $("btnLogin").textContent = "Log Masuk";
      }
    });
  </script>
</body>
</html>
