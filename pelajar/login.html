<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Masuk • kura kura hijau</title>

  <!-- global theme -->
  <link rel="stylesheet" href="./styles.css" />
  <!-- config (WAJIB) -->
  <script src="./config.js"></script>

  <style>
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 26px 16px;
    }
    .box{ width: min(520px, 92vw); }
    .title{
      margin:0 0 6px;
      font-size: 42px;
      line-height:1.05;
      letter-spacing:-0.02em;
      font-weight: 900;
    }
    .sub{
      margin:0 0 18px;
      color: var(--kk-muted);
      font-weight: 650;
    }
    label{
      display:block;
      font-weight: 850;
      margin: 14px 0 8px;
    }
    .input{
      width:100%;
      box-sizing:border-box;
      padding: 14px 14px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.16);
      background: rgba(255,255,255,.70);
      outline: none;
      font-size: 15px;
    }
    .input:focus{
      border-color: rgba(5,150,105,.55);
      box-shadow: 0 0 0 4px rgba(5,150,105,.14);
    }
    .btn{ width:100%; margin-top: 16px; }

    .msg{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 850;
      display:none;
    }
    .msg.ok{
      display:block;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.25);
      color: #065f46;
    }
    .msg.err{
      display:block;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.22);
      color: #991b1b;
    }

    .links{
      margin-top: 14px;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      flex-wrap:wrap;
      font-weight: 800;
    }
    .links a{
      color: var(--kk-text);
      opacity:.9;
      text-decoration:none;
    }
    .links a:hover{ opacity:1; text-decoration:underline; }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .back{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      text-decoration:none;
      color: var(--kk-text);
      font-weight: 850;
      opacity:.9;
    }
    .back:hover{ opacity:1; }

    .tiny{
      font-size: 12px;
      color: var(--kk-muted);
      font-weight: 750;
      opacity:.85;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(15,23,42,.18);
      background: rgba(255,255,255,.55);
      font-weight: 900;
    }
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <section class="card box">
      <h1 class="title">Log Masuk</h1>
      <p class="sub">Satu pintu masuk untuk <b>admin</b> & <b>pelajar</b>. Lepas login, sistem auto hantar ikut role.</p>

      <div id="msg" class="msg"></div>

      <label for="email">Email</label>
      <input id="email" class="input" type="email" placeholder="contoh: ali@student.com" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password" />

      <button id="btnLogin" class="btn-primary btn" type="button">Log Masuk</button>

      <div class="links">
        <a href="./register.html">Daftar akaun baru</a>
        <a href="./reset-password.html">Lupa password?</a>
      </div>

      <div class="row">
        <a class="back" href="../index.html">← balik</a>
        <div class="tiny">Tip Mac: buka Console <span class="kbd">⌥⌘J</span></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function showMsg(type, text){
      const el = $("msg");
      el.className = "msg " + (type === "ok" ? "ok" : "err");
      el.textContent = text;
      el.style.display = "block";
    }
    function clearMsg(){
      const el = $("msg");
      el.className = "msg";
      el.textContent = "";
      el.style.display = "none";
    }

    function getBaseUrl(){
      const cfg = window.APP_CONFIG;
      return (cfg && cfg.BASE_URL) ? cfg.BASE_URL : null;
    }

    async function apiPost(params){
      const BASE_URL = getBaseUrl();
      if (!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud. Semak config.js");

      const body = new URLSearchParams();
      Object.entries(params).forEach(([k,v]) => body.append(k, v ?? ""));

      const res = await fetch(BASE_URL, { method:"POST", body });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Response bukan JSON", raw:text }; }
    }

    function readUser(){
      try{
        const raw = localStorage.getItem("kk_user");
        return raw ? JSON.parse(raw) : null;
      }catch(e){
        return null;
      }
    }

    function isAdminUser(user){
      if(!user) return false;
      const role = String(user.role || "").toLowerCase();
      const isAdmin =
        user.isAdmin === true ||
        String(user.isAdmin || "").toLowerCase() === "true" ||
        role === "admin";
      return !!isAdmin;
    }

    function goByRole(user){
      if (isAdminUser(user)){
        window.location.replace("../admin/dashboard.html");
      } else {
        window.location.replace("./dashboard.html");
      }
    }

    // ✅ Auto-redirect kalau user dah ada token (tak payah ingat URL)
    async function tryAutoRedirect(){
      const token = localStorage.getItem("kk_token") || "";
      const user = readUser();

      if(!token) return; // tak ada token, biar login normal

      // cuba verify token & ambil user terkini dari backend
      try{
        const me = await apiPost({ action:"me", token });
        if(me && me.ok && me.user){
          localStorage.setItem("kk_user", JSON.stringify(me.user));
          showMsg("ok", "Sesi masih aktif. Sekejap ya, aku hantar ke dashboard…");
          setTimeout(()=> goByRole(me.user), 450);
          return;
        }
      }catch(e){
        // ignore -> jatuh ke login manual
      }

      // fallback kalau backend down tapi local user ada
      if(user){
        showMsg("ok", "Sesi masih ada. Sekejap ya, aku hantar ke dashboard…");
        setTimeout(()=> goByRole(user), 450);
      }
    }

    $("btnLogin").addEventListener("click", async () => {
      clearMsg();

      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password){
        showMsg("err", "Isi email dan password dulu.");
        return;
      }

      $("btnLogin").disabled = true;
      $("btnLogin").textContent = "Log masuk…";

      try{
        const data = await apiPost({
          action: "login",
          email,
          password
        });

        if (!data || !data.ok){
          showMsg("err", data?.message || "Login gagal.");
          $("btnLogin").disabled = false;
          $("btnLogin").textContent = "Log Masuk";
          return;
        }

        if (data.token) localStorage.setItem("kk_token", data.token);
        if (data.user)  localStorage.setItem("kk_user", JSON.stringify(data.user));

        showMsg("ok", "Login berjaya. Redirect ikut role…");
        setTimeout(()=> goByRole(data.user || null), 450);

      }catch(err){
        console.error(err);
        showMsg("err", "Tak dapat connect server. Check Console.");
        $("btnLogin").disabled = false;
        $("btnLogin").textContent = "Log Masuk";
      }
    });

    // enter key = login
    ["email","password"].forEach(id=>{
      $(id).addEventListener("keydown", (e)=>{
        if(e.key === "Enter") $("btnLogin").click();
      });
    });

    tryAutoRedirect();
  </script>
</body>
</html>
