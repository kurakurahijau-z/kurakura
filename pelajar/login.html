<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Pelajar</title>

  <link rel="stylesheet" href="../styles.css" />

  <style>
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 26px 16px;
    }
    .cardx{
      width: min(520px, 92vw);
    }
    .title{
      margin: 0 0 4px;
      font-size: 34px;
      letter-spacing: -0.02em;
      font-weight: 900;
    }
    .sub{
      margin: 0 0 18px;
      color: var(--kk-muted);
      font-weight: 600;
    }
    label{
      display:block;
      margin: 12px 0 6px;
      font-weight: 800;
    }
    input{
      width:100%;
      box-sizing:border-box;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(2,6,23,.12);
      outline: none;
      background: rgba(255,255,255,.75);
    }
    input:focus{
      border-color: rgba(5,150,105,.45);
      box-shadow: 0 0 0 4px rgba(5,150,105,.12);
    }
    .row{
      display:flex;
      gap: 10px;
      align-items:center;
      margin-top: 14px;
    }
    .btn{
      width:100%;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 900;
    }
    .msg{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      display:none;
      font-weight: 700;
    }
    .msg.err{
      display:block;
      border: 1px solid rgba(220,38,38,.25);
      background: rgba(220,38,38,.08);
      color: #991b1b;
    }
    .msg.ok{
      display:block;
      border: 1px solid rgba(5,150,105,.25);
      background: rgba(5,150,105,.10);
      color: #065f46;
    }
    .tiny{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(15,23,42,.65);
    }
    .tiny code{
      font-weight: 800;
      background: rgba(2,6,23,.06);
      padding: 2px 6px;
      border-radius: 8px;
    }
    .linkback{
      display:inline-block;
      margin-top: 14px;
      color: rgba(15,23,42,.75);
      font-weight: 800;
      text-decoration:none;
    }
    .linkback:hover{ text-decoration: underline; }
  </style>
</head>

<body class="stage">
  <main class="wrap">
    <section class="card cardx">
      <h1 class="title">Login Pelajar</h1>
      <p class="sub">Masuk untuk akses kelas, nota &amp; kuiz.</p>

      <div id="msg" class="msg"></div>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="contoh: ali@student.com" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />

      <div class="row">
        <button id="btnLogin" class="btn-primary btn" type="button">Log Masuk</button>
      </div>

      <div class="tiny">
        Tip Mac: buka Console <code>⌥⌘J</code>
      </div>

      <a class="linkback" href="../index.html">← balik</a>
    </section>
  </main>

  <script>
    // =============================
    // CONFIG — WAJIB BETUL
    // =============================
    // 1) Letak URL /exec kau kat sini (yang ping tadi)
    const BASE_URL = "https://script.google.com/macros/s/AKfycbybvP8q-qNNsVvjbG-MR0KJRmx5qks21gAU_cwJrhJLfF0Vg8HsdD3Avs1Rmz5MUHEo/exec";

    // 2) Lepas login success, backend akan redirect balik ke URL ini
    //    Kita set sebagai current page (pelajar/login.html)
    function currentPageUrl_(){
      return window.location.origin + window.location.pathname;
    }

    // =============================
    // UI helpers
    // =============================
    const $ = (id) => document.getElementById(id);
    const msgEl = $("msg");

    function showErr(t){
      msgEl.className = "msg err";
      msgEl.textContent = t;
      msgEl.style.display = "block";
    }
    function showOk(t){
      msgEl.className = "msg ok";
      msgEl.textContent = t;
      msgEl.style.display = "block";
    }
    function clearMsg(){
      msgEl.style.display = "none";
      msgEl.textContent = "";
      msgEl.className = "msg";
    }

    // =============================
    // TOKEN STORAGE
    // =============================
    function saveSession_(payload){
      // payload: {token, userId, role, name}
      localStorage.setItem("kk_token", payload.token || "");
      localStorage.setItem("kk_userId", payload.userId || "");
      localStorage.setItem("kk_role", payload.role || "");
      localStorage.setItem("kk_name", payload.name || "");
      localStorage.setItem("kk_loginAt", new Date().toISOString());
    }

    function gotoDashboard_(){
      // pelajar dashboard
      window.location.href = "dashboard.html";
    }

    // =============================
    // READ HASH FROM REDIRECT
    // Apps Script will redirect back:
    // pelajar/login.html#token=...&role=student&name=...
    // or #err=...
    // =============================
    function parseHash_(){
      const h = (window.location.hash || "").replace(/^#/, "").trim();
      if(!h) return {};
      const obj = {};
      h.split("&").forEach(pair => {
        const [k, v] = pair.split("=");
        if(!k) return;
        obj[decodeURIComponent(k)] = decodeURIComponent(v || "");
      });
      return obj;
    }

    function clearHash_(){
      // remove hash without reloading
      history.replaceState(null, "", window.location.pathname);
    }

    // =============================
    // LOGIN — redirect flow (NO fetch)
    // =============================
    function doLogin_(){
      clearMsg();

      if(!BASE_URL || BASE_URL.includes("PASTE_URL_EXEC_KAT_SINI")){
        showErr("BASE_URL belum set. Paste URL /exec dulu.");
        return;
      }

      const email = $("email").value.trim();
      const password = $("password").value.trim();

      if(!email || !password){
        showErr("Isi email & password dulu.");
        return;
      }

      const redirect = currentPageUrl_();

      // Redirect to Apps Script:
      // ?action=login&email=...&password=...&redirect=...
      const url = BASE_URL
        + "?action=login"
        + "&email=" + encodeURIComponent(email)
        + "&password=" + encodeURIComponent(password)
        + "&redirect=" + encodeURIComponent(redirect);

      // go (top-level navigation => bypass CORS)
      window.location.href = url;
    }

    // =============================
    // INIT
    // =============================
    (function init(){
      // 1) handle redirect result
      const data = parseHash_();
      if(data.err){
        showErr(data.err);
        clearHash_();
        return;
      }
      if(data.token){
        saveSession_(data);
        showOk("Login berjaya. Redirect ke dashboard...");
        clearHash_();
        setTimeout(gotoDashboard_, 450);
        return;
      }

      // 2) attach actions
      $("btnLogin").addEventListener("click", doLogin_);
      $("password").addEventListener("keydown", (e) => {
        if(e.key === "Enter") doLogin_();
      });

      // 3) if already logged in, go dashboard
      const existing = localStorage.getItem("kk_token");
      if(existing){
        // optional: terus masuk
        // gotoDashboard_();
      }
    })();
  </script>
</body>
</html>
