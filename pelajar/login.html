<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Masuk • kura kura hijau</title>

  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>

  <style>
    .wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 24px 16px; }
    .card{
      width: min(520px, 100%);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, .10);
      padding: 18px;
    }
    h1{ margin: 0 0 6px; font-size: 34px; letter-spacing: -0.02em; }
    .sub{ margin:0 0 14px; color:#334155; font-weight: 800; }
    label{ display:block; margin: 10px 0 6px; font-weight: 900; }
    input{
      width:100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,.15);
      outline:none;
      font-weight: 800;
    }
    input:focus{ border-color: rgba(5,150,105,.55); box-shadow: 0 0 0 4px rgba(5,150,105,.12); }
    .btn{
      margin-top: 12px;
      width:100%;
      border:0;
      cursor:pointer;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 900;
      background:#059669;
      color:#fff;
      box-shadow: 0 8px 18px rgba(5,150,105,.18);
    }
    .btn:hover{ background:#047857; }
    .msg{ display:none; padding: 10px 12px; border-radius: 14px; font-weight: 900; margin: 10px 0 0; }
    .msg.err{ display:block; background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.28); color: #991b1b; }
    .msg.ok{ display:block; background: rgba(34,197,94,.10); border: 1px solid rgba(34,197,94,.28); color: #065f46; }
    .links{ display:flex; justify-content:space-between; gap: 12px; margin-top: 12px; }
    .links a{ font-weight:900; color:#0f172a; text-decoration:none; }
    .links a:hover{ text-decoration:underline; }
    .row{ display:flex; justify-content:space-between; align-items:center; margin-top: 12px; }
    .tiny{ font-size: 12px; font-weight: 900; color:#334155; opacity:.9; }
    .kbd{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 900; padding: 2px 8px; border-radius: 10px; border: 1px solid rgba(15,23,42,.15); background: rgba(255,255,255,.7); }
    .back{ font-weight: 900; color:#0f172a; text-decoration:none; }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <h1>Log Masuk</h1>
      <p class="sub">Satu pintu masuk untuk admin &amp; pelajar. Lepas login, sistem akan hantar automatik ikut peranan.</p>

      <div id="msg" class="msg"></div>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="contoh: ali@student.com" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />

      <button class="btn" id="btnLogin">Log Masuk</button>

      <div class="links">
        <a href="./register.html">Daftar akaun baru</a>
        <a href="./reset-password.html">Lupa password?</a>
      </div>

      <div class="row">
        <a class="back" href="./index.html">← balik</a>
        <div class="tiny">Tip Mac: buka Console <span class="kbd">⌥⌘J</span></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function showMsg(type, text){
      const el = $("msg");
      el.className = "msg " + (type === "ok" ? "ok" : "err");
      el.textContent = text;
      el.style.display = "block";
    }

    function getBaseUrl(){
      const cfg = window.APP_CONFIG;
      if (!cfg || !cfg.BASE_URL) return null;
      return cfg.BASE_URL;
    }

    async function apiPost(params){
      const BASE_URL = getBaseUrl();
      if (!BASE_URL) throw new Error("APP_CONFIG.BASE_URL tak wujud");

      const body = new URLSearchParams();
      Object.entries(params).forEach(([k,v]) => body.append(k, v ?? ""));

      const res = await fetch(BASE_URL, { method:"POST", body });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ return { ok:false, message:"Invalid JSON", raw:text }; }
    }

    function roleRedirect(role){
      const r = String(role || "").toLowerCase();
      if (r === "admin") return "../admin/dashboard.html";
      return "./dashboard.html";
    }

    $("btnLogin").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password){
        showMsg("err", "Isi email & password dulu.");
        return;
      }

      $("btnLogin").disabled = true;
      $("btnLogin").textContent = "Log masuk...";

      try{
        const data = await apiPost({
          action: "login",
          email,
          password
        });

        if (!data || !data.ok){
          showMsg("err", data?.message || "Login gagal.");
          $("btnLogin").disabled = false;
          $("btnLogin").textContent = "Log Masuk";
          return;
        }

        if (data.token) localStorage.setItem("kk_token", data.token);
        if (data.user)  localStorage.setItem("kk_user", JSON.stringify(data.user));

        showMsg("ok", "Login berjaya. Redirect...");
        const dest = roleRedirect(data.user?.role);
        window.location.href = dest;

      }catch(err){
        console.error(err);
        showMsg("err", "Fetch gagal. Check Console.");
        $("btnLogin").disabled = false;
        $("btnLogin").textContent = "Log Masuk";
      }
    });
  </script>
</body>
</html>
